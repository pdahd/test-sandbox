name: Create Content Artifact

on:
  workflow_dispatch:
    inputs:
      content:
        description: "正文内容（不会出现在步骤日志中）"
        required: true
        type: string

      basename:
        description: "文件主名（不含扩展名）"
        required: false
        default: "submitted"
        type: string

      extension:
        description: "扩展名文本框：填写后优先于下拉菜单，例如 md / json / py"
        required: false
        default: ""
        type: string

      extension_choice:
        description: "扩展名下拉菜单"
        required: true
        default: "md"
        type: choice
        options:
          - md
          - json
          - txt
          - csv
          - tsv
          - html
          - xml
          - yaml
          - yml
          - toml
          - ini
          - py
          - js
          - ts
          - sh
          - sql
          - css
          - log

      unescape_newlines:
        description: '把输入中的 \n 转成真正的换行'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  create-artifact:
    name: Create content file
    runs-on: ubuntu-latest

    steps:
      - name: Write file from event payload
        id: write
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          # 正文从事件文件读取，不经过 env 或表达式上下文，因此不会进入日志
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as f:
              event = json.load(f)

          data = event.get("inputs") or {}

          content = data.get("content") or ""
          basename = (data.get("basename") or "submitted").strip()
          typed = (data.get("extension") or "").strip()
          chosen = (data.get("extension_choice") or "md").strip()
          unescape = str(data.get("unescape_newlines", "false")).lower() in ("true", "1", "yes")

          # 文本框优先，其次下拉菜单
          ext = (typed or chosen).lower().lstrip(".").strip()
          if not re.fullmatch(r"[a-z0-9][a-z0-9._-]{0,15}", ext):
              print("error: invalid extension", file=sys.stderr)
              sys.exit(1)

          # 主名清洗，防止路径穿越
          basename = re.sub(r"[^A-Za-z0-9._-]", "_", basename).strip("._") or "submitted"

          if unescape:
              content = content.replace("\\r\\n", "\n").replace("\\n", "\n").replace("\\t", "\t")

          # 仅报告 JSON 是否合法，不打印任何正文
          if ext == "json":
              try:
                  json.loads(content)
                  print("json syntax: valid")
              except json.JSONDecodeError:
                  print("json syntax: invalid (written as-is)")

          out_dir = Path(os.environ["RUNNER_TEMP"]) / "content-artifact"
          out_dir.mkdir(parents=True, exist_ok=True)
          out_file = out_dir / f"{basename}.{ext}"

          with open(out_file, "w", encoding="utf-8", newline="\n") as f:
              f.write(content)

          # 只输出元信息：文件名、扩展名、字节数、行数
          print(f"created  : {out_file.name}")
          print(f"extension: {ext}")
          print(f"bytes    : {out_file.stat().st_size}")
          print(f"lines    : {content.count(chr(10)) + 1}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"filename={out_file.name}\n")
              f.write(f"extension={ext}\n")
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: content-${{ steps.write.outputs.extension }}
          path: ${{ runner.temp }}/content-artifact/
          if-no-files-found: error
