name: Admin - Purge One Stuck Actions Run

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "输入真实 Workflow Run ID（地址栏 /actions/runs/ 后的长数字，不是 #6 或 #1）"
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.run_id }}

    steps:
      - name: Cancel, force-cancel, then delete exact run
        shell: bash
        run: |
          set -u
          set -o pipefail

          REPO="${GITHUB_REPOSITORY}"
          API="repos/${REPO}/actions/runs/${RUN_ID}"

          if ! [[ "${RUN_ID}" =~ ^[0-9]+$ ]]; then
            echo "错误：run_id 必须是纯数字的真实长 ID。"
            echo "不要输入 CI #6 中的 6，也不要输入 Workflow #1 中的 1。"
            exit 1
          fi

          api_call() {
            local title="$1"
            shift

            echo ""
            echo "========== ${title} =========="

            set +e
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$@"
            local rc=$?
            set -e

            echo ""
            echo "[gh exit code: ${rc}]"
            echo "================================"
            return 0
          }

          get_status() {
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${API}" \
              --jq '.status' \
              2>/dev/null
          }

          echo "Repository: ${REPO}"
          echo "Target Run ID: ${RUN_ID}"

          echo ""
          echo "========== 目标 Run 当前信息 =========="
          if ! gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API}"; then
            echo ""
            echo "无法读取该 Run。常见原因："
            echo "1. 输入的不是实际 run_id；"
            echo "2. GITHUB_TOKEN 没有 actions: write/read 权限；"
            echo "3. Run 已不存在。"
            exit 1
          fi

          echo ""
          echo "========== 该 Run 的 Jobs =========="
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API}/jobs" || true

          # 普通取消：成功通常是 HTTP 202
          api_call \
            "1. 请求普通取消（POST /cancel）" \
            -X POST \
            "${API}/cancel"

          echo ""
          echo "等待普通取消状态同步..."
          STATUS=""

          for i in $(seq 1 6); do
            sleep 3

            STATUS="$(get_status || true)"
            echo "第 ${i} 次检查：status=${STATUS:-读取失败}"

            if [ "${STATUS}" = "completed" ]; then
              break
            fi
          done

          # 如果仍未完成，尝试 GitHub 的 force-cancel 端点
          if [ "${STATUS}" != "completed" ]; then
            api_call \
              "2. 请求强制取消（POST /force-cancel）" \
              -X POST \
              "${API}/force-cancel"

            echo ""
            echo "等待强制取消状态同步..."

            for i in $(seq 1 10); do
              sleep 3

              STATUS="$(get_status || true)"
              echo "强制取消后第 ${i} 次检查：status=${STATUS:-读取失败}"

              if [ "${STATUS}" = "completed" ]; then
                break
              fi
            done
          fi

          # 尝试删除。即使状态仍显示 queued，也记录真实 API 结果。
          api_call \
            "3. 删除 Workflow Run（DELETE）" \
            -X DELETE \
            "${API}"

          echo ""
          echo "========== 最终核验 =========="

          set +e
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API}" \
            >/dev/null 2>&1
          CHECK_RC=$?
          set -e

          if [ "${CHECK_RC}" -ne 0 ]; then
            echo "✅ 目标 Run 已无法读取：通常表示已经被成功删除。"
            exit 0
          fi

          echo "❌ Run 仍然存在，未能由 REST API 删除。"
          echo "请保留本次日志中的 HTTP 响应、错误消息与 X-GitHub-Request-Id。"
          echo "这通常意味着 GitHub Actions 后端存在卡住或不一致的 Run 状态。"
          exit 1
