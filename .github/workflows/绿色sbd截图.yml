name: Scenarist BD 单文件便携版v15.1测试

on:
  workflow_dispatch:

env:
  # v15.1 专属单文件直接下载直链
  PKG_URL: "https://1009.filemail.com/api/file/get?filekey=AT0V9kPCE32T2FBcftU6b4HTfELPa5b-ZSYElVp0QSsaLMDW1Lxy1FdoTfnWlZ5WnZd_skYF35NgV_MX9A6o3id8h0HT_fM3VWR2Iz4ZBkmulAg7"
  OUT: ${{ github.workspace }}\out

jobs:
  run-single-portable:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell

    steps:
      # ------------------------------------------------------------------
      - name: 1. Initialize directories
        run: |
          New-Item -ItemType Directory -Force "$env:OUT\shots","$env:OUT\logs" | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $scr = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Write-Host "Screen Resolution: $($scr.Width)x$($scr.Height)"

      # ------------------------------------------------------------------
      - name: 2. Download Single Portable Executable
        run: |
          $singleExe = "$env:RUNNER_TEMP\ScenaristBD_SinglePortable_v15.1_2026-11-1_YLX.exe"
          Write-Host "Downloading Single Portable Executable v15.1..."
          curl.exe -L --fail --retry 3 -A "Mozilla/5.0" -o $singleExe "$env:PKG_URL"
          if ($LASTEXITCODE -ne 0) { throw "Download failed (exit $LASTEXITCODE)" }
          
          Write-Host "Downloaded: $((Get-Item $singleExe).Length / 1MB) MB"
          "APP_EXE=$singleExe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      # ------------------------------------------------------------------
      - name: 3. Launch Single Portable Executable & Wait for Main Window
        timeout-minutes: 10
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          
          Write-Host "Launching Single Portable Executable v15.1 directly..."
          $p = Start-Process -FilePath $env:APP_EXE -PassThru
          
          $winDetectCode = '
          using System;
          using System.Text;
          using System.Runtime.InteropServices;

          public static class WinHelper {
            public delegate bool EnumProc(IntPtr hWnd, IntPtr lParam);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc cb, IntPtr l);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr hWnd, out uint lpdwProcessId);

            public static string FindScenaristTitle(uint pid) {
              string result = "";
              EnumWindows(delegate(IntPtr hWnd, IntPtr lParam) {
                if (IsWindowVisible(hWnd)) {
                  uint procId;
                  GetWindowThreadProcessId(hWnd, out procId);
                  if (procId == pid) {
                    StringBuilder sb = new StringBuilder(1024);
                    GetWindowText(hWnd, sb, 1024);
                    string t = sb.ToString();
                    if (!string.IsNullOrEmpty(t) && t.Contains("Scenarist")) {
                      result = t;
                      return false;
                    }
                  }
                }
                return true;
              }, IntPtr.Zero);
              return result;
            }
          }
          '
          Add-Type -TypeDefinition $winDetectCode
          
          # --- 智能轮询等待：等待组件安装完成并唤起主界面（最多等待 4 分钟）---
          Write-Host "Waiting for environment initialization and ScenaristBD main window..."
          $maxWaitSeconds = 240
          $elapsed = 0
          $sbdProc = $null
          $foundTitle = ""

          while ($elapsed -lt $maxWaitSeconds) {
            Start-Sleep -Seconds 5
            $elapsed += 5
            
            $sbdProc = Get-Process -Name "ScenaristBD" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($sbdProc) {
              $sbdProc.Refresh()
              $foundTitle = [WinHelper]::FindScenaristTitle([uint32]$sbdProc.Id)
              if (-not [string]::IsNullOrEmpty($foundTitle)) {
                Write-Host "Main window detected after ${elapsed}s! Title: '$foundTitle'"
                break
              }
            }
            Write-Host "Elapsed: ${elapsed}s... (Installing components or launching)"
          }

          # 稳妥等待 2 秒让 UI 渲染定型
          Start-Sleep -Seconds 2

          # --- 进程与窗口标题追踪诊断 ---
          $diagLog = "$env:OUT\logs\process_diagnostics.txt"
          "==========================================" | Out-File $diagLog -Encoding utf8
          "PROCESS RUNTIME DIAGNOSTICS & SYSTEM LOGS" | Out-File $diagLog -Append -Encoding utf8
          "==========================================" | Out-File $diagLog -Append -Encoding utf8
          
          if ($sbdProc) {
            $sbdProc.Refresh()
            if ([string]::IsNullOrEmpty($foundTitle)) {
              $foundTitle = [WinHelper]::FindScenaristTitle([uint32]$sbdProc.Id)
            }
            "ScenaristBD Process ID: $($sbdProc.Id)" | Out-File $diagLog -Append -Encoding utf8
            "MainWindowHandle: $($sbdProc.MainWindowHandle)" | Out-File $diagLog -Append -Encoding utf8
            "MainWindowTitle: '$foundTitle'" | Out-File $diagLog -Append -Encoding utf8
          } else {
            "Launcher Process ID: $($p.Id) (Exited: $($p.HasExited))" | Out-File $diagLog -Append -Encoding utf8
          }

          # 提取并输出单文件内置安装器的完整安装日志
          $loaderLog = "$env:TEMP\ScenaristBD_SinglePortable\install_log.txt"
          "------------------------------------------" | Out-File $diagLog -Append -Encoding utf8
          "SINGLE PORTABLE AUTO-INSTALLATION LOG" | Out-File $diagLog -Append -Encoding utf8
          "------------------------------------------" | Out-File $diagLog -Append -Encoding utf8
          if (Test-Path $loaderLog) {
            Get-Content $loaderLog | Out-File $diagLog -Append -Encoding utf8
            Write-Host "=== Auto-Installation Log from Sandbox ==="
            Get-Content $loaderLog
          } else {
            "Warning: install_log.txt not found yet." | Out-File $diagLog -Append -Encoding utf8
          }

          "------------------------------------------" | Out-File $diagLog -Append -Encoding utf8
          "WINDOWS EVENT LOGS (Application / System Errors)" | Out-File $diagLog -Append -Encoding utf8
          "------------------------------------------" | Out-File $diagLog -Append -Encoding utf8
          Get-EventLog -LogName Application -Newest 30 -EntryType Error,Warning -EA SilentlyContinue |
            Format-List TimeGenerated, Source, EventID, Message | Out-String | Out-File $diagLog -Append -Encoding utf8

          # 隐藏终端窗口，截取主界面
          $minCode = '
          using System;
          using System.Text;
          using System.Runtime.InteropServices;

          public static class WinConsoleMin {
            public delegate bool EnumProc(IntPtr hWnd, IntPtr lParam);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc cb, IntPtr l);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int c);

            public static void HideConsoles() {
              EnumWindows(delegate(IntPtr hWnd, IntPtr lParam) {
                if (IsWindowVisible(hWnd)) {
                  StringBuilder sb = new StringBuilder(1024);
                  GetWindowText(hWnd, sb, 1024);
                  string t = sb.ToString();
                  if (!string.IsNullOrEmpty(t) && (t.Contains("ProgramData\\GitHub") || t.Contains("hosted-compute") || t.Contains("Runner.Listener") || t.Contains("cmd.exe") || t.Contains("powershell") || t.Contains("WindowsTerminal"))) {
                    ShowWindow(hWnd, 6);
                  }
                }
                return true;
              }, IntPtr.Zero);
            }
          }
          '
          Add-Type -TypeDefinition $minCode
          [WinConsoleMin]::HideConsoles()
          Start-Sleep -Seconds 2

          # 截取全屏高清画面
          $scr = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $b = New-Object System.Drawing.Bitmap $scr.Width, $scr.Height
          $g = [System.Drawing.Graphics]::FromImage($b)
          $g.CopyFromScreen(0,0,0,0,$b.Size)
          $b.Save("$env:OUT\shots\ScenaristBD_SinglePortable_v15_1_Running.png")
          $g.Dispose(); $b.Dispose()
          
          Write-Host "Screenshot saved to out/shots/ScenaristBD_SinglePortable_v15_1_Running.png"

      # ------------------------------------------------------------------
      - name: 4. Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scenarist-bd-v15-1-portable-results
          path: out
