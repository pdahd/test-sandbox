name: 🧲 Aria2 Torrent Downloader

on:
  workflow_dispatch:
    inputs:
      source:
        description: >-
          必填：.torrent 直链、magnet 磁力链，或单条 curl 命令。
          例如：curl -L -OJ -e "https://example.com/page" "https://example.com/file"
        required: true
        type: string

      mode:
        description: 运行模式
        required: true
        default: parse
        type: choice
        options:
          - parse
          - download_all
          - download_selected

      file_ids:
        description: >-
          download_selected 模式使用。
          填写 parse 日志中的文件 ID，例如：1,3,5-8
        required: false
        default: ""
        type: string

      referer:
        description: >-
          可选。直链模式的 Referer。留空时自动尝试 ;auto、同源根、上级路径。
          例如：https://dropmefiles.com/Z9E1c
        required: false
        default: ""
        type: string

      metadata_timeout:
        description: 磁力链接获取 metadata 的最长时间（秒）
        required: false
        default: "300"
        type: string

      seed_time:
        description: 下载完成后继续做种秒数，0 表示下载完成后退出
        required: false
        default: "0"
        type: string

permissions:
  contents: read

jobs:
  aria2:
    name: "${{ inputs.mode }} · Aria2"
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      INPUT_SOURCE: ${{ inputs.source }}
      INPUT_MODE: ${{ inputs.mode }}
      INPUT_FILE_IDS: ${{ inputs.file_ids }}
      INPUT_REFERER: ${{ inputs.referer }}
      INPUT_METADATA_TIMEOUT: ${{ inputs.metadata_timeout }}
      INPUT_SEED_TIME: ${{ inputs.seed_time }}

      WORK_DIR: ${{ github.workspace }}/aria2-work
      TORRENT_DIR: ${{ github.workspace }}/aria2-work/torrents
      META_DIR: ${{ github.workspace }}/aria2-work/metadata
      OUTPUT_DIR: ${{ github.workspace }}/downloads

    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 安装 aria2 和 curl
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 curl file

          echo "==== aria2 版本 ===="
          aria2c --version | head -n 3

          echo "==== curl 版本 ===="
          curl --version | head -n 1

      - name: 创建工作目录
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$WORK_DIR"
          mkdir -p "$TORRENT_DIR"
          mkdir -p "$META_DIR"
          mkdir -p "$OUTPUT_DIR"

          echo "WORK_DIR=$WORK_DIR"
          echo "TORRENT_DIR=$TORRENT_DIR"
          echo "OUTPUT_DIR=$OUTPUT_DIR"

      - name: 创建种子解析和验证工具
        shell: bash
        run: |
          set -Eeuo pipefail

          cat > "$WORK_DIR/torrent_tools.py" <<'PY'
          #!/usr/bin/env python3

          import json
          import os
          import sys
          from pathlib import Path


          class TorrentError(Exception):
              pass


          def bdecode(data: bytes):
              def parse(pos):
                  if pos >= len(data):
                      raise TorrentError(f"bencode 数据意外结束，位置 {pos}")

                  ch = data[pos:pos + 1]

                  if ch == b"i":
                      end = data.find(b"e", pos + 1)
                      if end < 0:
                          raise TorrentError("整数缺少结束符")
                      raw = data[pos + 1:end]
                      if not raw:
                          raise TorrentError("整数为空")
                      return int(raw), end + 1

                  if ch == b"l":
                      pos += 1
                      result = []
                      while True:
                          if pos >= len(data):
                              raise TorrentError("列表意外结束")
                          if data[pos:pos + 1] == b"e":
                              return result, pos + 1
                          value, pos = parse(pos)
                          result.append(value)

                  if ch == b"d":
                      pos += 1
                      result = {}
                      while True:
                          if pos >= len(data):
                              raise TorrentError("字典意外结束")
                          if data[pos:pos + 1] == b"e":
                              return result, pos + 1
                          key, pos = parse(pos)
                          if not isinstance(key, bytes):
                              raise TorrentError("字典键不是 bytes")
                          value, pos = parse(pos)
                          result[key] = value

                  if b"0" <= ch <= b"9":
                      colon = data.find(b":", pos)
                      if colon < 0:
                          raise TorrentError("字符串长度缺少冒号")
                      try:
                          length = int(data[pos:colon])
                      except Exception:
                          raise TorrentError("字符串长度无效")
                      if length < 0:
                          raise TorrentError("字符串长度不能为负数")
                      start = colon + 1
                      end = start + length
                      if end > len(data):
                          raise TorrentError("字符串超出数据范围")
                      return data[start:end], end

                  raise TorrentError(
                      f"无效 bencode 字节 {data[pos:pos + 1]!r}，位置 {pos}"
                  )

              value, end_pos = parse(0)
              trailing = data[end_pos:].strip()
              if trailing:
                  raise TorrentError("bencode 数据后存在无法解析的额外内容")
              return value


          def text(value):
              if isinstance(value, bytes):
                  return value.decode("utf-8", "replace")
              if value is None:
                  return ""
              return str(value)


          def human_size(size):
              value = float(size)
              for unit in ("B", "KB", "MB", "GB", "TB"):
                  if value < 1024 or unit == "TB":
                      if unit == "B":
                          return f"{value:.0f} {unit}"
                      return f"{value:.2f} {unit}"
                  value /= 1024
              return f"{value:.2f} TB"


          def parse_torrent(path):
              path = Path(path)
              if not path.is_file():
                  raise TorrentError(f"文件不存在：{path}")

              raw = path.read_bytes()
              meta = bdecode(raw)

              if not isinstance(meta, dict):
                  raise TorrentError("torrent 顶层不是字典")
              if b"info" not in meta:
                  raise TorrentError("torrent 中缺少 info 字段")

              info = meta[b"info"]
              if not isinstance(info, dict):
                  raise TorrentError("torrent 的 info 字段不是字典")

              name_raw = info.get(b"name.utf-8", info.get(b"name", b"untitled"))
              torrent_name = text(name_raw) or "untitled"
              files = []

              if b"files" in info:
                  torrent_files = info[b"files"]
                  if not isinstance(torrent_files, list):
                      raise TorrentError("torrent 的 files 字段无效")

                  for file_id, item in enumerate(torrent_files, start=1):
                      if not isinstance(item, dict):
                          continue
                      path_key = b"path.utf-8" if b"path.utf-8" in item else b"path"
                      parts = item.get(path_key, [])
                      if not isinstance(parts, list):
                          parts = []
                      relative_path = "/".join(text(x) for x in parts)
                      if not relative_path:
                          relative_path = f"file_{file_id}"
                      size = int(item.get(b"length", 0))
                      files.append({
                          "id": file_id,
                          "path": relative_path,
                          "size": size,
                          "size_text": human_size(size),
                      })
              else:
                  size = int(info.get(b"length", 0))
                  files.append({
                      "id": 1,
                      "path": torrent_name,
                      "size": size,
                      "size_text": human_size(size),
                  })

              total_size = sum(item["size"] for item in files)
              return {
                  "torrent_name": torrent_name,
                  "file_count": len(files),
                  "total_size": total_size,
                  "total_size_text": human_size(total_size),
                  "files": files,
              }


          def print_human(result):
              print("")
              print("=" * 110)
              print(f"种子名称：{result['torrent_name']}")
              print(f"文件数量：{result['file_count']}")
              print(f"总大小：  {result['total_size_text']}")
              print("=" * 110)
              print(f"{'ID':>6} | {'大小':>14} | 文件路径")
              print("-" * 110)
              for item in result["files"]:
                  print(f"{item['id']:>6} | {item['size_text']:>14} | {item['path']}")
              print("=" * 110)


          if __name__ == "__main__":
              if len(sys.argv) < 2:
                  raise SystemExit("用法：torrent_tools.py <torrent文件> [--json]")
              result = parse_torrent(sys.argv[1])
              if "--json" in sys.argv:
                  print(json.dumps(result, ensure_ascii=False))
              else:
                  print_human(result)
          PY

          chmod +x "$WORK_DIR/torrent_tools.py"

      - name: 获取并验证种子
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - "$TORRENT_DIR" "$WORK_DIR/torrent_tools.py" <<'PY'
          import base64
          import os
          import shlex
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path
          from urllib.parse import urlsplit, urlunsplit


          source = os.environ.get("INPUT_SOURCE", "").strip()
          manual_referer = os.environ.get("INPUT_REFERER", "").strip()
          torrent_dir = Path(sys.argv[1])
          parser_path = Path(sys.argv[2])

          torrent_dir.mkdir(parents=True, exist_ok=True)

          if not source:
              print("::error::source 不能为空")
              raise SystemExit(1)


          def write_output(name, value):
              output_file = os.environ["GITHUB_OUTPUT"]
              marker = "EOF_" + base64.b16encode(os.urandom(8)).decode()
              with open(output_file, "a", encoding="utf-8") as fp:
                  fp.write(f"{name}<<{marker}\n")
                  fp.write(str(value))
                  fp.write("\n")
                  fp.write(f"{marker}\n")


          def is_valid_torrent(path):
              try:
                  result = subprocess.run(
                      [sys.executable, str(parser_path), str(path), "--json"],
                      capture_output=True, text=True, timeout=60,
                  )
                  if result.returncode != 0:
                      return False, result.stderr.strip()
                  return True, result.stdout.strip()
              except Exception as exc:
                  return False, str(exc)


          def inspect_response(path):
              print(f"文件路径：{path}")
              print(f"文件大小：{path.stat().st_size} bytes")
              try:
                  fr = subprocess.run(
                      ["file", "-b", str(path)],
                      capture_output=True, text=True, timeout=15,
                  )
                  print("file 类型：", fr.stdout.strip())
              except Exception:
                  pass
              try:
                  head = path.read_bytes()[:256]
                  print("前 256 字节：", repr(head))
              except Exception:
                  pass


          def candidate_files(root):
              result = [x for x in root.rglob("*") if x.is_file()]
              return sorted(result, key=lambda x: x.stat().st_mtime, reverse=True)


          # ========================================================
          # magnet
          # ========================================================
          if source.startswith("magnet:"):
              write_output("source_kind", "magnet")
              write_output("source_value", source)
              print("检测到 magnet 磁力链接")
              raise SystemExit(0)


          temp_dir = Path(tempfile.mkdtemp(prefix="source_", dir=str(torrent_dir.parent)))
          response_stderr = ""


          def curl_download(url, out_path, referer=None, extra=None):
              """执行一次 curl 直链下载，返回 (returncode, stderr_text)。"""
              cmd = [
                  "curl",
                  "--location",
                  "--fail",
                  "--show-error",
                  "--silent",
                  "--retry", "3",
                  "--retry-delay", "2",
                  "--connect-timeout", "30",
                  "--max-time", "300",
                  "--user-agent", "Mozilla/5.0",
              ]
              if referer is not None:
                  cmd += ["-e", referer]
              if extra:
                  cmd += list(extra)
              cmd += ["--output", str(out_path), url]

              print("执行：", " ".join(shlex.quote(c) for c in cmd))
              result = subprocess.run(cmd, capture_output=True, timeout=330)
              stderr = (result.stderr or b"").decode("utf-8", "replace")
              if stderr.strip():
                  print(stderr[-1500:])
              return result.returncode, stderr


          def referer_candidates(url, manual):
              """按优先级生成直链的 Referer 尝试序列。"""
              seq = []

              # 0. 用户手动指定的 Referer（最高优先级）
              if manual:
                  seq.append(("手动指定 Referer", manual))

              # 1. ;auto —— 有跳转时自动用上一跳 URL 作为 Referer
              seq.append(("Referer=;auto", ";auto"))

              parts = urlsplit(url)
              origin = urlunsplit((parts.scheme, parts.netloc, "/", "", ""))

              # 2. 同源根
              seq.append(("同源根 Referer", origin))

              # 3. 去掉最后一段路径的上级页面
              path = parts.path.rstrip("/")
              if "/" in path:
                  parent = path.rsplit("/", 1)[0] or "/"
                  parent_url = urlunsplit((parts.scheme, parts.netloc, parent, "", ""))
                  if parent_url not in (origin, url):
                      seq.append(("上级路径 Referer", parent_url))

              # 4. 去掉两段路径（很多站点详情页在更上一层）
              segments = [s for s in path.split("/") if s]
              if len(segments) >= 2:
                  grand = "/" + "/".join(segments[:-2])
                  grand_url = urlunsplit((parts.scheme, parts.netloc, grand, "", ""))
                  if grand_url not in (origin, url):
                      seq.append(("上上级路径 Referer", grand_url))

              # 5. 不带 Referer（兜底）
              seq.append(("无 Referer", None))
              return seq


          try:
              # ----------------------------------------------------
              # 直链：多重 Referer 回退
              # ----------------------------------------------------
              if source.startswith("http://") or source.startswith("https://"):
                  print("检测到 HTTP(S) 种子直链，将按多种 Referer 策略尝试")

                  final_torrent = None

                  for label, ref in referer_candidates(source, manual_referer):
                      attempt_path = temp_dir / f"try_{base64.b16encode(os.urandom(4)).decode()}.bin"

                      print("")
                      print(f"---- 尝试：{label} ----")

                      # -L 与 ;auto 搭配才有意义，这里总是带 -L
                      rc, err = curl_download(source, attempt_path, referer=ref)
                      response_stderr = err

                      if rc != 0 or not attempt_path.exists() or attempt_path.stat().st_size < 10:
                          print(f"该策略下载失败或结果过小（rc={rc}）")
                          continue

                      valid, detail = is_valid_torrent(attempt_path)
                      if valid:
                          print(f"成功：{label} 得到有效 torrent")
                          final_torrent = attempt_path
                          break
                      else:
                          print(f"该策略返回的不是种子：")
                          inspect_response(attempt_path)

                  if final_torrent is None:
                      print("")
                      print("::error::所有 Referer 策略均未获取到有效 torrent")
                      print("多为服务器返回 HTML 中间页或需要正确 Referer/Cookie。")
                      print("建议：改用带 Referer 的 curl 命令，或在 referer 输入框手动填写详情页。")
                      raise SystemExit(1)

                  final_path = torrent_dir / "source.torrent"
                  shutil.copy2(final_torrent, final_path)

              # ----------------------------------------------------
              # 单条 curl 命令
              # ----------------------------------------------------
              elif source.startswith("curl"):
                  print("检测到 curl 命令")

                  try:
                      args = shlex.split(source)
                  except ValueError as exc:
                      raise SystemExit(f"curl 命令解析失败：{exc}")

                  if not args or args[0] != "curl":
                      raise SystemExit("命令必须以 curl 开头")

                  forbidden = {"&&", "||", ";", "|", "`", "$(", ")"}
                  if any(tok in forbidden for tok in args):
                      raise SystemExit("curl 命令不能包含 &&、||、;、|、`、$( 等 shell 操作符")

                  print("实际执行参数：", args)
                  result = subprocess.run(
                      args, cwd=str(temp_dir), capture_output=True, timeout=330,
                  )
                  stdout = result.stdout or b""
                  stderr = (result.stderr or b"").decode("utf-8", "replace")
                  response_stderr = stderr

                  if stderr.strip():
                      print("curl stderr：")
                      print(stderr[-2000:])

                  if result.returncode != 0:
                      raise SystemExit(f"curl 执行失败，退出码：{result.returncode}")

                  # 用户 curl 无 -o/-O 时，stdout 可能就是种子
                  if stdout:
                      stdout_path = temp_dir / "stdout_response.bin"
                      try:
                          stdout_path.write_bytes(stdout)
                          valid, _ = is_valid_torrent(stdout_path)
                          if valid:
                              print("检测到 stdout 中包含有效 torrent")
                          else:
                              stdout_path.unlink(missing_ok=True)
                      except Exception:
                          pass

                  print("")
                  print("查找并验证 curl 下载结果……")
                  valid_list = []
                  for cand in candidate_files(temp_dir):
                      ok, _ = is_valid_torrent(cand)
                      if ok:
                          valid_list.append(cand)
                          print(f"发现有效 torrent：{cand}")
                      else:
                          print(f"跳过非 torrent：{cand}")

                  if not valid_list:
                      print("::error::curl 未产生有效 torrent")
                      for cand in candidate_files(temp_dir):
                          inspect_response(cand)
                      if response_stderr:
                          print(response_stderr[-3000:])
                      raise SystemExit(1)

                  valid_list.sort(key=lambda x: x.stat().st_mtime, reverse=True)
                  final_path = torrent_dir / "source.torrent"
                  shutil.copy2(valid_list[0], final_path)

              else:
                  raise SystemExit("source 必须是 magnet、HTTP(S) URL 或 curl 命令")

              # ----------------------------------------------------
              # 统一校验
              # ----------------------------------------------------
              valid, detail = is_valid_torrent(final_path)
              if not valid:
                  raise SystemExit("统一后的 source.torrent 验证失败")

              write_output("source_kind", "torrent")
              write_output("source_value", str(final_path))

              print("")
              print("种子获取并验证成功：")
              inspect_response(final_path)

          finally:
              shutil.rmtree(temp_dir, ignore_errors=True)
          PY

      - name: 磁力链接获取 metadata
        id: metadata
        if: ${{ steps.source.outputs.source_kind == 'magnet' && (inputs.mode == 'parse' || inputs.mode == 'download_selected') }}
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$META_DIR"

          echo "开始获取磁力 metadata"
          echo "最长等待：${INPUT_METADATA_TIMEOUT} 秒"

          aria2c \
            --bt-metadata-only=true \
            --bt-save-metadata=true \
            --seed-time=0 \
            --bt-stop-timeout="$INPUT_METADATA_TIMEOUT" \
            --timeout=60 \
            --connect-timeout=30 \
            --summary-interval=5 \
            --console-log-level=notice \
            --dir="$META_DIR" \
            "${{ steps.source.outputs.source_value }}"

          META_TORRENT="$(
            python3 - "$META_DIR" <<'PY'
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          candidates = []
          for item in root.rglob("*"):
              if not item.is_file():
                  continue
              try:
                  raw = item.read_bytes()
                  if raw.startswith(b"d") and b"info" in raw:
                      candidates.append(item)
              except OSError:
                  pass
          if not candidates:
              raise SystemExit(1)
          candidates.sort(key=lambda x: x.stat().st_mtime, reverse=True)
          print(candidates[0])
          PY
          )"

          if [[ -z "$META_TORRENT" || ! -f "$META_TORRENT" ]]; then
            echo "::error::未获取到磁力 metadata。"
            echo "可能原因：没有可用做种者、metadata 超时、磁力链接无效。"
            exit 1
          fi

          cp "$META_TORRENT" "$TORRENT_DIR/metadata.torrent"

          echo "torrent_path=$TORRENT_DIR/metadata.torrent" >> "$GITHUB_OUTPUT"

          echo "metadata 获取成功："
          ls -lh "$TORRENT_DIR/metadata.torrent"

      - name: 确定解析用 torrent 文件
        id: torrent
        if: ${{ inputs.mode == 'parse' || inputs.mode == 'download_selected' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "${{ steps.source.outputs.source_kind }}" == "torrent" ]]; then
            TORRENT_PATH="${{ steps.source.outputs.source_value }}"
          else
            TORRENT_PATH="${{ steps.metadata.outputs.torrent_path }}"
          fi

          if [[ -z "$TORRENT_PATH" || ! -f "$TORRENT_PATH" ]]; then
            echo "::error::解析用 torrent 文件不存在"
            exit 1
          fi

          echo "path=$TORRENT_PATH" >> "$GITHUB_OUTPUT"
          echo "解析文件：$TORRENT_PATH"

      - name: 解析种子并打印文件 ID
        if: ${{ inputs.mode == 'parse' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "::group::种子文件列表"
          python3 "$WORK_DIR/torrent_tools.py" \
            "${{ steps.torrent.outputs.path }}"
          echo "::endgroup::"

          echo ""
          echo "解析完成。"
          echo "请记下文件 ID，然后再次运行工作流："
          echo "mode: download_selected"
          echo "file_ids: 例如 1,3,5-8"

      - name: 验证指定文件 ID
        id: selected
        if: ${{ inputs.mode == 'download_selected' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          IDS="$INPUT_FILE_IDS"

          if [[ -z "${IDS//[[:space:]]/}" ]]; then
            echo "::error::download_selected 模式必须填写 file_ids，例如 1,3,5-8"
            exit 1
          fi

          export TORRENT_PATH="${{ steps.torrent.outputs.path }}"
          export IDS_TEXT="$IDS"

          SELECT_CSV="$(
            python3 - "$WORK_DIR/torrent_tools.py" <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          parser = sys.argv[1]
          torrent_path = os.environ["TORRENT_PATH"]
          ids_text = os.environ["IDS_TEXT"].strip()

          result = subprocess.run(
              [sys.executable, parser, torrent_path, "--json"],
              capture_output=True, text=True, check=True,
          )
          data = json.loads(result.stdout)
          valid_ids = {int(item["id"]) for item in data["files"]}

          selected = set()
          for token in re.split(r"[\s,]+", ids_text):
              token = token.strip()
              if not token:
                  continue
              if re.fullmatch(r"\d+", token):
                  selected.add(int(token))
                  continue
              match = re.fullmatch(r"(\d+)\s*-\s*(\d+)", token)
              if match:
                  start = int(match.group(1))
                  end = int(match.group(2))
                  if end < start:
                      raise SystemExit(f"无效范围：{token}")
                  selected.update(range(start, end + 1))
                  continue
              raise SystemExit(f"无法识别的文件 ID 格式：{token}")

          invalid = sorted(selected - valid_ids)
          if invalid:
              raise SystemExit("以下文件 ID 不存在：" + ",".join(str(x) for x in invalid))
          if not selected:
              raise SystemExit("没有选中任何文件")

          print(",".join(str(x) for x in sorted(selected)))
          PY
          )"

          echo "select_csv=$SELECT_CSV" >> "$GITHUB_OUTPUT"
          echo "已验证文件 ID：$SELECT_CSV"

          echo "::group::已选文件详情"
          python3 - "$WORK_DIR/torrent_tools.py" "$SELECT_CSV" <<'PY'
          import json
          import subprocess
          import sys
          import os

          parser = sys.argv[1]
          selected = {int(x) for x in sys.argv[2].split(",")}
          torrent_path = os.environ["TORRENT_PATH"]

          result = subprocess.run(
              [sys.executable, parser, torrent_path, "--json"],
              capture_output=True, text=True, check=True,
          )
          data = json.loads(result.stdout)
          total = 0
          count = 0
          for item in data["files"]:
              if int(item["id"]) in selected:
                  count += 1
                  total += int(item["size"])
                  print(f"[{item['id']}] {item['size_text']:>14}  {item['path']}")
          print("-" * 100)
          print(f"选中文件数：{count}")
          print(f"总大小：{total / 1024 / 1024 / 1024:.2f} GB")
          PY
          echo "::endgroup::"

      - name: 下载全部文件
        if: ${{ inputs.mode == 'download_all' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          SOURCE_VALUE="${{ steps.source.outputs.source_value }}"

          echo "下载模式：全部文件"
          echo "输出目录：$OUTPUT_DIR"

          aria2c \
            --dir="$OUTPUT_DIR" \
            --seed-time="$INPUT_SEED_TIME" \
            --max-connection-per-server=16 \
            --split=16 \
            --min-split-size=4M \
            --max-concurrent-downloads=5 \
            --continue=true \
            --auto-file-renaming=true \
            --allow-overwrite=false \
            --file-allocation=none \
            --disk-cache=64M \
            --summary-interval=5 \
            --console-log-level=notice \
            --bt-max-peers=120 \
            --bt-request-peer-speed-limit=20M \
            --bt-stop-timeout=600 \
            "$SOURCE_VALUE"

      - name: 下载指定文件
        if: ${{ inputs.mode == 'download_selected' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          TORRENT_PATH="${{ steps.torrent.outputs.path }}"
          SELECT_CSV="${{ steps.selected.outputs.select_csv }}"

          echo "下载模式：指定文件"
          echo "指定文件 ID：$SELECT_CSV"
          echo "输出目录：$OUTPUT_DIR"

          aria2c \
            --dir="$OUTPUT_DIR" \
            --seed-time="$INPUT_SEED_TIME" \
            --max-connection-per-server=16 \
            --split=16 \
            --min-split-size=4M \
            --max-concurrent-downloads=5 \
            --continue=true \
            --auto-file-renaming=true \
            --allow-overwrite=false \
            --file-allocation=none \
            --disk-cache=64M \
            --summary-interval=5 \
            --console-log-level=notice \
            --bt-max-peers=120 \
            --bt-request-peer-speed-limit=20M \
            --bt-stop-timeout=600 \
            --select-file="$SELECT_CSV" \
            --bt-remove-unselected-file=true \
            "$TORRENT_PATH"

      - name: 输出下载结果
        if: ${{ success() && (inputs.mode == 'download_all' || inputs.mode == 'download_selected') }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "==== 下载结果 ===="

          if [[ -z "$(find "$OUTPUT_DIR" -mindepth 1 -print -quit)" ]]; then
            echo "::warning::下载目录为空"
          else
            find "$OUTPUT_DIR" \
              -maxdepth 6 \
              -type f \
              -printf '%s bytes\t%p\n' \
              | sort -n
          fi

          echo ""
          echo "==== 磁盘占用 ===="
          du -sh "$OUTPUT_DIR" || true

      - name: 上传下载工件
        if: ${{ success() && (inputs.mode == 'download_all' || inputs.mode == 'download_selected') }}
        uses: actions/upload-artifact@v6
        with:
          name: aria2-download-${{ github.run_number }}
          path: downloads/
          if-no-files-found: warn
          compression-level: 0
