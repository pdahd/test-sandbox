name: 🧲 Aria2 Torrent Downloader

on:
  workflow_dispatch:
    inputs:
      source:
        description: >-
          必填：.torrent 直链、magnet 磁力链，或单条 curl 命令。
        required: true
        type: string

      mode:
        description: 运行模式
        required: true
        default: parse
        type: choice
        options:
          - parse
          - download_all
          - download_selected

      file_ids:
        description: >-
          download_selected 模式使用，例如：1,3,5-8
        required: false
        default: ""
        type: string

      referer:
        description: >-
          直链模式使用的 Referer。默认 ;auto。
          如果站点要求来源页面，可填写真实页面，例如：
          https://dropmefiles.com/Z9E1c
        required: false
        default: ";auto"
        type: string

      user_agent:
        description: User-Agent
        required: false
        default: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36"
        type: string

      metadata_timeout:
        description: 磁力链接获取 metadata 的最长时间（秒）
        required: false
        default: "300"
        type: string

      seed_time:
        description: 下载完成后继续做种秒数，0 表示下载完成后退出
        required: false
        default: "0"
        type: string

permissions:
  contents: read

jobs:
  aria2:
    name: "${{ inputs.mode }} · Aria2"
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      INPUT_SOURCE: ${{ inputs.source }}
      INPUT_MODE: ${{ inputs.mode }}
      INPUT_FILE_IDS: ${{ inputs.file_ids }}
      INPUT_REFERER: ${{ inputs.referer }}
      INPUT_USER_AGENT: ${{ inputs.user_agent }}
      INPUT_METADATA_TIMEOUT: ${{ inputs.metadata_timeout }}
      INPUT_SEED_TIME: ${{ inputs.seed_time }}

      WORK_DIR: ${{ github.workspace }}/aria2-work
      TORRENT_DIR: ${{ github.workspace }}/aria2-work/torrents
      META_DIR: ${{ github.workspace }}/aria2-work/metadata
      OUTPUT_DIR: ${{ github.workspace }}/downloads

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 aria2、curl 和 file
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 curl file

          echo "==== aria2 ===="
          aria2c --version | head -n 3

          echo "==== curl ===="
          curl --version | head -n 1

      - name: 创建目录
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$WORK_DIR"
          mkdir -p "$TORRENT_DIR"
          mkdir -p "$META_DIR"
          mkdir -p "$OUTPUT_DIR"

      - name: 创建 torrent 解析工具
        shell: bash
        run: |
          set -Eeuo pipefail

          cat > "$WORK_DIR/torrent_tools.py" <<'PY'
          #!/usr/bin/env python3

          import json
          import sys
          from pathlib import Path


          class TorrentError(Exception):
              pass


          def bdecode(data):
              def parse(pos):
                  if pos >= len(data):
                      raise TorrentError("bencode 数据意外结束")

                  ch = data[pos:pos + 1]

                  if ch == b"i":
                      end = data.find(b"e", pos + 1)
                      if end < 0:
                          raise TorrentError("整数缺少结束符")
                      return int(data[pos + 1:end]), end + 1

                  if ch == b"l":
                      pos += 1
                      result = []

                      while True:
                          if pos >= len(data):
                              raise TorrentError("列表意外结束")
                          if data[pos:pos + 1] == b"e":
                              return result, pos + 1

                          value, pos = parse(pos)
                          result.append(value)

                  if ch == b"d":
                      pos += 1
                      result = {}

                      while True:
                          if pos >= len(data):
                              raise TorrentError("字典意外结束")
                          if data[pos:pos + 1] == b"e":
                              return result, pos + 1

                          key, pos = parse(pos)
                          value, pos = parse(pos)
                          result[key] = value

                  if b"0" <= ch <= b"9":
                      colon = data.find(b":", pos)

                      if colon < 0:
                          raise TorrentError("字符串长度格式错误")

                      length = int(data[pos:colon])
                      start = colon + 1
                      end = start + length

                      if end > len(data):
                          raise TorrentError("字符串超出范围")

                      return data[start:end], end

                  raise TorrentError(
                      f"无效 bencode 字节：{data[pos:pos + 1]!r}，位置：{pos}"
                  )

              value, end = parse(0)

              if data[end:].strip():
                  raise TorrentError("bencode 后存在额外数据")

              return value


          def text(value):
              if isinstance(value, bytes):
                  return value.decode("utf-8", "replace")
              return "" if value is None else str(value)


          def human_size(value):
              value = float(value)

              for unit in ("B", "KB", "MB", "GB", "TB"):
                  if value < 1024 or unit == "TB":
                      return (
                          f"{value:.0f} {unit}"
                          if unit == "B"
                          else f"{value:.2f} {unit}"
                      )
                  value /= 1024

              return f"{value:.2f} TB"


          def parse_torrent(path):
              raw = Path(path).read_bytes()
              meta = bdecode(raw)

              if not isinstance(meta, dict) or b"info" not in meta:
                  raise TorrentError("torrent 中缺少 info 字段")

              info = meta[b"info"]

              if not isinstance(info, dict):
                  raise TorrentError("info 字段不是字典")

              name = text(
                  info.get(
                      b"name.utf-8",
                      info.get(b"name", b"untitled")
                  )
              ) or "untitled"

              files = []

              if b"files" in info:
                  for file_id, item in enumerate(info[b"files"], start=1):
                      path_key = (
                          b"path.utf-8"
                          if b"path.utf-8" in item
                          else b"path"
                      )

                      parts = item.get(path_key, [])
                      relative = "/".join(text(x) for x in parts)

                      if not relative:
                          relative = f"file_{file_id}"

                      size = int(item.get(b"length", 0))

                      files.append({
                          "id": file_id,
                          "path": relative,
                          "size": size,
                          "size_text": human_size(size),
                      })
              else:
                  size = int(info.get(b"length", 0))

                  files.append({
                      "id": 1,
                      "path": name,
                      "size": size,
                      "size_text": human_size(size),
                  })

              total = sum(item["size"] for item in files)

              return {
                  "torrent_name": name,
                  "file_count": len(files),
                  "total_size": total,
                  "total_size_text": human_size(total),
                  "files": files,
              }


          if __name__ == "__main__":
              if len(sys.argv) < 2:
                  raise SystemExit("用法：torrent_tools.py FILE [--json]")

              result = parse_torrent(sys.argv[1])

              if "--json" in sys.argv:
                  print(json.dumps(result, ensure_ascii=False))
              else:
                  print("")
                  print("=" * 110)
                  print("种子名称：", result["torrent_name"])
                  print("文件数量：", result["file_count"])
                  print("总大小：", result["total_size_text"])
                  print("=" * 110)
                  print(f"{'ID':>6} | {'大小':>14} | 文件路径")
                  print("-" * 110)

                  for item in result["files"]:
                      print(
                          f"{item['id']:>6} | "
                          f"{item['size_text']:>14} | "
                          f"{item['path']}"
                      )

                  print("=" * 110)
          PY

          chmod +x "$WORK_DIR/torrent_tools.py"

      - name: 获取并验证种子
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - "$TORRENT_DIR" "$WORK_DIR/torrent_tools.py" <<'PY'
          import base64
          import os
          import shlex
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path


          source = os.environ.get("INPUT_SOURCE", "").strip()
          referer = os.environ.get("INPUT_REFERER", "").strip()
          user_agent = os.environ.get("INPUT_USER_AGENT", "").strip()

          torrent_dir = Path(sys.argv[1])
          parser = Path(sys.argv[2])

          torrent_dir.mkdir(parents=True, exist_ok=True)

          if not source:
              print("::error::source 不能为空")
              raise SystemExit(1)


          def write_output(name, value):
              output_file = os.environ["GITHUB_OUTPUT"]
              marker = "END_" + base64.b16encode(os.urandom(8)).decode()

              with open(output_file, "a", encoding="utf-8") as fp:
                  fp.write(f"{name}<<{marker}\n")
                  fp.write(str(value))
                  fp.write("\n")
                  fp.write(f"{marker}\n")


          def is_valid_torrent(path):
              try:
                  result = subprocess.run(
                      [
                          sys.executable,
                          str(parser),
                          str(path),
                          "--json",
                      ],
                      capture_output=True,
                      text=True,
                      timeout=60,
                  )

                  if result.returncode != 0:
                      return False, result.stderr.strip()

                  return True, result.stdout.strip()

              except Exception as exc:
                  return False, str(exc)


          def inspect(path):
              print(f"文件：{path}")
              print(f"大小：{path.stat().st_size} bytes")

              try:
                  result = subprocess.run(
                      ["file", "-b", str(path)],
                      capture_output=True,
                      text=True,
                      timeout=15,
                  )
                  print("类型：", result.stdout.strip())
              except Exception:
                  pass

              try:
                  print("前 256 字节：", repr(path.read_bytes()[:256]))
              except Exception:
                  pass


          # --------------------------------------------------------
          # magnet
          # --------------------------------------------------------
          if source.startswith("magnet:"):
              write_output("source_kind", "magnet")
              write_output("source_value", source)

              print("检测到 magnet 链接")
              raise SystemExit(0)


          temp_dir = Path(
              tempfile.mkdtemp(
                  prefix="source_",
                  dir=str(torrent_dir.parent),
              )
          )

          response_stderr = ""

          try:
              # ----------------------------------------------------
              # HTTP(S) 直链
              # ----------------------------------------------------
              if source.startswith(("http://", "https://")):
                  print("检测到 HTTP(S) 直链")

                  output_path = temp_dir / "downloaded_source.bin"

                  command = [
                      "curl",
                      "--location",
                      "--fail",
                      "--show-error",
                      "--silent",
                      "--retry",
                      "3",
                      "--retry-delay",
                      "2",
                      "--connect-timeout",
                      "30",
                      "--max-time",
                      "300",
                      "--user-agent",
                      user_agent or "Mozilla/5.0",
                      "--referer",
                      referer or ";auto",
                      "--output",
                      str(output_path),
                      source,
                  ]

                  print(
                      "直链请求参数：",
                      "follow_redirects=true",
                      f"referer={referer or ';auto'}",
                  )

                  result = subprocess.run(
                      command,
                      capture_output=True,
                      timeout=330,
                  )

                  response_stderr = (
                      result.stderr or b""
                  ).decode("utf-8", "replace")

                  if result.returncode != 0:
                      print(response_stderr[-3000:], file=sys.stderr)
                      raise SystemExit(
                          f"直链下载失败，curl 退出码：{result.returncode}"
                      )

              # ----------------------------------------------------
              # curl 命令
              # ----------------------------------------------------
              elif source.startswith("curl"):
                  print("检测到 curl 命令")

                  try:
                      args = shlex.split(source)
                  except ValueError as exc:
                      raise SystemExit(f"curl 命令解析失败：{exc}")

                  if not args or args[0] != "curl":
                      raise SystemExit("命令必须以 curl 开头")

                  forbidden = {
                      "&&",
                      "||",
                      ";",
                      "|",
                      "`",
                      "$(",
                      ")",
                  }

                  if any(token in forbidden for token in args):
                      raise SystemExit(
                          "curl 命令不能包含 shell 操作符"
                      )

                  print("实际执行参数：", args)

                  result = subprocess.run(
                      args,
                      cwd=str(temp_dir),
                      capture_output=True,
                      timeout=330,
                  )

                  response_stderr = (
                      result.stderr or b""
                  ).decode("utf-8", "replace")

                  if result.returncode != 0:
                      print(response_stderr[-3000:], file=sys.stderr)
                      raise SystemExit(
                          f"curl 执行失败，退出码：{result.returncode}"
                      )

                  # curl 没有写文件时，尝试从 stdout 检查 torrent
                  if result.stdout:
                      stdout_path = temp_dir / "stdout_response.bin"
                      stdout_path.write_bytes(result.stdout)

              else:
                  raise SystemExit(
                      "source 必须是 magnet、HTTP(S) 直链或 curl 命令"
                  )


              print("")
              print("开始完整验证下载结果……")

              valid = []

              for candidate in temp_dir.rglob("*"):
                  if not candidate.is_file():
                      continue

                  ok, detail = is_valid_torrent(candidate)

                  if ok:
                      valid.append(candidate)
                      print("发现有效 torrent：", candidate)
                  else:
                      print("跳过非 torrent 文件：", candidate)


              if not valid:
                  print("")
                  print("::error::未发现有效 torrent 文件")
                  print("")
                  print("服务器返回的内容不是合法 torrent。")
                  print("常见原因：")
                  print("1. 直链需要真实 Referer")
                  print("2. 服务器返回了 HTML 验证页")
                  print("3. 需要 Cookie 或登录状态")
                  print("4. 下载链接已经过期")
                  print("")
                  print("当前 INPUT_REFERER：", referer or ";auto")

                  for candidate in temp_dir.rglob("*"):
                      if candidate.is_file():
                          inspect(candidate)

                  raise SystemExit(1)


              valid.sort(
                  key=lambda x: x.stat().st_mtime,
                  reverse=True,
              )

              selected = valid[0]
              final_path = torrent_dir / "source.torrent"

              shutil.copy2(selected, final_path)

              ok, detail = is_valid_torrent(final_path)

              if not ok:
                  raise SystemExit("source.torrent 最终验证失败")

              write_output("source_kind", "torrent")
              write_output("source_value", str(final_path))

              print("")
              print("种子获取成功：")
              inspect(final_path)

          finally:
              shutil.rmtree(temp_dir, ignore_errors=True)
          PY

      - name: 磁力链接获取 metadata
        id: metadata
        if: ${{ steps.source.outputs.source_kind == 'magnet' && (inputs.mode == 'parse' || inputs.mode == 'download_selected') }}
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$META_DIR"

          echo "开始获取磁力 metadata"
          echo "超时时间：${INPUT_METADATA_TIMEOUT} 秒"

          aria2c \
            --bt-metadata-only=true \
            --bt-save-metadata=true \
            --seed-time=0 \
            --bt-stop-timeout="$INPUT_METADATA_TIMEOUT" \
            --timeout=60 \
            --connect-timeout=30 \
            --summary-interval=5 \
            --console-log-level=notice \
            --dir="$META_DIR" \
            "${{ steps.source.outputs.source_value }}"

          META_TORRENT="$(
            python3 - "$META_DIR" <<'PY'
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          candidates = []

          for item in root.rglob("*"):
              if not item.is_file():
                  continue

              try:
                  raw = item.read_bytes()
                  if raw.startswith(b"d"):
                      candidates.append(item)
              except OSError:
                  pass

          if not candidates:
              raise SystemExit(1)

          candidates.sort(
              key=lambda x: x.stat().st_mtime,
              reverse=True,
          )

          print(candidates[0])
          PY
          )"

          if [[ -z "$META_TORRENT" || ! -f "$META_TORRENT" ]]; then
            echo "::error::没有获取到磁力 metadata"
            exit 1
          fi

          cp "$META_TORRENT" "$TORRENT_DIR/metadata.torrent"
          echo "torrent_path=$TORRENT_DIR/metadata.torrent" >> "$GITHUB_OUTPUT"

      - name: 确定解析文件
        id: torrent
        if: ${{ inputs.mode == 'parse' || inputs.mode == 'download_selected' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "${{ steps.source.outputs.source_kind }}" == "torrent" ]]; then
            TORRENT_PATH="${{ steps.source.outputs.source_value }}"
          else
            TORRENT_PATH="${{ steps.metadata.outputs.torrent_path }}"
          fi

          if [[ -z "$TORRENT_PATH" || ! -f "$TORRENT_PATH" ]]; then
            echo "::error::解析文件不存在"
            exit 1
          fi

          echo "path=$TORRENT_PATH" >> "$GITHUB_OUTPUT"

      - name: 解析种子并打印文件 ID
        if: ${{ inputs.mode == 'parse' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 "$WORK_DIR/torrent_tools.py" \
            "${{ steps.torrent.outputs.path }}"

          echo ""
          echo "解析完成。"
          echo "请再次运行本工作流，并填写："
          echo "mode: download_selected"
          echo "file_ids: 例如 1,3,5-8"

      - name: 验证文件 ID
        id: selected
        if: ${{ inputs.mode == 'download_selected' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ -z "${INPUT_FILE_IDS//[[:space:]]/}" ]]; then
            echo "::error::download_selected 模式必须填写 file_ids"
            exit 1
          fi

          export TORRENT_PATH="${{ steps.torrent.outputs.path }}"
          export IDS_TEXT="$INPUT_FILE_IDS"

          SELECT_CSV="$(
            python3 - "$WORK_DIR/torrent_tools.py" <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          parser = sys.argv[1]
          torrent = os.environ["TORRENT_PATH"]
          raw = os.environ["IDS_TEXT"]

          result = subprocess.run(
              [
                  sys.executable,
                  parser,
                  torrent,
                  "--json",
              ],
              capture_output=True,
              text=True,
              check=True,
          )

          data = json.loads(result.stdout)
          valid_ids = {int(x["id"]) for x in data["files"]}
          selected = set()

          for token in re.split(r"[\s,]+", raw.strip()):
              if not token:
                  continue

              if re.fullmatch(r"\d+", token):
                  selected.add(int(token))
                  continue

              match = re.fullmatch(r"(\d+)\s*-\s*(\d+)", token)

              if not match:
                  raise SystemExit(f"无法识别的 ID：{token}")

              start = int(match.group(1))
              end = int(match.group(2))

              if end < start:
                  raise SystemExit(f"无效范围：{token}")

              selected.update(range(start, end + 1))

          invalid = sorted(selected - valid_ids)

          if invalid:
              raise SystemExit(
                  "不存在的文件 ID：" +
                  ",".join(map(str, invalid))
              )

          if not selected:
              raise SystemExit("没有选择任何文件")

          print(",".join(map(str, sorted(selected))))
          PY
          )"

          echo "select_csv=$SELECT_CSV" >> "$GITHUB_OUTPUT"
          echo "已验证文件 ID：$SELECT_CSV"

      - name: 下载全部文件
        if: ${{ inputs.mode == 'download_all' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "下载模式：全部文件"
          echo "来源类型：${{ steps.source.outputs.source_kind }}"

          aria2c \
            --dir="$OUTPUT_DIR" \
            --seed-time="$INPUT_SEED_TIME" \
            --max-connection-per-server=16 \
            --split=16 \
            --min-split-size=4M \
            --continue=true \
            --auto-file-renaming=true \
            --allow-overwrite=false \
            --file-allocation=none \
            --disk-cache=64M \
            --summary-interval=5 \
            --console-log-level=notice \
            --bt-max-peers=120 \
            --bt-stop-timeout=600 \
            "${{ steps.source.outputs.source_value }}"

      - name: 下载指定文件
        if: ${{ inputs.mode == 'download_selected' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          TORRENT_PATH="${{ steps.torrent.outputs.path }}"
          SELECT_CSV="${{ steps.selected.outputs.select_csv }}"

          echo "下载模式：指定文件"
          echo "文件 ID：$SELECT_CSV"

          aria2c \
            --dir="$OUTPUT_DIR" \
            --seed-time="$INPUT_SEED_TIME" \
            --max-connection-per-server=16 \
            --split=16 \
            --min-split-size=4M \
            --continue=true \
            --auto-file-renaming=true \
            --allow-overwrite=false \
            --file-allocation=none \
            --disk-cache=64M \
            --summary-interval=5 \
            --console-log-level=notice \
            --bt-max-peers=120 \
            --bt-stop-timeout=600 \
            --select-file="$SELECT_CSV" \
            --bt-remove-unselected-file=true \
            "$TORRENT_PATH"

      - name: 输出下载结果
        if: ${{ success() && (inputs.mode == 'download_all' || inputs.mode == 'download_selected') }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "==== 下载结果 ===="

          if [[ -z "$(find "$OUTPUT_DIR" -mindepth 1 -print -quit)" ]]; then
            echo "::warning::下载目录为空"
          else
            find "$OUTPUT_DIR" \
              -maxdepth 8 \
              -type f \
              -printf '%s bytes\t%p\n' \
              | sort -n
          fi

          echo ""
          du -sh "$OUTPUT_DIR" || true

      - name: 上传下载工件
        if: ${{ success() && (inputs.mode == 'download_all' || inputs.mode == 'download_selected') }}
        uses: actions/upload-artifact@v4
        with:
          name: aria2-download-${{ github.run_number }}
          path: downloads/
          if-no-files-found: warn
          compression-level: 0
