name: 🧲 Aria2 Torrent Downloader

on:
  workflow_dispatch:
    inputs:
      source:
        description: >-
          必填：.torrent 直链、magnet 磁力链，或单条 curl 命令。
          例如：curl -L -OJ -e "https://example.com/page" "https://example.com/file"
        required: true
        type: string

      mode:
        description: 运行模式
        required: true
        default: parse
        type: choice
        options:
          - parse
          - download_all
          - download_selected

      file_ids:
        description: >-
          download_selected 模式使用。
          填写 parse 日志中的文件 ID，例如：1,3,5-8
        required: false
        default: ""
        type: string

      metadata_timeout:
        description: 磁力链接获取 metadata 的最长时间（秒）
        required: false
        default: "300"
        type: string

      seed_time:
        description: 下载完成后继续做种秒数，0 表示下载完成后退出
        required: false
        default: "0"
        type: string

permissions:
  contents: read

jobs:
  aria2:
    name: "${{ inputs.mode }} · Aria2"
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      INPUT_SOURCE: ${{ inputs.source }}
      INPUT_MODE: ${{ inputs.mode }}
      INPUT_FILE_IDS: ${{ inputs.file_ids }}
      INPUT_METADATA_TIMEOUT: ${{ inputs.metadata_timeout }}
      INPUT_SEED_TIME: ${{ inputs.seed_time }}

      WORK_DIR: ${{ github.workspace }}/aria2-work
      TORRENT_DIR: ${{ github.workspace }}/aria2-work/torrents
      META_DIR: ${{ github.workspace }}/aria2-work/metadata
      OUTPUT_DIR: ${{ github.workspace }}/downloads

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 aria2 和 curl
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2 curl file

          echo "==== aria2 版本 ===="
          aria2c --version | head -n 3

          echo "==== curl 版本 ===="
          curl --version | head -n 1

      - name: 创建工作目录
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$WORK_DIR"
          mkdir -p "$TORRENT_DIR"
          mkdir -p "$META_DIR"
          mkdir -p "$OUTPUT_DIR"

          echo "WORK_DIR=$WORK_DIR"
          echo "TORRENT_DIR=$TORRENT_DIR"
          echo "OUTPUT_DIR=$OUTPUT_DIR"

      - name: 创建种子解析和验证工具
        shell: bash
        run: |
          set -Eeuo pipefail

          cat > "$WORK_DIR/torrent_tools.py" <<'PY'
          #!/usr/bin/env python3

          import json
          import os
          import sys
          from pathlib import Path


          class TorrentError(Exception):
              pass


          def bdecode(data: bytes):
              """
              严格解析 bencode。
              返回 Python 对象。
              """

              def parse(pos):
                  if pos >= len(data):
                      raise TorrentError(f"bencode 数据意外结束，位置 {pos}")

                  ch = data[pos:pos + 1]

                  if ch == b"i":
                      end = data.find(b"e", pos + 1)

                      if end < 0:
                          raise TorrentError("整数缺少结束符")

                      raw = data[pos + 1:end]

                      if not raw:
                          raise TorrentError("整数为空")

                      return int(raw), end + 1

                  if ch == b"l":
                      pos += 1
                      result = []

                      while True:
                          if pos >= len(data):
                              raise TorrentError("列表意外结束")

                          if data[pos:pos + 1] == b"e":
                              return result, pos + 1

                          value, pos = parse(pos)
                          result.append(value)

                  if ch == b"d":
                      pos += 1
                      result = {}

                      while True:
                          if pos >= len(data):
                              raise TorrentError("字典意外结束")

                          if data[pos:pos + 1] == b"e":
                              return result, pos + 1

                          key, pos = parse(pos)

                          if not isinstance(key, bytes):
                              raise TorrentError("字典键不是 bytes")

                          value, pos = parse(pos)
                          result[key] = value

                  if b"0" <= ch <= b"9":
                      colon = data.find(b":", pos)

                      if colon < 0:
                          raise TorrentError("字符串长度缺少冒号")

                      try:
                          length = int(data[pos:colon])
                      except Exception:
                          raise TorrentError("字符串长度无效")

                      if length < 0:
                          raise TorrentError("字符串长度不能为负数")

                      start = colon + 1
                      end = start + length

                      if end > len(data):
                          raise TorrentError("字符串超出数据范围")

                      return data[start:end], end

                  raise TorrentError(
                      f"无效 bencode 字节 {data[pos:pos + 1]!r}，位置 {pos}"
                  )

              value, end_pos = parse(0)

              # 允许末尾空白，但不允许存在其他垃圾内容
              trailing = data[end_pos:].strip()

              if trailing:
                  raise TorrentError("bencode 数据后存在无法解析的额外内容")

              return value


          def text(value):
              if isinstance(value, bytes):
                  return value.decode("utf-8", "replace")

              if value is None:
                  return ""

              return str(value)


          def human_size(size):
              value = float(size)

              for unit in ("B", "KB", "MB", "GB", "TB"):
                  if value < 1024 or unit == "TB":
                      if unit == "B":
                          return f"{value:.0f} {unit}"
                      return f"{value:.2f} {unit}"

                  value /= 1024

              return f"{value:.2f} TB"


          def parse_torrent(path):
              path = Path(path)

              if not path.is_file():
                  raise TorrentError(f"文件不存在：{path}")

              raw = path.read_bytes()
              meta = bdecode(raw)

              if not isinstance(meta, dict):
                  raise TorrentError("torrent 顶层不是字典")

              if b"info" not in meta:
                  raise TorrentError("torrent 中缺少 info 字段")

              info = meta[b"info"]

              if not isinstance(info, dict):
                  raise TorrentError("torrent 的 info 字段不是字典")

              name_raw = info.get(
                  b"name.utf-8",
                  info.get(b"name", b"untitled")
              )

              torrent_name = text(name_raw) or "untitled"
              files = []

              if b"files" in info:
                  torrent_files = info[b"files"]

                  if not isinstance(torrent_files, list):
                      raise TorrentError("torrent 的 files 字段无效")

                  for file_id, item in enumerate(torrent_files, start=1):
                      if not isinstance(item, dict):
                          continue

                      path_key = (
                          b"path.utf-8"
                          if b"path.utf-8" in item
                          else b"path"
                      )

                      parts = item.get(path_key, [])

                      if not isinstance(parts, list):
                          parts = []

                      relative_path = "/".join(text(x) for x in parts)

                      if not relative_path:
                          relative_path = f"file_{file_id}"

                      size = int(item.get(b"length", 0))

                      files.append({
                          "id": file_id,
                          "path": relative_path,
                          "size": size,
                          "size_text": human_size(size),
                      })

              else:
                  size = int(info.get(b"length", 0))

                  files.append({
                      "id": 1,
                      "path": torrent_name,
                      "size": size,
                      "size_text": human_size(size),
                  })

              total_size = sum(item["size"] for item in files)

              return {
                  "torrent_name": torrent_name,
                  "file_count": len(files),
                  "total_size": total_size,
                  "total_size_text": human_size(total_size),
                  "files": files,
              }


          def print_human(result):
              print("")
              print("=" * 110)
              print(f"种子名称：{result['torrent_name']}")
              print(f"文件数量：{result['file_count']}")
              print(f"总大小：  {result['total_size_text']}")
              print("=" * 110)
              print(f"{'ID':>6} | {'大小':>14} | 文件路径")
              print("-" * 110)

              for item in result["files"]:
                  print(
                      f"{item['id']:>6} | "
                      f"{item['size_text']:>14} | "
                      f"{item['path']}"
                  )

              print("=" * 110)


          if __name__ == "__main__":
              if len(sys.argv) < 2:
                  raise SystemExit(
                      "用法：torrent_tools.py <torrent文件> [--json]"
                  )

              result = parse_torrent(sys.argv[1])

              if "--json" in sys.argv:
                  print(json.dumps(result, ensure_ascii=False))
              else:
                  print_human(result)
          PY

          chmod +x "$WORK_DIR/torrent_tools.py"

      - name: 获取并验证种子
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - "$TORRENT_DIR" "$WORK_DIR/torrent_tools.py" <<'PY'
          import base64
          import os
          import shlex
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path


          source = os.environ.get("INPUT_SOURCE", "").strip()
          torrent_dir = Path(sys.argv[1])
          parser_path = Path(sys.argv[2])

          torrent_dir.mkdir(parents=True, exist_ok=True)

          if not source:
              print("::error::source 不能为空")
              raise SystemExit(1)


          def write_output(name, value):
              """
              安全写入 GITHUB_OUTPUT，支持特殊字符和多行文本。
              """
              output_file = os.environ["GITHUB_OUTPUT"]
              marker = "EOF_" + base64.b16encode(os.urandom(8)).decode()

              with open(output_file, "a", encoding="utf-8") as fp:
                  fp.write(f"{name}<<{marker}\n")
                  fp.write(str(value))
                  fp.write("\n")
                  fp.write(f"{marker}\n")


          def is_valid_torrent(path):
              """
              使用完整解析脚本验证，不使用简单的首字节判断。
              """
              try:
                  result = subprocess.run(
                      [
                          sys.executable,
                          str(parser_path),
                          str(path),
                          "--json",
                      ],
                      capture_output=True,
                      text=True,
                      timeout=60,
                  )

                  if result.returncode != 0:
                      return False, result.stderr.strip()

                  return True, result.stdout.strip()

              except Exception as exc:
                  return False, str(exc)


          def candidate_files(root):
              """
              递归查找所有可能的下载结果。
              """
              result = []

              for item in root.rglob("*"):
                  if item.is_file():
                      result.append(item)

              return sorted(
                  result,
                  key=lambda x: x.stat().st_mtime,
                  reverse=True,
              )


          def inspect_response(path):
              """
              输出响应类型，帮助判断是否下载到了 HTML 验证页。
              """
              print(f"文件路径：{path}")
              print(f"文件大小：{path.stat().st_size} bytes")

              try:
                  file_result = subprocess.run(
                      ["file", "-b", str(path)],
                      capture_output=True,
                      text=True,
                      timeout=15,
                  )

                  print("file 类型：", file_result.stdout.strip())
              except Exception:
                  pass

              try:
                  head = path.read_bytes()[:256]
                  print("前 256 字节：", repr(head))
              except Exception:
                  pass


          # ========================================================
          # 处理 magnet
          # ========================================================
          if source.startswith("magnet:"):
              write_output("source_kind", "magnet")
              write_output("source_value", source)

              print("检测到 magnet 磁力链接")
              print("source_kind=magnet")
              print("后续步骤将使用 aria2 处理磁力链接")

              raise SystemExit(0)


          # ========================================================
          # 创建临时下载目录
          # ========================================================
          temp_dir = Path(
              tempfile.mkdtemp(
                  prefix="source_",
                  dir=str(torrent_dir.parent),
              )
          )

          response_stdout = b""
          response_stderr = ""
          return_code = 0

          try:
              # ----------------------------------------------------
              # 直接 HTTP(S) URL
              # ----------------------------------------------------
              if source.startswith("http://") or source.startswith("https://"):
                  print("检测到 HTTP(S) 种子直链")

                  output_path = temp_dir / "downloaded_source.bin"

                  command = [
                      "curl",
                      "--location",
                      "--fail",
                      "--show-error",
                      "--silent",
                      "--retry",
                      "3",
                      "--retry-delay",
                      "2",
                      "--connect-timeout",
                      "30",
                      "--max-time",
                      "300",
                      "--user-agent",
                      "Mozilla/5.0",
                      "--output",
                      str(output_path),
                      source,
                  ]

                  print("执行：curl HTTP(S) 直链下载")
                  result = subprocess.run(
                      command,
                      capture_output=True,
                      timeout=330,
                  )

                  return_code = result.returncode
                  response_stdout = result.stdout or b""
                  response_stderr = (
                      result.stderr or b""
                  ).decode("utf-8", "replace")

                  if return_code != 0:
                      print(response_stderr[-2000:], file=sys.stderr)
                      raise SystemExit(
                          f"curl 下载失败，退出码：{return_code}"
                      )

              # ----------------------------------------------------
              # 单条 curl 命令
              # ----------------------------------------------------
              elif source.startswith("curl"):
                  print("检测到 curl 命令")

                  try:
                      args = shlex.split(source)
                  except ValueError as exc:
                      raise SystemExit(f"curl 命令解析失败：{exc}")

                  if not args or args[0] != "curl":
                      raise SystemExit("命令必须以 curl 开头")

                  # 禁止 shell 链接符，避免执行多条命令
                  forbidden_tokens = {
                      "&&",
                      "||",
                      ";",
                      "|",
                      "`",
                      "$(",
                      ")",
                  }

                  if any(token in forbidden_tokens for token in args):
                      raise SystemExit(
                          "curl 命令不能包含 &&、||、;、|、`、$( 等 shell 操作符"
                      )

                  print("实际执行参数：", args)

                  result = subprocess.run(
                      args,
                      cwd=str(temp_dir),
                      capture_output=True,
                      timeout=330,
                  )

                  return_code = result.returncode
                  response_stdout = result.stdout or b""
                  response_stderr = (
                      result.stderr or b""
                  ).decode("utf-8", "replace")

                  if response_stderr:
                      print("curl stderr：")
                      print(response_stderr[-2000:])

                  if return_code != 0:
                      raise SystemExit(
                          f"curl 执行失败，退出码：{return_code}"
                      )

                  # 如果用户的 curl 没有 -o/-O/-OJ，
                  # 但 stdout 本身就是 torrent，则写入文件。
                  if response_stdout:
                      stdout_path = temp_dir / "stdout_response.bin"

                      try:
                          stdout_path.write_bytes(response_stdout)

                          valid, detail = is_valid_torrent(stdout_path)

                          if valid:
                              print("检测到 stdout 中包含有效 torrent")
                          else:
                              stdout_path.unlink(missing_ok=True)

                      except Exception:
                          pass

              else:
                  raise SystemExit(
                      "source 必须是 magnet 链接、HTTP(S) URL，或 curl 命令"
                  )

              # ====================================================
              # 查找并完整验证下载结果
              # ====================================================
              print("")
              print("开始查找并验证下载结果……")

              valid_candidates = []

              for candidate in candidate_files(temp_dir):
                  valid, detail = is_valid_torrent(candidate)

                  if valid:
                      valid_candidates.append(candidate)
                      print(f"发现有效 torrent：{candidate}")
                  else:
                      print(f"跳过非 torrent 文件：{candidate}")

              if not valid_candidates:
                  print("")
                  print("::error::未找到有效的 torrent 文件")
                  print("")
                  print("这通常表示服务器返回的是网页、验证页或错误 JSON，而不是种子。")
                  print("当前临时目录：")
                  print(temp_dir)

                  for candidate in candidate_files(temp_dir):
                      inspect_response(candidate)

                  if response_stderr:
                      print("")
                      print("curl stderr：")
                      print(response_stderr[-3000:])

                  raise SystemExit(1)

              valid_candidates.sort(
                  key=lambda x: x.stat().st_mtime,
                  reverse=True,
              )

              selected = valid_candidates[0]
              final_path = torrent_dir / "source.torrent"

              shutil.copy2(selected, final_path)

              # 再次验证统一后的 source.torrent
              valid, detail = is_valid_torrent(final_path)

              if not valid:
                  raise SystemExit("统一复制后的 source.torrent 验证失败")

              write_output("source_kind", "torrent")
              write_output("source_value", str(final_path))

              print("")
              print("种子获取并验证成功：")
              inspect_response(final_path)

          finally:
              shutil.rmtree(temp_dir, ignore_errors=True)
          PY

      - name: 磁力链接获取 metadata
        id: metadata
        if: ${{ steps.source.outputs.source_kind == 'magnet' && (inputs.mode == 'parse' || inputs.mode == 'download_selected') }}
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$META_DIR"

          echo "开始获取磁力 metadata"
          echo "最长等待：${INPUT_METADATA_TIMEOUT} 秒"

          aria2c \
            --bt-metadata-only=true \
            --bt-save-metadata=true \
            --seed-time=0 \
            --bt-stop-timeout="$INPUT_METADATA_TIMEOUT" \
            --timeout=60 \
            --connect-timeout=30 \
            --summary-interval=5 \
            --console-log-level=notice \
            --dir="$META_DIR" \
            "${{ steps.source.outputs.source_value }}"

          META_TORRENT="$(
            python3 - "$META_DIR" <<'PY'
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          candidates = []

          for item in root.rglob("*"):
              if not item.is_file():
                  continue

              try:
                  raw = item.read_bytes()
                  if raw.startswith(b"d") and b"info" in raw:
                      candidates.append(item)
              except OSError:
                  pass

          if not candidates:
              raise SystemExit(1)

          candidates.sort(
              key=lambda x: x.stat().st_mtime,
              reverse=True,
          )

          print(candidates[0])
          PY
          )"

          if [[ -z "$META_TORRENT" || ! -f "$META_TORRENT" ]]; then
            echo "::error::未获取到磁力 metadata。"
            echo "可能原因：没有可用做种者、metadata 超时、磁力链接无效。"
            exit 1
          fi

          cp "$META_TORRENT" "$TORRENT_DIR/metadata.torrent"

          echo "torrent_path=$TORRENT_DIR/metadata.torrent" >> "$GITHUB_OUTPUT"

          echo "metadata 获取成功："
          ls -lh "$TORRENT_DIR/metadata.torrent"

      - name: 确定解析用 torrent 文件
        id: torrent
        if: ${{ inputs.mode == 'parse' || inputs.mode == 'download_selected' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "${{ steps.source.outputs.source_kind }}" == "torrent" ]]; then
            TORRENT_PATH="${{ steps.source.outputs.source_value }}"
          else
            TORRENT_PATH="${{ steps.metadata.outputs.torrent_path }}"
          fi

          if [[ -z "$TORRENT_PATH" || ! -f "$TORRENT_PATH" ]]; then
            echo "::error::解析用 torrent 文件不存在"
            exit 1
          fi

          echo "path=$TORRENT_PATH" >> "$GITHUB_OUTPUT"
          echo "解析文件：$TORRENT_PATH"

      - name: 解析种子并打印文件 ID
        if: ${{ inputs.mode == 'parse' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "::group::种子文件列表"
          python3 "$WORK_DIR/torrent_tools.py" \
            "${{ steps.torrent.outputs.path }}"
          echo "::endgroup::"

          echo ""
          echo "解析完成。"
          echo "请记下文件 ID，然后再次运行工作流："
          echo "mode: download_selected"
          echo "file_ids: 例如 1,3,5-8"

      - name: 验证指定文件 ID
        id: selected
        if: ${{ inputs.mode == 'download_selected' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          IDS="$INPUT_FILE_IDS"

          if [[ -z "${IDS//[[:space:]]/}" ]]; then
            echo "::error::download_selected 模式必须填写 file_ids，例如 1,3,5-8"
            exit 1
          fi

          export TORRENT_PATH="${{ steps.torrent.outputs.path }}"
          export IDS_TEXT="$IDS"

          SELECT_CSV="$(
            python3 - "$WORK_DIR/torrent_tools.py" <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys


          parser = sys.argv[1]
          torrent_path = os.environ["TORRENT_PATH"]
          ids_text = os.environ["IDS_TEXT"].strip()

          result = subprocess.run(
              [
                  sys.executable,
                  parser,
                  torrent_path,
                  "--json",
              ],
              capture_output=True,
              text=True,
              check=True,
          )

          data = json.loads(result.stdout)

          valid_ids = {
              int(item["id"])
              for item in data["files"]
          }

          selected = set()

          for token in re.split(r"[\s,]+", ids_text):
              token = token.strip()

              if not token:
                  continue

              if re.fullmatch(r"\d+", token):
                  selected.add(int(token))
                  continue

              match = re.fullmatch(r"(\d+)\s*-\s*(\d+)", token)

              if match:
                  start = int(match.group(1))
                  end = int(match.group(2))

                  if end < start:
                      raise SystemExit(f"无效范围：{token}")

                  selected.update(range(start, end + 1))
                  continue

              raise SystemExit(
                  f"无法识别的文件 ID 格式：{token}"
              )

          invalid = sorted(selected - valid_ids)

          if invalid:
              raise SystemExit(
                  "以下文件 ID 不存在："
                  + ",".join(str(x) for x in invalid)
              )

          if not selected:
              raise SystemExit("没有选中任何文件")

          ordered = sorted(selected)

          print(",".join(str(x) for x in ordered))
          PY
          )"

          echo "select_csv=$SELECT_CSV" >> "$GITHUB_OUTPUT"

          echo "已验证文件 ID：$SELECT_CSV"

          echo "::group::已选文件详情"

          python3 - "$WORK_DIR/torrent_tools.py" "$SELECT_CSV" <<'PY'
          import json
          import subprocess
          import sys


          parser = sys.argv[1]
          selected = {
              int(x)
              for x in sys.argv[2].split(",")
          }

          torrent_path = "${{ steps.torrent.outputs.path }}"

          result = subprocess.run(
              [
                  sys.executable,
                  parser,
                  torrent_path,
                  "--json",
              ],
              capture_output=True,
              text=True,
              check=True,
          )

          data = json.loads(result.stdout)
          total = 0
          count = 0

          for item in data["files"]:
              if int(item["id"]) in selected:
                  count += 1
                  total += int(item["size"])
                  print(
                      f"[{item['id']}] "
                      f"{item['size_text']:>14}  "
                      f"{item['path']}"
                  )

          print("-" * 100)
          print(f"选中文件数：{count}")
          print(f"总大小：{total / 1024 / 1024 / 1024:.2f} GB")
          PY

          echo "::endgroup::"

      - name: 下载全部文件
        if: ${{ inputs.mode == 'download_all' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          SOURCE_KIND="${{ steps.source.outputs.source_kind }}"
          SOURCE_VALUE="${{ steps.source.outputs.source_value }}"

          echo "下载模式：全部文件"
          echo "输出目录：$OUTPUT_DIR"

          aria2c \
            --dir="$OUTPUT_DIR" \
            --seed-time="$INPUT_SEED_TIME" \
            --max-connection-per-server=16 \
            --split=16 \
            --min-split-size=4M \
            --max-concurrent-downloads=5 \
            --continue=true \
            --auto-file-renaming=true \
            --allow-overwrite=false \
            --file-allocation=none \
            --disk-cache=64M \
            --summary-interval=5 \
            --console-log-level=notice \
            --bt-max-peers=120 \
            --bt-request-peer-speed-limit=20M \
            --bt-stop-timeout=600 \
            "$SOURCE_VALUE"

      - name: 下载指定文件
        if: ${{ inputs.mode == 'download_selected' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          TORRENT_PATH="${{ steps.torrent.outputs.path }}"
          SELECT_CSV="${{ steps.selected.outputs.select_csv }}"

          echo "下载模式：指定文件"
          echo "指定文件 ID：$SELECT_CSV"
          echo "输出目录：$OUTPUT_DIR"

          aria2c \
            --dir="$OUTPUT_DIR" \
            --seed-time="$INPUT_SEED_TIME" \
            --max-connection-per-server=16 \
            --split=16 \
            --min-split-size=4M \
            --max-concurrent-downloads=5 \
            --continue=true \
            --auto-file-renaming=true \
            --allow-overwrite=false \
            --file-allocation=none \
            --disk-cache=64M \
            --summary-interval=5 \
            --console-log-level=notice \
            --bt-max-peers=120 \
            --bt-request-peer-speed-limit=20M \
            --bt-stop-timeout=600 \
            --select-file="$SELECT_CSV" \
            --bt-remove-unselected-file=true \
            "$TORRENT_PATH"

      - name: 输出下载结果
        if: ${{ success() && (inputs.mode == 'download_all' || inputs.mode == 'download_selected') }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "==== 下载结果 ===="

          if [[ -z "$(find "$OUTPUT_DIR" -mindepth 1 -print -quit)" ]]; then
            echo "::warning::下载目录为空"
          else
            find "$OUTPUT_DIR" \
              -maxdepth 6 \
              -type f \
              -printf '%s bytes\t%p\n' \
              | sort -n
          fi

          echo ""
          echo "==== 磁盘占用 ===="
          du -sh "$OUTPUT_DIR" || true

      - name: 上传下载工件
        if: ${{ success() && (inputs.mode == 'download_all' || inputs.mode == 'download_selected') }}
        uses: actions/upload-artifact@v4
        with:
          name: aria2-download-${{ github.run_number }}
          path: downloads/
          if-no-files-found: warn
          compression-level: 0
