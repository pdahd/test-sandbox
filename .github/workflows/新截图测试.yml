name: 新截图Scenarist BD Portable - Run with Dependencies

on:
  workflow_dispatch:

env:
  # 替换规则：测试 v1 时填 v1 直链；测试 v3 时填 v3 直链（目前已预填 v1 直链）
  PKG_URL: "https://1008.filemail.com/api/file/get?filekey=QCpLNSD8xs4eor6BkBbhKfFiUvlN3_BJXXoPOp1cCx3WwFEgkVeoc67e5ik04b01EvdoFaWl_IZCTsqptQ&skipcheck=true&skipreg=true"
  OUT: ${{ github.workspace }}\out

jobs:
  run-portable:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell

    steps:
      # ------------------------------------------------------------------
      - name: 1. Initialize directories
        run: |
          New-Item -ItemType Directory -Force "$env:OUT\shots","$env:OUT\logs" | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $scr = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Write-Host "Screen Resolution: $($scr.Width)x$($scr.Height)"

      # ------------------------------------------------------------------
      - name: 2. Download and Extract Portable Package
        run: |
          $f = "$env:RUNNER_TEMP\pkg.bin"
          curl.exe -L --fail --retry 3 -A "Mozilla/5.0" -o $f "$env:PKG_URL"
          if ($LASTEXITCODE -ne 0) { throw "Download failed (exit $LASTEXITCODE)" }

          & "C:\Program Files\7-Zip\7z.exe" x $f "-o$env:RUNNER_TEMP\pkg" -y
          
          $exe = Get-ChildItem "$env:RUNNER_TEMP\pkg" -Recurse -Filter "ScenaristBD.exe" | Select-Object -First 1
          if (-not $exe) { throw "ScenaristBD.exe not found in portable package" }
          
          $prereq = Get-ChildItem "$env:RUNNER_TEMP\pkg" -Recurse -Filter "ISSetupPrerequisites" | Select-Object -First 1
          
          Write-Host "Main Executable Found: $($exe.FullName)"
          "APP_EXE=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "APP_DIR=$($exe.DirectoryName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          if ($prereq) {
            "PREREQ_DIR=$($prereq.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "Prerequisites Directory Found: $($prereq.FullName)"
          }

      # ------------------------------------------------------------------
      - name: 3. Query system dependencies and install missing components
        if: false
        timeout-minutes: 30
        run: |
          $log = "$env:OUT\logs\dependencies.txt"
          function L($m){ $s = "[$(Get-Date -f HH:mm:ss)] $m"; Write-Host $s; Add-Content $log $s }
          function Installed($rx){ Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -EA SilentlyContinue | ? { $_.DisplayName -match $rx } | % DisplayName }
          function Run($exe,$a,$label){
            if (-not $exe -or -not (Test-Path $exe)) { L "$label : installer does not exist, skip"; return }
            try { $p = Start-Process -FilePath $exe -ArgumentList $a -Wait -PassThru; L "$label : exit $($p.ExitCode)  (0=success 3010=reboot required 1638/5100=already installed or unsupported)" }
            catch { L "$label : exception $($_.Exception.Message)" } }

          L "=== Windows Installer service ==="
          Start-Service msiserver -EA SilentlyContinue; L "msiserver: $((Get-Service msiserver).Status)"

          L "=== .NET Framework 2.0 / 3.5 (NetFx3) ==="
          $fx = Get-WindowsOptionalFeature -Online -FeatureName NetFx3
          L "NetFx3 current: $($fx.State)"
          if ($fx.State -ne 'Enabled') {
            try { $r = Enable-WindowsOptionalFeature -Online -FeatureName NetFx3 -All -NoRestart -EA Stop; L "Enable-WindowsOptionalFeature completed" }
            catch { L "Enable failed, using DISM: $($_.Exception.Message)"; dism.exe /Online /Enable-Feature /FeatureName:NetFx3 /All /NoRestart | Out-Null; L "dism exit $LASTEXITCODE" }
            L "NetFx3 now: $((Get-WindowsOptionalFeature -Online -FeatureName NetFx3).State)" }

          L "=== Visual J# 2.0 Redistributable ==="
          $vjHas = (Installed 'Visual J#') -or (Get-ChildItem "$env:windir\assembly" -Recurse -Filter vjslib.dll -EA SilentlyContinue)
          if ($vjHas) { L "J# already exists: $(Installed 'Visual J#')" }
          else { $vj = Get-ChildItem "$env:PREREQ_DIR" -Recurse -Filter vjredist.exe -EA SilentlyContinue | Select -First 1
                 Run $vj.FullName '/q:a /c:"install.exe /q"' 'J# 2.0'
                 L "J# after installation: $(Installed 'Visual J#')" }

          L "=== Java Runtime 1.5 (32-bit) ==="
          $jreHas = (Test-Path 'HKLM:\SOFTWARE\WOW6432Node\JavaSoft\Java Runtime Environment\1.5') -or (Installed 'J2SE Runtime Environment 5|Java\(TM\) 2 Runtime|Java 5')
          if ($jreHas) { L "JRE 1.5 already exists" }
          else { $jre = Get-ChildItem "$env:PREREQ_DIR" -Recurse -Filter "jre-*.exe" -EA SilentlyContinue | Select -First 1
                 Run $jre.FullName '/s /v"/qn REBOOT=Suppress"' 'JRE 1.5.0_07'
                 L "JRE registry: $(Test-Path 'HKLM:\SOFTWARE\WOW6432Node\JavaSoft\Java Runtime Environment\1.5')" }

          L "=== Visual C++ runtimes ==="
          Installed 'Visual C\+\+' | sort -Unique | % { L "  already exists: $_" }
          foreach ($a in 'x86','x64') {
            if (-not (Installed "Visual C\+\+ 2015-20\d\d.*$a")) {
              $e = "$env:RUNNER_TEMP\vc_$a.exe"; curl.exe -sL -o $e "https://aka.ms/vs/17/release/vc_redist.$a.exe"
              Run $e '/install /quiet /norestart' "VC++ 2015-2022 $a" } }

          L "=== Legacy DirectX 9 runtime (d3dx9) ==="
          if (Test-Path "$env:windir\SysWOW64\d3dx9_43.dll") { L "d3dx9_43.dll already exists" }
          else { $dx = "$env:RUNNER_TEMP\dxwebsetup.exe"
                 curl.exe -sL --fail -o $dx "https://download.microsoft.com/download/1/7/1/1718CCC4-6315-4D8E-9543-8E28A4E18C4C/dxwebsetup.exe"
                 if ($LASTEXITCODE -eq 0) { Run $dx '/Q' 'DirectX End-User Runtime' } else { L "dxwebsetup download failed, skip" } }

          L "=== Media Foundation ==="
          try { $mf = Get-WindowsFeature Server-Media-Foundation -EA Stop; L "Server-Media-Foundation: $($mf.InstallState)"
                if ($mf.InstallState -ne 'Installed') { $r = Install-WindowsFeature Server-Media-Foundation -EA Stop; L "Installation result: Success=$($r.Success)" } }
          catch { L "Media Foundation check failed: $($_.Exception.Message)" }
          L "=== Dependency processing completed ==="

      # ------------------------------------------------------------------
      - name: 4. Launch Portable Scenarist BD, capture diagnostics & screenshot
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          
          Write-Host "Launching Portable Scenarist BD..."
          $p = Start-Process -FilePath $env:APP_EXE -WorkingDirectory $env:APP_DIR -PassThru
          
          Start-Sleep -Seconds 12
          
          # --- Diagnostics & Process / Window Title Tracking ---
          $diagLog = "$env:OUT\logs\process_diagnostics.txt"
          "==========================================" | Out-File $diagLog -Encoding utf8
          "PROCESS RUNTIME DIAGNOSTICS & SYSTEM LOGS" | Out-File $diagLog -Append -Encoding utf8
          "==========================================" | Out-File $diagLog -Append -Encoding utf8
          
          $p.Refresh()
          $isAlive = -not $p.HasExited
          "Process ID: $($p.Id)" | Out-File $diagLog -Append -Encoding utf8
          "Process IsAlive: $isAlive" | Out-File $diagLog -Append -Encoding utf8
          if ($isAlive) {
            "MainWindowHandle: $($p.MainWindowHandle)" | Out-File $diagLog -Append -Encoding utf8
            "MainWindowTitle: '$($p.MainWindowTitle)'" | Out-File $diagLog -Append -Encoding utf8
          } else {
            "Process ExitCode: $($p.ExitCode)" | Out-File $diagLog -Append -Encoding utf8
          }

          "------------------------------------------" | Out-File $diagLog -Append -Encoding utf8
          "WINDOWS EVENT LOGS (Application / System Errors)" | Out-File $diagLog -Append -Encoding utf8
          "------------------------------------------" | Out-File $diagLog -Append -Encoding utf8
          Get-EventLog -LogName Application -Newest 30 -EntryType Error,Warning -EA SilentlyContinue |
            Format-List TimeGenerated, Source, EventID, Message | Out-String | Out-File $diagLog -Append -Encoding utf8

          $minCode = '
          using System;
          using System.Text;
          using System.Runtime.InteropServices;

          public static class WinConsoleMin {
            public delegate bool EnumProc(IntPtr hWnd, IntPtr lParam);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc cb, IntPtr l);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int c);

            public static void HideConsoles() {
              EnumWindows(delegate(IntPtr hWnd, IntPtr lParam) {
                if (IsWindowVisible(hWnd)) {
                  StringBuilder sb = new StringBuilder(1024);
                  GetWindowText(hWnd, sb, 1024);
                  string t = sb.ToString();
                  if (!string.IsNullOrEmpty(t) && (t.Contains("ProgramData\\GitHub") || t.Contains("hosted-compute") || t.Contains("Runner.Listener") || t.Contains("cmd.exe") || t.Contains("powershell") || t.Contains("WindowsTerminal"))) {
                    ShowWindow(hWnd, 6);
                  }
                }
                return true;
              }, IntPtr.Zero);
            }
          }
          '
          Add-Type -TypeDefinition $minCode
          [WinConsoleMin]::HideConsoles()
          Start-Sleep -Seconds 2

          $scr = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $b = New-Object System.Drawing.Bitmap $scr.Width, $scr.Height
          $g = [System.Drawing.Graphics]::FromImage($b)
          $g.CopyFromScreen(0,0,0,0,$b.Size)
          $b.Save("$env:OUT\shots\ScenaristBD_Portable_Running.png")
          $g.Dispose(); $b.Dispose()
          
          Write-Host "Screenshot saved to out/shots/ScenaristBD_Portable_Running.png"

      # ------------------------------------------------------------------
      - name: 5. Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scenarist-bd-portable-results
          path: out
