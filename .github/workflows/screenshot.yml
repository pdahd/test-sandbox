name: Run Scenarist BD Portable

on:
  workflow_dispatch:

jobs:
  run-portable:
    runs-on: windows-2025

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Portable Scenarist BD Package
        shell: powershell
        run: |
          Write-Host "Downloading ScenaristBD_Portable_v1.zip from Cloudflare Tunnel..."
          $url = "https://proxy.pdauhd.top/ScenaristBD_Portable_v1.zip"
          $output = "C:\ScenaristBD_Portable_v1.zip"
          Invoke-WebRequest -Uri $url -OutFile $output
          Write-Host "Download completed. File size: $((Get-Item $output).Length) bytes"

      - name: Extract Portable Package
        shell: powershell
        run: |
          Write-Host "Extracting portable package to C:\ScenaristBD_Portable..."
          Expand-Archive -Path "C:\ScenaristBD_Portable_v1.zip" -DestinationPath "C:\ScenaristBD_Portable" -Force
          Write-Host "Extraction complete."

      - name: Install Prerequisites Silently
        shell: powershell
        run: |
          $prereqDir = "C:\ScenaristBD_Portable\ISSetupPrerequisites"
          if (Test-Path $prereqDir) {
              Write-Host "Installing VC++ 2005 Redistributable..."
              Start-Process -FilePath "$prereqDir\VC2005_x86\vcredist_x86.exe" -ArgumentList "/q" -Wait -NoNewWindow

              Write-Host "Installing .NET Framework 3.5..."
              dism /online /enable-feature /featurename:NetFx3 /all /quiet /norestart

              Write-Host "Installing JRE 1.5..."
              Start-Process -FilePath "$prereqDir\JRE1.5\jre-1_5_0_09-windows-i586-p.exe" -ArgumentList "/s /v`"/qn REBOOT=Suppress`"" -Wait -NoNewWindow

              Write-Host "Installing Visual J# 2.0..."
              Start-Process -FilePath "$prereqDir\VJSharp2.0\vjredist.exe" -ArgumentList "/q /c:`"install.exe /q`"" -Wait -NoNewWindow

              Write-Host "Installing DirectX 9.0c Redist..."
              Start-Process -FilePath "$prereqDir\DirectX9\DXSETUP.exe" -ArgumentList "/silent" -Wait -NoNewWindow
          } else {
              Write-Host "ISSetupPrerequisites directory not found, skipping."
          }

      - name: Launch Scenarist BD App
        shell: powershell
        run: |
          $appPath = "C:\ScenaristBD_Portable\AuthoringApplication\ScenaristBD.exe"
          Write-Host "Starting ScenaristBD from $appPath..."
          $proc = Start-Process -FilePath $appPath -PassThru
          Write-Host "Process started with PID: $($proc.Id)"
          Start-Sleep -Seconds 12

      - name: Minimize Console Windows
        shell: powershell
        run: |
          $code = @"
          using System;
          using System.Text;
          using System.Runtime.InteropServices;

          public class WindowMinimizer {
              [DllImport("user32.dll")]
              private static extern bool EnumWindows(EnumWindowsProc enumProc, IntPtr lParam);

              [DllImport("user32.dll", CharSet = CharSet.Auto)]
              private static extern int GetWindowText(IntPtr hWnd, StringBuilder strText, int maxCount);

              [DllImport("user32.dll")]
              private static extern bool ShowWindow(IntPtr hWnd, int nCmdShow);

              private delegate bool EnumWindowsProc(IntPtr hWnd, IntPtr lParam);

              private const int SW_MINIMIZE = 6;

              public static void MinimizeRunnerConsole() {
                  EnumWindows((hWnd, lParam) => {
                      StringBuilder sb = new StringBuilder(256);
                      GetWindowText(hWnd, sb, 256);
                      string title = sb.ToString();

                      if (!string.IsNullOrEmpty(title) && (title.Contains("Runner.Listener") || title.Contains("hosted-compute") || title.Contains("cmd.exe") || title.Contains("powershell"))) {
                          ShowWindow(hWnd, SW_MINIMIZE);
                      }
                      return true;
                  }, IntPtr.Zero);
              }
          }
          "@
          Add-Type -TypeDefinition $code
          [WindowMinimizer]::MinimizeRunnerConsole()
          Start-Sleep -Seconds 2

      - name: Capture Fullscreen Screenshot
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)

          $screenshotPath = "C:\ScenaristBD_Portable_Running.png"
          $bitmap.Save($screenshotPath, [System.Drawing.Imaging.ImageFormat]::Png)

          $graphics.Dispose()
          $bitmap.Dispose()
          Write-Host "Screenshot saved to $screenshotPath"

      - name: Upload Running Screenshot
        uses: actions/upload-artifact@v7
        with:
          name: ScenaristBD-Portable-Screenshot
          path: C:\ScenaristBD_Portable_Running.png
