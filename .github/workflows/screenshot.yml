name: Scenarist BD Installer Screenshot

on:
  workflow_dispatch:
    inputs:
      setup_args:
        description: "setup.exe 附加参数。InstallShield 常用静默：/s /v\"/qn\"；留空则交互运行。"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  screenshot-installer:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Prepare directories
        run: |
          New-Item -ItemType Directory -Force dl, app, shots | Out-Null

      - name: Download original package
        run: |
          curl.exe -L --retry 3 -f -OJ --output-dir dl "https://1008.filemail.com/api/file/get?filekey=qZ8PSCAMNDT_UbcUmAm998Sbdsf_rsbG0d_8ihincKT-36w0PEM-2ToKW8eACEmyrA"
          $pkg = Get-ChildItem dl -File | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $pkg -or $pkg.Length -lt 1MB) { throw "下载失败或文件过小，链接可能已过期" }
          "PKG=$($pkg.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Package: $($pkg.FullName) ($($pkg.Length) bytes)"

      - name: Extract package
        run: |
          7z x "$env:PKG" -o"app" -y
          Get-ChildItem app -Recurse | Select-Object FullName | Format-Table -Wrap | Out-File shots\filetree.txt -Encoding utf8

      - name: Run installer (do not auto-launch)
        run: |
          $setup = Get-ChildItem app -Recurse -Filter setup.exe | Select-Object -First 1
          if (-not $setup) { throw "压缩包中未找到 setup.exe" }
          $args = "${{ inputs.setup_args }}"
          if ([string]::IsNullOrWhiteSpace($args)) {
            Write-Host "未指定静默参数，setup.exe 将以交互方式运行。"
            Start-Process -FilePath $setup.FullName -WorkingDirectory $setup.DirectoryName -Wait
          } else {
            Write-Host "启动安装: $($setup.FullName) $args"
            Start-Process -FilePath $setup.FullName -ArgumentList $args -WorkingDirectory $setup.DirectoryName -Wait
          }
          Write-Host "安装退出码: $LASTEXITCODE"

      - name: Screenshot installer wizard
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing, UIAutomationClient, UIAutomationTypes
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public class W {
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int n);
          }
          "@

          $log = "shots\log.txt"
          function Log($m) {
            $t = "[{0:HH:mm:ss.fff}] $m" -f (Get-Date)
            Write-Host $t
            Add-Content $log $t
          }

          $script:n = 0
          function Shot($tag) {
            $script:n++
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
            $file = "shots\{0:D3}_{1}.png" -f $script:n, ($tag -replace '[^\w\-]+','_')
            $bmp.Save($file, [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
            Log "截图 $file"
          }

          function Dump-Windows($tag) {
            $A = [System.Windows.Automation.AutomationElement]
            $roots = $A::RootElement.FindAll([System.Windows.Automation.TreeScope]::Children, [System.Windows.Automation.Condition]::TrueCondition)
            Log "==== windows @ $tag count=$($roots.Count) ===="
            foreach ($w in $roots) {
              try {
                $r = $w.Current.BoundingRectangle
                if ($r.Width -lt 20 -or $r.Height -lt 20) { continue }
                Log ("WIN name='{0}' class='{1}' size={2}x{3}" -f $w.Current.Name, $w.Current.ClassName, [int]$r.Width, [int]$r.Height)
              } catch {}
            }
          }

          # 最小化干扰窗口，截干净桌面
          (New-Object -ComObject Shell.Application).MinimizeAll()
          Start-Sleep -Milliseconds 600
          Shot "desktop_before_install"

          # 安装过程若已由上一步 -Wait 阻塞，这里继续截装完后状态
          # 若为静默安装，上一步立即返回，这里直接截后续窗口
          Dump-Windows "after_install_launch"
          Shot "after_install"

          # 自动点击安装向导推进按钮（Next / Install / I Agree / Finish 等）
          $A = [System.Windows.Automation.AutomationElement]
          $TS = [System.Windows.Automation.TreeScope]
          $nextPattern = '^(&?Next.*|下一步|&?Install|安装|&?Finish|完成|I &?Agree|&?Accept|同意|&?OK|确定|&?Yes|是)$'
          $neverClick = '^(Close|关闭|Cancel|取消)$'

          $idle = 0
          $lastSig = ""
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep 2
            Dump-Windows "wiz_$i"
            Shot ("wiz_{0:D2}" -f $i)

            $bc = New-Object System.Windows.Automation.PropertyCondition(
              $A::ControlTypeProperty, [System.Windows.Automation.ControlType]::Button)
            $btns = @($A::RootElement.FindAll($TS::Descendants, $bc))
            $names = @($btns | ForEach-Object { $_.Current.Name } | Where-Object { $_ })
            Log ("按钮: " + ($names -join " | "))
            $sig = ($names -join "|")
            if ($sig -eq $lastSig) { $idle++ } else { $idle = 0; $lastSig = $sig }

            $target = $btns | Where-Object {
              $_.Current.Name -match $nextPattern -and $_.Current.Name -notmatch $neverClick
            } | Select-Object -First 1

            if ($target) {
              Log "点击: $($target.Current.Name)"
              try {
                $target.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
              } catch {
                $h = [IntPtr]$target.Current.NativeWindowHandle
                [W]::SetForegroundWindow($h) | Out-Null
                [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
              }
              Start-Sleep 2
              continue
            }

            # 连续多次无可点推进按钮，且安装进程已结束，认为向导走完
            if ($idle -ge 4) {
              Log "未检测到推进按钮，认为安装向导已结束。"
              break
            }
          }

          # 安装完成后不启动 ScenaristBD.exe，按用户要求保留
          Shot "install_done_no_launch"
          Log "安装步骤结束，未启动主程序。"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installer-screenshots
          path: shots/
          if-no-files-found: warn
          retention-days: 7
