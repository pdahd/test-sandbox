name: Scenarist BD Portable - Install Dependencies & Run

on:
  workflow_dispatch:

env:
  PKG_URL: "https://proxy.pdauhd.top/ScenaristBD_Portable_v1.zip"
  OUT: ${{ github.workspace }}\out

jobs:
  run-portable:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell

    steps:
      # ------------------------------------------------------------------
      - name: 1. 桌面分辨率调整与基础初始化
        run: |
          New-Item -ItemType Directory -Force "$env:OUT\shots","$env:OUT\logs" | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $scr = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Write-Host "当前屏幕分辨率: $($scr.Width)x$($scr.Height)"

      # ------------------------------------------------------------------
      - name: 2. 下载并解压绿色版软件包
        run: |
          $f = "$env:RUNNER_TEMP\pkg.bin"
          curl.exe -L --fail --retry 3 -A "Mozilla/5.0" -o $f "$env:PKG_URL"
          if ($LASTEXITCODE -ne 0) { throw "下载绿色包失败 (exit $LASTEXITCODE)" }

          & "C:\Program Files\7-Zip\7z.exe" x $f "-o$env:RUNNER_TEMP\pkg" -y
          
          # 寻找绿色版主程序
          $exe = Get-ChildItem "$env:RUNNER_TEMP\pkg" -Recurse -Filter "ScenaristBD.exe" | Select-Object -First 1
          if (-not $exe) { throw "未能在绿色包中找到 ScenaristBD.exe 主程序" }
          
          # 寻找 ISSetupPrerequisites 依赖目录
          $prereq = Get-ChildItem "$env:RUNNER_TEMP\pkg" -Recurse -Filter "ISSetupPrerequisites" | Select-Object -First 1
          
          Write-Host "成功找到主程序: $($exe.FullName)"
          "APP_EXE=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "APP_DIR=$($exe.DirectoryName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          if ($prereq) {
            "PREREQ_DIR=$($prereq.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "成功找到依赖组件目录: $($prereq.FullName)"
          }

      # ------------------------------------------------------------------
      - name: 3. 检查系统依赖并静默安装缺失组件
        timeout-minutes: 30
        run: |
          $log = "$env:OUT\logs\dependencies.txt"
          function L($m){ $s = "[$(Get-Date -f HH:mm:ss)] $m"; Write-Host $s; Add-Content $log $s }
          function Installed($rx){ Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -EA SilentlyContinue | ? { $_.DisplayName -match $rx } | % DisplayName }
          function Run($exe,$a,$label){
            if (-not $exe -or -not (Test-Path $exe)) { L "$label : 安装文件不存在, 跳过"; return }
            try { $p = Start-Process -FilePath $exe -ArgumentList $a -Wait -PassThru; L "$label : 退出码 $($p.ExitCode) (0=成功 3010=需重启 1638/5100=已安装)" }
            catch { L "$label : 异常 $($_.Exception.Message)" } }

          L "=== Windows Installer 服务 ==="
          Start-Service msiserver -EA SilentlyContinue; L "msiserver: $((Get-Service msiserver).Status)"

          L "=== .NET Framework 2.0 / 3.5 (NetFx3) ==="
          $fx = Get-WindowsOptionalFeature -Online -FeatureName NetFx3
          L "NetFx3 当前状态: $($fx.State)"
          if ($fx.State -ne 'Enabled') {
            try { $r = Enable-WindowsOptionalFeature -Online -FeatureName NetFx3 -All -NoRestart -EA Stop; L "Enable-WindowsOptionalFeature 完成" }
            catch { L "启用失败, 使用 DISM: $($_.Exception.Message)"; dism.exe /Online /Enable-Feature /FeatureName:NetFx3 /All /NoRestart | Out-Null; L "dism 退出码 $LASTEXITCODE" }
            L "NetFx3 现状态: $((Get-WindowsOptionalFeature -Online -FeatureName NetFx3).State)" }

          L "=== Visual J# 2.0 Redistributable ==="
          $vjHas = (Installed 'Visual J#') -or (Get-ChildItem "$env:windir\assembly" -Recurse -Filter vjslib.dll -EA SilentlyContinue)
          if ($vjHas) { L "J# 已存在: $(Installed 'Visual J#')" }
          else { $vj = Get-ChildItem "$env:PREREQ_DIR" -Recurse -Filter vjredist.exe -EA SilentlyContinue | Select -First 1
                 Run $vj.FullName '/q:a /c:"install.exe /q"' 'J# 2.0'
                 L "J# 安装后状态: $(Installed 'Visual J#')" }

          L "=== Java Runtime 1.5 (32-bit) ==="
          $jreHas = (Test-Path 'HKLM:\SOFTWARE\WOW6432Node\JavaSoft\Java Runtime Environment\1.5') -or (Installed 'J2SE Runtime Environment 5|Java\(TM\) 2 Runtime|Java 5')
          if ($jreHas) { L "JRE 1.5 已存在" }
          else { $jre = Get-ChildItem "$env:PREREQ_DIR" -Recurse -Filter "jre-*.exe" -EA SilentlyContinue | Select -First 1
                 Run $jre.FullName '/s /v"/qn REBOOT=Suppress"' 'JRE 1.5.0_07'
                 L "JRE 注册表状态: $(Test-Path 'HKLM:\SOFTWARE\WOW6432Node\JavaSoft\Java Runtime Environment\1.5')" }

          L "=== Visual C++ 运行库 ==="
          Installed 'Visual C\+\+' | sort -Unique | % { L "  已存在: $_" }
          foreach ($a in 'x86','x64') {
            if (-not (Installed "Visual C\+\+ 2015-20\d\d.*$a")) {
              $e = "$env:RUNNER_TEMP\vc_$a.exe"; curl.exe -sL -o $e "https://aka.ms/vs/17/release/vc_redist.$a.exe"
              Run $e '/install /quiet /norestart' "VC++ 2015-2022 $a" } }

          L "=== DirectX 9 运行库 (d3dx9) ==="
          if (Test-Path "$env:windir\SysWOW64\d3dx9_43.dll") { L "d3dx9_43.dll 已存在" }
          else { $dx = "$env:RUNNER_TEMP\dxwebsetup.exe"
                 curl.exe -sL --fail -o $dx "https://download.microsoft.com/download/1/7/1/1718CCC4-6315-4D8E-9543-8E28A4E18C4C/dxwebsetup.exe"
                 if ($LASTEXITCODE -eq 0) { Run $dx '/Q' 'DirectX End-User Runtime' } else { L "dxwebsetup 下载失败, 跳过" } }

          L "=== Media Foundation 支持 ==="
          try { $mf = Get-WindowsFeature Server-Media-Foundation -EA Stop; L "Server-Media-Foundation: $($mf.InstallState)"
                if ($mf.InstallState -ne 'Installed') { $r = Install-WindowsFeature Server-Media-Foundation -EA Stop; L "安装结果: Success=$($r.Success)" } }
          catch { L "Media Foundation 检查失败: $($_.Exception.Message)" }
          L "=== 依赖安装处理完毕 ==="

      # ------------------------------------------------------------------
      - name: 4. 直接启动绿色版 Scenarist BD 主程序并截图
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          
          Write-Host "正在启动绿色免安装版 Scenarist BD..."
          $p = Start-Process -FilePath $env:APP_EXE -WorkingDirectory $env:APP_DIR -PassThru
          
          # 等待 12 秒让主界面完全加载
          Start-Sleep -Seconds 12
          
          # 截取主界面全屏
          $scr = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $b = New-Object System.Drawing.Bitmap $scr.Width, $scr.Height
          $g = [System.Drawing.Graphics]::FromImage($b)
          $g.CopyFromScreen(0,0,0,0,$b.Size)
          $b.Save("$env:OUT\shots\ScenaristBD_Portable_Running.png")
          $g.Dispose(); $b.Dispose()
          
          Write-Host "成功捕获并保存主程序运行截图 -> out/shots/ScenaristBD_Portable_Running.png"

      # ------------------------------------------------------------------
      - name: 5. 上传截图与依赖日志工件
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scenarist-bd-portable-results
          path: out
