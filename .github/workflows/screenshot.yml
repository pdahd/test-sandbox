name: Scenarist BD - install & screenshot

on:
  workflow_dispatch:
    inputs:
      setup_timeout_min:
        description: "Maximum wait time for setup wizard auto-interaction (minutes)"
        default: "35"

env:
  PKG_URL: "https://1008.filemail.com/api/file/get?filekey=qZ8PSCAMNDT_UbcUmAm998Sbdsf_rsbG0d_8ihincKT-36w0PEM-2ToKW8eACEmyrA"
  OUT: ${{ github.workspace }}\out

jobs:
  capture:
    runs-on: windows-2025
    timeout-minutes: 110
    defaults:
      run:
        shell: powershell      # Windows PowerShell 5.1; UIAutomation is more stable here

    steps:
      # ------------------------------------------------------------------
      - name: 1. Desktop check, minimize runner console, and try higher resolution
        run: |
          New-Item -ItemType Directory -Force "$env:OUT\shots","$env:OUT\logs" | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type @"
          using System; using System.Text; using System.Runtime.InteropServices;
          public static class U32 {
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc p, IntPtr l);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int cmd);
            [DllImport("user32.dll")] public static extern bool SetProcessDPIAware();
            [StructLayout(LayoutKind.Sequential, CharSet=CharSet.Ansi)]
            public struct DEVMODE {
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst=32)] public string dmDeviceName;
              public short dmSpecVersion, dmDriverVersion, dmSize, dmDriverExtra; public int dmFields;
              public int dmPositionX, dmPositionY, dmDisplayOrientation, dmDisplayFixedOutput;
              public short dmColor, dmDuplex, dmYResolution, dmTTOption, dmCollate;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst=32)] public string dmFormName;
              public short dmLogPixels; public int dmBitsPerPel, dmPelsWidth, dmPelsHeight, dmDisplayFlags, dmDisplayFrequency;
              public int dmICMMethod, dmICMIntent, dmMediaType, dmDitherType, dmReserved1, dmReserved2, dmPanningWidth, dmPanningHeight; }
            [DllImport("user32.dll")] public static extern int EnumDisplaySettings(string n, int mode, ref DEVMODE dm);
            [DllImport("user32.dll")] public static extern int ChangeDisplaySettings(ref DEVMODE dm, int flags);
          }
          "@
          [void][U32]::SetProcessDPIAware()
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "OS: $($os.Caption) | $($os.Version) | $($os.OSArchitecture)"
          Write-Host "Session: $((Get-Process -Id $PID).SessionId)  UserInteractive: $([Environment]::UserInteractive)  Explorer: $([bool](Get-Process explorer -EA SilentlyContinue))"

          # Minimize the hosted-compute-agent console. Do not close it.
          $cb = [U32+EnumProc]{ param($h, $l)
            if ([U32]::IsWindowVisible($h)) {
              $sb = New-Object System.Text.StringBuilder 1024
              [void][U32]::GetWindowText($h, $sb, 1024); $t = $sb.ToString()
              if ($t -and $t -match 'ProgramData\\GitHub|hosted-compute|Runner\.Listener') {
                Write-Host "minimize: $t"; [void][U32]::ShowWindow($h, 6) } }
            $true }
          [void][U32]::EnumWindows($cb, [IntPtr]::Zero)
          Get-Process ServerManager -EA SilentlyContinue | Stop-Process -Force -EA SilentlyContinue

          # Try to raise the resolution. The Hyper-V virtual GPU may reject it.
          $dm = New-Object U32+DEVMODE; $dm.dmSize = [Runtime.InteropServices.Marshal]::SizeOf($dm)
          [void][U32]::EnumDisplaySettings($null, -1, [ref]$dm)
          foreach ($res in @(@(1920,1080), @(1600,1200), @(1280,1024))) {
            $dm.dmPelsWidth = $res[0]; $dm.dmPelsHeight = $res[1]; $dm.dmFields = 0x80000 -bor 0x100000
            $rc = [U32]::ChangeDisplaySettings([ref]$dm, 0)
            if ($rc -eq 0) { Write-Host "resolution -> $($res[0])x$($res[1])"; break } else { Write-Host "resolution $($res[0])x$($res[1]) rejected ($rc)" } }
          $scr = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Write-Host "Screen now: $($scr.Width)x$($scr.Height)"

          # Baseline screenshot. Failure here means there is no interactive desktop.
          $b = New-Object System.Drawing.Bitmap $scr.Width, $scr.Height
          $g = [System.Drawing.Graphics]::FromImage($b); $g.CopyFromScreen(0,0,0,0,$b.Size)
          $b.Save("$env:OUT\shots\K_000000_baseline_desktop.png"); $g.Dispose(); $b.Dispose()

      # ------------------------------------------------------------------
      - name: 2. Download and extract installation package
        run: |
          $f = "$env:RUNNER_TEMP\pkg.bin"
          curl.exe -L --fail --retry 3 --retry-delay 5 -A "Mozilla/5.0" -o $f "$env:PKG_URL"
          if ($LASTEXITCODE -ne 0) { throw "download failed (curl exit $LASTEXITCODE); Filemail link may have expired" }
          $fi = Get-Item $f
          $fs = [IO.File]::OpenRead($f); $hb = New-Object byte[] 8; [void]$fs.Read($hb,0,8); $fs.Close()
          Write-Host "size=$($fi.Length)  magic=$(($hb | % { $_.ToString('X2') }) -join ' ')"
          if ($fi.Length -lt 1MB) { Get-Content $f -TotalCount 20; throw "file is too small; probably an HTML error page, not an archive" }
          & "C:\Program Files\7-Zip\7z.exe" x $f "-o$env:RUNNER_TEMP\pkg" -y | Select-Object -Last 4
          if ($LASTEXITCODE -ne 0) { throw "7-Zip extraction failed (exit $LASTEXITCODE)" }
          Get-ChildItem "$env:RUNNER_TEMP\pkg" -Recurse | % { "{0,12}  {1}" -f $_.Length, $_.FullName } | Tee-Object "$env:OUT\logs\package-tree.txt"
          $setup = Get-ChildItem "$env:RUNNER_TEMP\pkg" -Recurse -Filter setup.exe | Select-Object -First 1
          if (-not $setup) { throw "setup.exe was not found" }
          "SETUP_EXE=$($setup.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "PKG_DIR=$($setup.DirectoryName)"  | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "setup.exe => $($setup.FullName)"

      # ------------------------------------------------------------------
      - name: 3. Query system dependencies and install missing components
        timeout-minutes: 30
        run: |
          $log = "$env:OUT\logs\dependencies.txt"
          function L($m){ $s = "[$(Get-Date -f HH:mm:ss)] $m"; Write-Host $s; Add-Content $log $s }
          function Installed($rx){ Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -EA SilentlyContinue | ? { $_.DisplayName -match $rx } | % DisplayName }
          function Run($exe,$a,$label){
            if (-not $exe -or -not (Test-Path $exe)) { L "$label : installer does not exist, skip"; return }
            try { $p = Start-Process -FilePath $exe -ArgumentList $a -Wait -PassThru; L "$label : exit $($p.ExitCode)  (0=success 3010=reboot required 1638/5100=already installed or unsupported)" }
            catch { L "$label : exception $($_.Exception.Message)" } }

          L "=== Windows Installer service ==="
          Start-Service msiserver -EA SilentlyContinue; L "msiserver: $((Get-Service msiserver).Status)"

          L "=== .NET Framework 2.0 / 3.5 (NetFx3) ==="
          $fx = Get-WindowsOptionalFeature -Online -FeatureName NetFx3
          L "NetFx3 current: $($fx.State)"
          if ($fx.State -ne 'Enabled') {
            try { $r = Enable-WindowsOptionalFeature -Online -FeatureName NetFx3 -All -NoRestart -EA Stop; L "Enable-WindowsOptionalFeature completed, RestartNeeded=$($r.RestartNeeded)" }
            catch { L "Enable failed: $($_.Exception.Message), using DISM"; dism.exe /Online /Enable-Feature /FeatureName:NetFx3 /All /NoRestart | Out-Null; L "dism exit $LASTEXITCODE" }
            L "NetFx3 now: $((Get-WindowsOptionalFeature -Online -FeatureName NetFx3).State)" }
          L ".NET 2.0 registry version: $((Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\NET Framework Setup\NDP\v2.0.50727' -EA SilentlyContinue).Version)"
          L ".NET 4.x Release: $((Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\Full' -EA SilentlyContinue).Release)"
          L "(dotnetfx20.exe / isnetfx.exe inside the package are not run separately: Server 2025 rejects standalone .NET 2.0 installers, and NetFx3 already includes the 2.0 runtime)"

          L "=== Visual J# 2.0 Redistributable ==="
          $vjHas = (Installed 'Visual J#') -or (Get-ChildItem "$env:windir\assembly" -Recurse -Filter vjslib.dll -EA SilentlyContinue)
          if ($vjHas) { L "J# already exists: $(Installed 'Visual J#')" }
          else { $vj = Get-ChildItem "$env:PKG_DIR\ISSetupPrerequisites" -Recurse -Filter vjredist.exe | Select -First 1
                 Run $vj.FullName '/q:a /c:"install.exe /q"' 'J# 2.0'
                 L "J# after installation: $(Installed 'Visual J#')" }

          L "=== Java Runtime 1.5 (32-bit) ==="
          $jreHas = (Test-Path 'HKLM:\SOFTWARE\WOW6432Node\JavaSoft\Java Runtime Environment\1.5') -or (Installed 'J2SE Runtime Environment 5|Java\(TM\) 2 Runtime|Java 5')
          if ($jreHas) { L "JRE 1.5 already exists" }
          else { $jre = Get-ChildItem "$env:PKG_DIR\ISSetupPrerequisites" -Recurse -Filter "jre-*.exe" | Select -First 1
                 Run $jre.FullName '/s /v"/qn REBOOT=Suppress"' 'JRE 1.5.0_07'
                 L "JRE registry: $(Test-Path 'HKLM:\SOFTWARE\WOW6432Node\JavaSoft\Java Runtime Environment\1.5')" }

          L "=== Visual C++ runtimes ==="
          Installed 'Visual C\+\+' | sort -Unique | % { L "  already exists: $_" }
          foreach ($a in 'x86','x64') {
            if (-not (Installed "Visual C\+\+ 2015-20\d\d.*$a")) {
              $e = "$env:RUNNER_TEMP\vc_$a.exe"; curl.exe -sL -o $e "https://aka.ms/vs/17/release/vc_redist.$a.exe"
              Run $e '/install /quiet /norestart' "VC++ 2015-2022 $a" } }

          L "=== Legacy DirectX 9 runtime (d3dx9) ==="
          if (Test-Path "$env:windir\SysWOW64\d3dx9_43.dll") { L "d3dx9_43.dll already exists" }
          else { $dx = "$env:RUNNER_TEMP\dxwebsetup.exe"
                 curl.exe -sL --fail -o $dx "https://download.microsoft.com/download/1/7/1/1718CCC4-6315-4D8E-9543-8E28A4E18C4C/dxwebsetup.exe"
                 if ($LASTEXITCODE -eq 0) { Run $dx '/Q' 'DirectX End-User Runtime' } else { L "dxwebsetup download failed, skip" } }

          L "=== Media Foundation (may not be installed on Server edition) ==="
          try { $mf = Get-WindowsFeature Server-Media-Foundation -EA Stop; L "Server-Media-Foundation: $($mf.InstallState)"
                if ($mf.InstallState -ne 'Installed') { $r = Install-WindowsFeature Server-Media-Foundation -EA Stop; L "Installation result: Success=$($r.Success) Restart=$($r.RestartNeeded)" } }
          catch { L "Media Foundation check failed: $($_.Exception.Message)" }
          L "=== Dependency processing completed ==="

      # ------------------------------------------------------------------
      - name: 4. Run setup.exe, auto-interact with full screenshots, then launch main program
        timeout-minutes: 60
        env:
          SETUP_TIMEOUT_MIN: ${{ inputs.setup_timeout_min || '35' }}
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing, WindowsBase, UIAutomationClient, UIAutomationTypes
          Add-Type -TypeDefinition @'
          using System;
          using System.Text;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;

          public class UiCtl {
            public IntPtr Hwnd;
            public string Cls;
            public string Txt;
            public bool Enabled;
            public bool Visible;
            public int Left;
            public int Top;
            public int Right;
            public int Bottom;
          }

          public static class Ui32 {
            public delegate bool EnumProc(IntPtr hWnd, IntPtr lParam);
            public const uint BM_CLICK = 0x00F5;
            public const uint BM_GETCHECK = 0x00F0;
            public const int GWL_STYLE = -16;

            [StructLayout(LayoutKind.Sequential)]
            public struct RECT {
              public int Left;
              public int Top;
              public int Right;
              public int Bottom;
            }

            [StructLayout(LayoutKind.Sequential)]
            public struct POINT {
              public int X;
              public int Y;
            }

            [StructLayout(LayoutKind.Sequential)]
            public struct GUIINFO {
              public uint cbSize;
              public uint flags;
              public IntPtr hwndActive;
              public IntPtr hwndFocus;
              public IntPtr hwndCapture;
              public IntPtr hwndMenuOwner;
              public IntPtr hwndMoveSize;
              public IntPtr hwndCaret;
              public RECT rcCaret;
            }

            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc cb, IntPtr l);
            [DllImport("user32.dll")] public static extern bool EnumChildWindows(IntPtr h, EnumProc cb, IntPtr l);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetClassName(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] public static extern bool IsWindowEnabled(IntPtr h);
            [DllImport("user32.dll")] public static extern bool IsWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern bool IsChild(IntPtr parent, IntPtr child);
            [DllImport("user32.dll")] public static extern IntPtr WindowFromPoint(POINT p);
            [DllImport("user32.dll")] public static extern bool GetGUIThreadInfo(uint threadId, ref GUIINFO info);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int c);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern bool BringWindowToTop(IntPtr h);
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("kernel32.dll")] public static extern uint GetCurrentThreadId();
            [DllImport("user32.dll")] public static extern bool AttachThreadInput(uint a, uint b, bool f);
            [DllImport("user32.dll")] public static extern IntPtr SendMessage(IntPtr h, uint m, IntPtr w, IntPtr l);
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h, uint m, IntPtr w, IntPtr l);
            [DllImport("user32.dll", EntryPoint="GetWindowLongPtrW")] public static extern IntPtr GetWindowLongPtr(IntPtr h, int i);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint f, uint x, uint y, uint d, UIntPtr e);
            [DllImport("user32.dll")] public static extern bool SetProcessDPIAware();

            [DllImport("user32.dll", EntryPoint="SendMessageTimeoutW",
              ExactSpelling=true, CharSet=CharSet.Unicode, SetLastError=true)]
            private static extern IntPtr ReadMessage(
              IntPtr h, uint message, IntPtr wParam,
              [Out] StringBuilder buffer, uint flags, uint timeout,
              out IntPtr result);

            static string TxtOf(IntPtr h) {
              var b = new StringBuilder(1024);
              GetWindowText(h, b, 1024);
              return b.ToString();
            }

            static string ClsOf(IntPtr h) {
              var b = new StringBuilder(256);
              GetClassName(h, b, 256);
              return b.ToString();
            }

            public static UiCtl New(IntPtr h) {
              var c = new UiCtl();
              c.Hwnd = h;
              c.Cls = ClsOf(h);
              c.Txt = TxtOf(h);
              c.Enabled = IsWindowEnabled(h);
              c.Visible = IsWindowVisible(h);
              RECT r;
              GetWindowRect(h, out r);
              c.Left = r.Left;
              c.Top = r.Top;
              c.Right = r.Right;
              c.Bottom = r.Bottom;
              return c;
            }

            public static List<UiCtl> Tops() {
              var list = new List<UiCtl>();
              EnumWindows(delegate(IntPtr h, IntPtr l) {
                if (IsWindowVisible(h)) list.Add(New(h));
                return true;
              }, IntPtr.Zero);
              return list;
            }

            public static List<UiCtl> Kids(IntPtr parent) {
              var list = new List<UiCtl>();
              EnumChildWindows(parent, delegate(IntPtr h, IntPtr l) {
                list.Add(New(h));
                return true;
              }, IntPtr.Zero);
              return list;
            }

            public static int ProcId(IntPtr h) {
              uint p;
              GetWindowThreadProcessId(h, out p);
              return (int)p;
            }

            public static void Focus(IntPtr h) {
              uint dummy;
              IntPtr fg = GetForegroundWindow();
              uint fgTid = 0;
              if (fg != IntPtr.Zero)
                fgTid = GetWindowThreadProcessId(fg, out dummy);

              uint me = GetCurrentThreadId();
              if (fgTid != 0 && fgTid != me)
                AttachThreadInput(fgTid, me, true);

              ShowWindow(h, 9);
              BringWindowToTop(h);
              SetForegroundWindow(h);

              if (fgTid != 0 && fgTid != me)
                AttachThreadInput(fgTid, me, false);
            }

            public static int Check(IntPtr h) {
              return (int)SendMessage(h, BM_GETCHECK, IntPtr.Zero, IntPtr.Zero);
            }

            public static void Click(IntPtr h) {
              SendMessage(h, BM_CLICK, IntPtr.Zero, IntPtr.Zero);
            }

            public static bool IsRadio(IntPtr h) {
              long style = (long)GetWindowLongPtr(h, GWL_STYLE);
              int t = (int)(style & 0xF);
              return t == 4 || t == 9;
            }

            public static void RealClick(IntPtr h) {
              RECT r;
              GetWindowRect(h, out r);
              SetCursorPos((r.Left + r.Right) / 2, (r.Top + r.Bottom) / 2);
              mouse_event(2, 0, 0, 0, UIntPtr.Zero);
              mouse_event(4, 0, 0, 0, UIntPtr.Zero);
            }

            public static void ClickAt(int x, int y) {
              SetCursorPos(x, y);
              System.Threading.Thread.Sleep(120);
              mouse_event(2, 0, 0, 0, UIntPtr.Zero);
              mouse_event(4, 0, 0, 0, UIntPtr.Zero);
            }

            public static bool OwnsPoint(IntPtr parent, int x, int y) {
              POINT p = new POINT();
              p.X = x;
              p.Y = y;
              IntPtr hit = WindowFromPoint(p);
              return hit == parent ||
                (hit != IntPtr.Zero && IsChild(parent, hit));
            }

            public static bool CanHit(IntPtr h) {
              if (!IsWindow(h) || !IsWindowVisible(h) || !IsWindowEnabled(h))
                return false;

              RECT r;
              if (!GetWindowRect(h, out r) ||
                  r.Right <= r.Left || r.Bottom <= r.Top)
                return false;

              POINT p = new POINT();
              p.X = (r.Left + r.Right) / 2;
              p.Y = (r.Top + r.Bottom) / 2;
              IntPtr hit = WindowFromPoint(p);
              return hit == h || IsChild(h, hit);
            }

            public static bool HasFieldFocus(IntPtr dialog, IntPtr field) {
              if (GetForegroundWindow() != dialog)
                return false;

              uint pid;
              uint thread = GetWindowThreadProcessId(field, out pid);
              if (thread == 0)
                return false;

              GUIINFO info = new GUIINFO();
              info.cbSize = (uint)Marshal.SizeOf(typeof(GUIINFO));
              if (!GetGUIThreadInfo(thread, ref info))
                return false;

              return info.hwndFocus == field ||
                     IsChild(field, info.hwndFocus);
            }

            public static string ReadEdit(IntPtr h) {
              if (!IsWindow(h))
                throw new InvalidOperationException("Edit control no longer exists.");

              var buffer = new StringBuilder(4096);
              IntPtr result;
              IntPtr ok = ReadMessage(
                h, 0x000D, new IntPtr(buffer.Capacity),
                buffer, 0x0002, 2000, out result);

              if (ok == IntPtr.Zero)
                throw new InvalidOperationException(
                  "WM_GETTEXT failed or timed out.");

              return buffer.ToString().TrimEnd('\r', '\n');
            }
          }
          '@
          [void][Ui32]::SetProcessDPIAware()

          $shots = "$env:OUT\shots"
          $log = "$env:OUT\logs\setup-ui.txt"
          $script:runStart = Get-Date

          function L($m) {
            $s = "[$(Get-Date -f HH:mm:ss.fff)] $m"
            Write-Host $s
            Add-Content $log $s
          }

          function Shot($tag) {
            try {
              $r = [System.Windows.Forms.SystemInformation]::VirtualScreen
              $b = New-Object System.Drawing.Bitmap $r.Width, $r.Height
              $g = [System.Drawing.Graphics]::FromImage($b)
              $g.CopyFromScreen($r.Left, $r.Top, 0, 0, $b.Size)
              $t = ($tag -replace '[^\w\-]', '_')
              if ($t.Length -gt 50) { $t = $t.Substring(0, 50) }
              $b.Save(
                "$shots\K_$(Get-Date -f HHmmss_fff)_$t.png",
                [System.Drawing.Imaging.ImageFormat]::Png
              )
              $g.Dispose()
              $b.Dispose()
            }
            catch {
              L "screenshot failed: $($_.Exception.Message)"
            }
          }

          # Keep the existing 1.5-second screenshot timeline.
          $job = Start-Job -ArgumentList $shots -ScriptBlock {
            param($d)
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $i = 0
            while (-not (Test-Path "$d\STOP")) {
              try {
                $r = [System.Windows.Forms.SystemInformation]::VirtualScreen
                $b = New-Object System.Drawing.Bitmap $r.Width, $r.Height
                $g = [System.Drawing.Graphics]::FromImage($b)
                $g.CopyFromScreen($r.Left, $r.Top, 0, 0, $b.Size)
                $b.Save(
                  ("$d\F_{0:D4}_{1}.jpg" -f (++$i), (Get-Date -f HHmmss)),
                  [System.Drawing.Imaging.ImageFormat]::Jpeg
                )
                $g.Dispose()
                $b.Dispose()
              }
              catch {}
              Start-Sleep -Milliseconds 1500
            }
          }

          $wshell = New-Object -ComObject WScript.Shell

          $installerProcs = '^(setup|setup64|msiexec|ISBEW64|IDriver|IDriver2|_isdel|ikernel|jre.*|javaw|java|vjredist|install|dotnetfx20|isnetfx|dxwebsetup|dxsetup|haspdinst|sentinel.*|scenarist.*)$'
          $titleRx = '(?i)Scenarist|InstallShield|Java|J#|\.NET Framework|Sentinel|HASP|Installer|Install|Program Compatibility|Security Warning|Visual C\+\+'
          $neverRx = '(?i)cancel|back|exit|abort|restart now|reboot now|restart my computer now|yes,?\s+i want to restart|remove|repair|modify|print|learn more'
          $acceptRx = '(?i)^\s*&?I\s+accept\b'
          $denyRx = '(?i)do\s+not\s+accept'
          $normalOrder = @(
            '(?i)^&?Install\b',
            '(?i)^&?Next',
            '(?i)^&?Finish',
            '(?i)^&?Yes\b',
            '(?i)^&?OK\b',
            '(?i)^&?Continue',
            '(?i)^&?Run\b',
            '(?i)^&?Close\b'
          )

          $seen = @{}
          $clicked = @{}
          $acceptTries = @{}
          $script:customerTries = @{}
          $script:pcaTries = @{}
          $script:pcaGaveUp = @{}
          $script:pcaClosed = @{}
          $script:finishTries = @{}
          $script:finishConfirmed = $false
          $script:appExitLogged = $false
          $script:activationHandled = $false
          $script:stopReason = $null

          function Test-Radio($ctl) {
            try { return [Ui32]::IsRadio($ctl.Hwnd) }
            catch { return $false }
          }

          function Clean-Name([string]$s) {
            if (-not $s) { return '' }
            $t = $s.Replace('&', '').Replace('<', '').Replace('>', '').Trim().ToLowerInvariant()
            while ($t.Contains('  ')) { $t = $t.Replace('  ', ' ') }
            return $t
          }

          function Test-Alive($hwnd) {
            return ([Ui32]::IsWindow($hwnd) -and [Ui32]::IsWindowVisible($hwnd))
          }

          function Dump-Uia($hwnd, [int]$max) {
            $items = New-Object System.Collections.ArrayList
            try {
              $root = [System.Windows.Automation.AutomationElement]::FromHandle($hwnd)
              $all = $root.FindAll(
                [System.Windows.Automation.TreeScope]::Descendants,
                [System.Windows.Automation.Condition]::TrueCondition
              )
              $n = 0
              foreach ($e in $all) {
                if ($n -ge $max) { break }
                $n++
                $nm = [string]$e.Current.Name
                if ($nm) {
                  [void]$items.Add(('{0}:{1}' -f $e.Current.ControlType.ProgrammaticName, $nm))
                }
              }
            }
            catch {
              [void]$items.Add('uia-error: ' + $_.Exception.Message)
            }
            return ($items -join ' | ')
          }

          function Get-WizardWindows {
            $res = New-Object System.Collections.ArrayList

            foreach ($t in [Ui32]::Tops()) {
              if (-not $t.Visible) { continue }
              if ([string]::IsNullOrWhiteSpace($t.Txt)) { continue }
              if ($t.Txt -match 'ProgramData\\GitHub|hosted-compute|Runner\.Listener') { continue }
              if ($script:pcaGaveUp.ContainsKey($t.Hwnd.ToString())) { continue }

              $procName = 'unknown'
              try {
                $procName = (Get-Process -Id ([Ui32]::ProcId($t.Hwnd)) -ErrorAction Stop).ProcessName
              }
              catch {
                $procName = 'unknown'
              }

              if ($procName -match '^(powershell|pwsh|conhost|WindowsTerminal|explorer|Taskmgr|WmiPrvSE)$') {
                continue
              }

              if (($procName -match $installerProcs) -or ($t.Txt -match $titleRx)) {
                [void]$res.Add([pscustomobject]@{
                  H = $t.Hwnd
                  Title = $t.Txt
                  Cls = $t.Cls
                  Proc = $procName
                })
              }
            }

            return @($res | Sort-Object @{ Expression = {
              if ($_.Title -eq 'Scenarist BD') { 0 }
              elseif ($_.Cls -eq '#32770') { 1 }
              elseif ($_.Title -match '(?i)InstallShield') { 2 }
              elseif ($_.Title -match '(?i)Program Compatibility') { 4 }
              else { 3 }
            } })
          }

          function Find-CustomerField($kids, [string]$labelRegex) {
            $labels = @($kids | Where-Object {
              $_.Visible -and
              ((($_.Txt -replace '&', '') -replace '\s+', ' ').Trim() -match
                $labelRegex)
            })

            if ($labels.Count -ne 1) {
              throw ("Customer label '{0}' matched {1} visible controls." -f
                $labelRegex, $labels.Count)
            }

            $label = $labels[0]

            $candidates = @($kids | Where-Object {
              $_.Visible -and $_.Enabled -and
              ($_.Right - $_.Left) -ge 120 -and
              ($_.Bottom - $_.Top) -ge 14 -and
              ($_.Bottom - $_.Top) -le 45 -and
              $_.Top -ge ($label.Top - 2) -and
              $_.Top -le ($label.Bottom + 38) -and
              $_.Left -ge ($label.Left - 16) -and
              $_.Left -le ($label.Left + 75) -and
              ($_.Cls -match '(?i)edit' -or
                [string]::IsNullOrWhiteSpace($_.Txt))
            } | Where-Object {
              [Ui32]::CanHit($_.Hwnd)
            } | Sort-Object `
              @{ Expression = { if ($_.Cls -match '(?i)edit') { 0 } else { 1 } } },
              @{ Expression = { [Math]::Abs($_.Top - $label.Bottom) } },
              Left)

            if ($candidates.Count -eq 0) {
              throw ("No reachable input found below '{0}'." -f $label.Txt)
            }

            return $candidates[0]
          }

          function Set-CustomerField(
            $dialog, $field, [string]$value,
            [string]$label, [bool]$forceTyping
          ) {
            $current = [Ui32]::ReadEdit($field.Hwnd)

            if ($current -cne $value -or $forceTyping) {
              [Ui32]::Focus($dialog)
              Start-Sleep -Milliseconds 200

              if ([Ui32]::GetForegroundWindow() -ne $dialog) {
                throw ("Customer dialog is not foreground before '{0}'." -f
                  $label)
              }

              if (-not [Ui32]::CanHit($field.Hwnd)) {
                throw ("Cannot safely click '{0}' input." -f $label)
              }

              [Ui32]::RealClick($field.Hwnd)
              Start-Sleep -Milliseconds 200

              if (-not [Ui32]::HasFieldFocus($dialog, $field.Hwnd)) {
                throw ("Keyboard focus is not on '{0}'." -f $label)
              }

              [void]$wshell.SendKeys('^a')
              Start-Sleep -Milliseconds 100

              if (-not [Ui32]::HasFieldFocus($dialog, $field.Hwnd)) {
                throw ("Focus changed before typing '{0}'." -f $label)
              }

              [void]$wshell.SendKeys($value)
              Start-Sleep -Milliseconds 200

              if (-not [Ui32]::HasFieldFocus($dialog, $field.Hwnd)) {
                throw ("Focus changed before committing '{0}'." -f $label)
              }

              [void]$wshell.SendKeys('{TAB}')
              Start-Sleep -Milliseconds 300
            }

            $actual = [Ui32]::ReadEdit($field.Hwnd)
            if ($actual -cne $value) {
              throw ("Read-back mismatch for '{0}'." -f $label)
            }

            L ("   customer: {0} verified='{1}'" -f $label, $actual)
          }

          function Invoke-CustomerPage($win, $kids) {
            $key = $win.H.ToString()
            if (-not $script:customerTries.ContainsKey($key)) {
              $script:customerTries[$key] = 0
            }

            $script:customerTries[$key] = [int]$script:customerTries[$key] + 1
            $attempt = [int]$script:customerTries[$key]

            if ($attempt -gt 3) {
              $script:stopReason =
                'Customer Information did not advance after three attempts.'
              return $true
            }

            L ("   customer page: attempt {0}/3" -f $attempt)

            try {
              if ($attempt -eq 1) {
                foreach ($c in $kids) {
                  L ("   customer control: hwnd={0} class='{1}' visible={2} enabled={3} rect=({4},{5},{6},{7})" -f
                    $c.Hwnd, $c.Cls, $c.Visible, $c.Enabled,
                    $c.Left, $c.Top, $c.Right, $c.Bottom)
                }
              }

              $nameField = Find-CustomerField $kids '(?i)^User\s+Name\s*:\s*$'
              $companyField = Find-CustomerField $kids '(?i)^Company\s*\(required\)\s*:\s*$'

              if ($nameField.Hwnd -eq $companyField.Hwnd) {
                throw 'User Name and Company resolved to the same control.'
              }

              L ("   customer: User Name class='{0}' hwnd={1}" -f
                $nameField.Cls, $nameField.Hwnd)
              L ("   customer: Company class='{0}' hwnd={1}" -f
                $companyField.Cls, $companyField.Hwnd)

              Shot 'customer_before_fill'
              Set-CustomerField $win.H $nameField 'Admin' 'User Name' ($attempt -gt 1)
              Set-CustomerField $win.H $companyField 'Home' 'Company' ($attempt -gt 1)
              Shot 'customer_fields_verified'

              $next = $null
              for ($i = 0; $i -lt 15; $i++) {
                $next = [Ui32]::Kids($win.H) | Where-Object {
                  $_.Visible -and $_.Enabled -and
                  $_.Cls -match '(?i)^button$' -and
                  (($_.Txt -replace '&', '').Trim() -match
                    '(?i)^Next\s*>?\s*$')
                } | Select-Object -First 1

                if ($next) { break }
                Start-Sleep -Milliseconds 350
              }

              if (-not $next) {
                throw 'Both fields were verified, but Next is still disabled.'
              }

              [Ui32]::Focus($win.H)
              Start-Sleep -Milliseconds 200

              if ([Ui32]::GetForegroundWindow() -ne $win.H) {
                throw 'Customer dialog is not foreground before Next.'
              }

              L '   customer: Next enabled; clicking'
              Shot 'customer_before_next'
              [Ui32]::Click($next.Hwnd)

              $stillCustomer = $true
              for ($i = 0; $i -lt 20; $i++) {
                Start-Sleep -Milliseconds 400
                $stillCustomer = @([Ui32]::Kids($win.H) |
                  Where-Object {
                    $_.Visible -and $_.Txt -eq 'Customer Information'
                  }).Count -gt 0
                if (-not $stillCustomer) { break }
              }

              if ($stillCustomer) {
                throw 'Next was clicked, but Customer Information is still visible.'
              }

              Shot 'customer_after_next'
              L '   customer: page transition confirmed'
            }
            catch {
              L ("   customer page attempt {0} failed: {1}" -f
                $attempt, $_.Exception.Message)
              Shot ("customer_attempt_{0}_failed" -f $attempt)

              if ($attempt -ge 3) {
                $script:stopReason =
                  'Customer Information failed after three attempts: ' +
                  $_.Exception.Message
              }
            }

            return $true
          }

          function Get-ButtonFromElement($el) {
            $cur = $el
            for ($d = 0; $d -lt 5 -and $cur; $d++) {
              try {
                if ($cur.Current.ControlType.ProgrammaticName -eq 'ControlType.Button') {
                  return $cur
                }
                $cur = [System.Windows.Automation.TreeWalker]::ControlViewWalker.GetParent($cur)
              }
              catch {
                return $null
              }
            }
            return $null
          }

          function Find-PcaButtons($hwnd, [int]$procId) {
            $map = @{}
            $w = [Ui32]::New($hwnd)
            $width = $w.Right - $w.Left
            $height = $w.Bottom - $w.Top

            if ($width -lt 400 -or $height -lt 170) {
              return $map
            }

            # Inspect only the right-hand action area of this known warning.
            $locations = @(
              @(0.70, 0.83),
              @(0.76, 0.83),
              @(0.82, 0.83),
              @(0.70, 0.86),
              @(0.76, 0.86),
              @(0.82, 0.86)
            )

            foreach ($location in $locations) {
              $x = [int][Math]::Round($w.Left + $width * $location[0])
              $y = [int][Math]::Round($w.Top + $height * $location[1])

              if (-not [Ui32]::OwnsPoint($hwnd, $x, $y)) {
                continue
              }

              try {
                $point = [System.Windows.Point]::new(
                  [double]$x, [double]$y
                )
                $el = [System.Windows.Automation.AutomationElement]::FromPoint(
                  $point
                )
                if (-not $el) { continue }

                $button = Get-ButtonFromElement $el
                if (-not $button) { continue }

                $name = Clean-Name ([string]$button.Current.Name)
                if ($name -eq 'cancel' -and
                    $button.Current.IsEnabled -and
                    -not $map.ContainsKey($name)) {
                  $map[$name] = $button
                }
              }
              catch {
                L ("   PCA point UIA lookup failed at {0},{1}: {2}" -f
                  $x, $y, $_.Exception.Message)
              }
            }

            # XAML may expose controls only under a child HWND.
            foreach ($child in [Ui32]::Kids($hwnd)) {
              try {
                $root = [System.Windows.Automation.AutomationElement]::FromHandle(
                  $child.Hwnd
                )
                $condition = New-Object `
                  System.Windows.Automation.PropertyCondition(
                    [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                    [System.Windows.Automation.ControlType]::Button
                  )

                $all = $root.FindAll(
                  [System.Windows.Automation.TreeScope]::Descendants,
                  $condition
                )

                foreach ($button in $all) {
                  $name = Clean-Name ([string]$button.Current.Name)
                  if ($name -eq 'cancel' -and
                      $button.Current.IsEnabled -and
                      -not $map.ContainsKey($name)) {
                    $map[$name] = $button
                  }
                }
              }
              catch {
                L ("   PCA child UIA lookup failed: {0}" -f
                  $_.Exception.Message)
              }
            }

            return $map
          }

          function Test-PcaIdentity($win) {
            if ($win.Title -cne 'Program Compatibility Assistant') {
              L ("PCA: refusing unexpected window title '{0}'" -f $win.Title)
              return $false
            }

            if (-not (Test-Alive $win.H)) {
              return $false
            }

            try {
              $processId = [Ui32]::ProcId($win.H)
              $process = Get-Process -Id $processId -ErrorAction Stop
              $expected = [IO.Path]::GetFullPath(
                (Join-Path $env:windir 'System32\pcaui.exe')
              )
              $actual = [IO.Path]::GetFullPath([string]$process.Path)

              if ($process.ProcessName -ine 'pcaui' -or
                  $actual -ine $expected) {
                L ("PCA: refusing window owned by '{0}' at '{1}'" -f
                  $process.ProcessName, $actual)
                return $false
              }

              return $true
            }
            catch {
              L ("PCA: process identity could not be verified: {0}" -f
                $_.Exception.Message)
              return $false
            }
          }

          function Wait-PcaGone($hwnd, [int]$milliseconds) {
            $until = (Get-Date).AddMilliseconds($milliseconds)

            do {
              if (-not (Test-Alive $hwnd)) {
                return $true
              }
              Start-Sleep -Milliseconds 250
            } while ((Get-Date) -lt $until)

            return (-not (Test-Alive $hwnd))
          }

          function Invoke-PcaPoint(
            $win, [int]$x, [int]$y, [string]$action
          ) {
            if (-not (Test-PcaIdentity $win)) {
              return $false
            }

            [Ui32]::Focus($win.H)
            Start-Sleep -Milliseconds 250

            if ([Ui32]::GetForegroundWindow() -ne $win.H) {
              L ("PCA: {0} skipped; warning is not foreground" -f $action)
              return $false
            }

            $rect = [Ui32]::New($win.H)
            if ($x -le $rect.Left -or $x -ge $rect.Right -or
                $y -le $rect.Top -or $y -ge $rect.Bottom) {
              L ("PCA: {0} skipped; point is outside warning" -f $action)
              return $false
            }

            $screen = [System.Windows.Forms.SystemInformation]::VirtualScreen
            if ($x -lt $screen.Left -or $x -ge $screen.Right -or
                $y -lt $screen.Top -or $y -ge $screen.Bottom) {
              L ("PCA: {0} skipped; point is outside display" -f $action)
              return $false
            }

            if (-not [Ui32]::OwnsPoint($win.H, $x, $y)) {
              L ("PCA: {0} skipped; point hit another window" -f $action)
              return $false
            }

            L ("PCA: clicking {0} at screen point ({1},{2})" -f
              $action, $x, $y)
            Shot ("pca_before_" + $action)
            [Ui32]::ClickAt($x, $y)

            if (Wait-PcaGone $win.H 2500) {
              L ("PCA: dismissed via {0}" -f $action)
              Shot ("pca_closed_" + $action)
              return $true
            }

            L ("PCA: still visible after {0}" -f $action)
            Shot ("pca_still_visible_" + $action)
            return $false
          }

          function Close-PcaWindow($win) {
            $key = $win.H.ToString()

            if ($script:pcaClosed.ContainsKey($key)) {
              return $false
            }
            if ($script:pcaGaveUp.ContainsKey($key)) {
              return $false
            }

            if (-not (Test-PcaIdentity $win)) {
              $script:pcaGaveUp[$key] = $true
              return $false
            }

            if (-not $script:pcaTries.ContainsKey($key)) {
              $script:pcaTries[$key] = 0
            }

            $script:pcaTries[$key] =
              [int]$script:pcaTries[$key] + 1
            $attempt = [int]$script:pcaTries[$key]
            $processId = [Ui32]::ProcId($win.H)

            if ($attempt -eq 1) {
              L ("== [PCA] warning hwnd={0} title='{1}' pid={2}" -f
                $key, $win.Title, $processId)
              L ("   PCA child windows: {0}" -f (
                ([Ui32]::Kids($win.H) | ForEach-Object {
                  '{0}[{1}]' -f $_.Cls, $_.Txt
                }) -join ' | '
              ))
              L ("   PCA uia(root): {0}" -f
                (Dump-Uia $win.H 60))
              Shot 'pca_detected'
            }

            try {
              [Ui32]::Focus($win.H)
              Start-Sleep -Milliseconds 200

              # Try a named Cancel button, if the XAML provider exposes one.
              try {
                $buttons = Find-PcaButtons $win.H $processId
                L ("   PCA buttons located: {0}" -f
                  (($buttons.Keys | Sort-Object) -join ' | '))

                if ($buttons.ContainsKey('cancel')) {
                  $button = $buttons['cancel']
                  $pattern = $null

                  if ($button.TryGetCurrentPattern(
                      [System.Windows.Automation.InvokePattern]::Pattern,
                      [ref]$pattern)) {
                    L 'PCA: invoking named Cancel button'
                    Shot 'pca_before_uia_cancel'
                    $pattern.Invoke()

                    if (Wait-PcaGone $win.H 2500) {
                      $script:pcaClosed[$key] = $true
                      L 'PCA: dismissed via UIA Cancel'
                      Shot 'pca_closed_uia_cancel'
                      return $true
                    }
                  }
                }
              }
              catch {
                L ("PCA: named-button lookup failed: {0}" -f
                  $_.Exception.Message)
              }

              if (-not (Test-Alive $win.H)) {
                $script:pcaClosed[$key] = $true
                return $true
              }

              $rect = [Ui32]::New($win.H)
              $width = $rect.Right - $rect.Left
              $height = $rect.Bottom - $rect.Top

              # These proportions select the center of the right-hand
              # Cancel button in the supplied PCA screenshot, rather than
              # the left-hand Learn more button. Use the current HWND rect.
              if ($width -ge 450 -and $width -le 850 -and
                  $height -ge 180 -and $height -le 380) {
                $cancelX = [int][Math]::Round(
                  $rect.Left + $width * 0.73
                )
                $cancelY = [int][Math]::Round(
                  $rect.Top + $height * 0.83
                )

                if (Invoke-PcaPoint $win $cancelX $cancelY 'mouse_cancel') {
                  $script:pcaClosed[$key] = $true
                  return $true
                }

                if (Test-Alive $win.H) {
                  # Only this verified PCA window may receive the X click.
                  $rect = [Ui32]::New($win.H)
                  $closeX = $rect.Right - 16
                  $closeY = $rect.Top + 15

                  if (Invoke-PcaPoint $win $closeX $closeY 'titlebar_x') {
                    $script:pcaClosed[$key] = $true
                    return $true
                  }
                }
              }
              else {
                L ("PCA: unexpected window size {0}x{1}; skipping positional clicks" -f
                  $width, $height)
                Shot 'pca_unexpected_geometry'
              }
            }
            catch {
              L ("PCA: attempt {0} failed: {1}" -f
                $attempt, $_.Exception.Message)
              Shot 'pca_attempt_error'
            }

            if ($attempt -ge 2) {
              $script:pcaGaveUp[$key] = $true
              L 'PCA: still visible after two verified attempts; excluding warning without blocking installation'
              Shot 'pca_gave_up'
              return $false
            }

            L 'PCA: warning remains visible; one more attempt allowed'
            return $true
          }

          function Close-AnyPca {
            $count = 0

            foreach ($top in [Ui32]::Tops()) {
              if ($top.Visible -and
                  $top.Txt -eq 'Program Compatibility Assistant') {
                $win = [pscustomobject]@{
                  H = $top.Hwnd
                  Title = $top.Txt
                  Cls = $top.Cls
                  Proc = 'pca'
                }

                [void](Close-PcaWindow $win)
                if (-not (Test-Alive $top.Hwnd)) {
                  $count++
                }
              }
            }

            return $count
          }

          function Handle-Completion($win, $kids, $buttons, $pageText) {
            $key = $win.H.ToString()
            if (-not $script:finishTries.ContainsKey($key)) {
              $script:finishTries[$key] = 0
            }

            if ($pageText -match '(?i)restart|reboot') {
              $defer = $kids | Where-Object {
                $_.Visible -and $_.Enabled -and
                $_.Cls -match '(?i)button' -and
                (Clean-Name $_.Txt) -match
                  '^(no, i will restart.*|restart later|later|no)$'
              } | Select-Object -First 1

              if ($defer -and
                  [Ui32]::Check($defer.Hwnd) -ne 1) {
                L ("completion: selecting defer option '{0}'" -f
                  $defer.Txt)
                [Ui32]::Click($defer.Hwnd)
                Start-Sleep -Milliseconds 600
                return $true
              }
            }

            $optRx = '(?i)Show the Windows Installer log|check for program updates|Show the readme file|Launch the program'
            $unchecked = $false

            foreach ($control in $kids) {
              if ($control.Visible -and $control.Enabled -and
                  $control.Cls -match '(?i)button' -and
                  $control.Txt -match $optRx) {
                if ([Ui32]::Check($control.Hwnd) -eq 1) {
                  L ("completion: unchecking optional item '{0}'" -f
                    $control.Txt)
                  [Ui32]::Click($control.Hwnd)
                  Start-Sleep -Milliseconds 400
                  $unchecked = $true
                }
              }
            }
            if ($unchecked) { return $true }

            $finish = $buttons | Where-Object {
              $_.Visible -and $_.Enabled -and
              (Clean-Name $_.Txt) -eq 'finish'
            } | Select-Object -First 1
            if (-not $finish) { return $false }

            $script:finishTries[$key] =
              [int]$script:finishTries[$key] + 1
            $attempt = [int]$script:finishTries[$key]

            if ($attempt -gt 6) {
              $script:stopReason =
                'Finish did not close the completion page after six attempts.'
              return $true
            }

            L ("completion: clicking Finish (attempt {0})" -f $attempt)
            Shot 'before_finish'
            [Ui32]::Focus($win.H)
            Start-Sleep -Milliseconds 250
            [Ui32]::Click($finish.Hwnd)

            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Milliseconds 500
              if (-not (Test-Alive $win.H)) { break }
            }

            if (-not (Test-Alive $win.H)) {
              $script:finishConfirmed = $true
              L 'completion: Finish confirmed; wizard window closed'
              Shot 'after_finish'
            }
            else {
              L 'completion: window still visible 10s after Finish; will retry'
              Shot 'finish_still_visible'
            }

            return $true
          }

          function Invoke-Page($win) {
            $winH = $win.H

            if ($win.Title -match '(?i)Program Compatibility') {
              return (Close-PcaWindow $win)
            }

            [Ui32]::Focus($winH)
            Start-Sleep -Milliseconds 200
            $kids = @([Ui32]::Kids($winH))
            if ($kids.Count -eq 0) { return $false }

            $buttons = @($kids | Where-Object {
              $_.Cls -match '(?i)^button$'
            })
            $textList = @($kids | Where-Object {
              $_.Txt
            } | ForEach-Object {
              $_.Txt
            })
            $pageText = ($textList -join ' | ')
            $sig = (($kids | ForEach-Object {
              $_.Cls + ':' + $_.Txt + ':' + $_.Enabled
            }) -join ';')
            $fp = ('{0}|{1}' -f $winH, $sig)

            if (-not $seen.ContainsKey($fp)) {
              $seen[$fp] = 1
              L ("== window title='{0}' class='{1}' proc='{2}' children={3}" -f
                $win.Title, $win.Cls, $win.Proc, $kids.Count)
              L ("   texts: {0}" -f $pageText)
              L ("   buttons: {0}" -f (
                ($buttons | ForEach-Object {
                  '{0}[en={1}]' -f $_.Txt, $_.Enabled
                }) -join ' | '
              ))
              Shot ('page_' + $win.Title)
            }

            $isCustomer = @($kids | Where-Object {
              $_.Visible -and $_.Txt -eq 'Customer Information'
            }).Count -gt 0

            if ($win.Title -eq 'Scenarist BD' -and
                $win.Proc -eq 'msiexec' -and
                $isCustomer) {
              return (Invoke-CustomerPage $win $kids)
            }

            $hasAdvance = @($buttons | Where-Object {
              $_.Visible -and $_.Enabled -and
              ((Clean-Name $_.Txt) -match
                '^(next|install|finish|yes|ok)$')
            }).Count -gt 0

            $isCompletePage = $pageText -match '(?i)Installer Completed|successfully installed|has finished installing|Click Finish to exit|Setup has finished'
            if ($isCompletePage) {
              if (Handle-Completion $win $kids $buttons $pageText) {
                return $true
              }
            }

            $isProgress = $pageText -match '(?i)please wait|copying (new )?files|installing drivers|gathering permissions|updating component|publishing assembly|uninstalling|validating|removing|installing scenarist|the program features you selected are being'
            if ($isProgress -and -not $hasAdvance) {
              return $true
            }

            if ($pageText -match '(?i)restart|reboot') {
              $laterRadio = $buttons | Where-Object {
                $_.Enabled -and $_.Txt -match '(?i)later'
              } | Select-Object -First 1

              if ($laterRadio -and
                  [Ui32]::Check($laterRadio.Hwnd) -ne 1) {
                L ("   reboot page: selecting '{0}'" -f
                  $laterRadio.Txt)
                [Ui32]::Click($laterRadio.Hwnd)
                Start-Sleep -Milliseconds 600
              }

              $noBtn = $buttons | Where-Object {
                $_.Enabled -and $_.Txt -match '(?i)^&?No\b'
              } | Select-Object -First 1

              if ($noBtn) {
                L ("   reboot page: clicking '{0}'" -f $noBtn.Txt)
                [Ui32]::Click($noBtn.Hwnd)
                Start-Sleep 2
                return $true
              }
            }

            $isLicense = $pageText -match '(?i)license agreement|end user license|terms in the license'
            if ($isLicense) {
              $acc = $buttons | Where-Object {
                $_.Enabled -and
                $_.Txt -match $acceptRx -and
                $_.Txt -notmatch $denyRx
              } | Select-Object -First 1

              if (-not $acc) {
                $acc = $buttons | Where-Object {
                  $_.Enabled -and (Test-Radio $_)
                } | Sort-Object Top, Left |
                  Select-Object -First 1

                if ($acc) {
                  L '   license page: accept text not readable, using first radio by position'
                }
              }

              if ($acc) {
                $akey = 'accept|' + $fp
                if (-not $acceptTries.ContainsKey($akey)) {
                  $acceptTries[$akey] = 0
                }

                $state = [Ui32]::Check($acc.Hwnd)
                if ($state -ne 1 -and
                    $acceptTries[$akey] -lt 3) {
                  $acceptTries[$akey] =
                    $acceptTries[$akey] + 1

                  L ("   license page: accepting via '{0}' (state={1} try={2})" -f
                    $acc.Txt, $state, $acceptTries[$akey])

                  [Ui32]::Click($acc.Hwnd)
                  Start-Sleep -Milliseconds 700

                  if ([Ui32]::Check($acc.Hwnd) -ne 1) {
                    L '   BM_CLICK did not check the radio, trying a real mouse click'
                    [Ui32]::RealClick($acc.Hwnd)
                    Start-Sleep -Milliseconds 700
                  }

                  L ("   accept state now: {0}" -f
                    [Ui32]::Check($acc.Hwnd))
                  Shot 'license_accept'

                  $kids2 = @([Ui32]::Kids($winH))
                  $next2 = $kids2 | Where-Object {
                    $_.Cls -match '(?i)^button$' -and
                    $_.Enabled -and
                    $_.Txt -match '(?i)^&?Next'
                  } | Select-Object -First 1

                  if ($next2) {
                    L ("   license accepted, clicking '{0}' immediately" -f
                      $next2.Txt)
                    Shot 'before_next_after_accept'
                    [Ui32]::Click($next2.Hwnd)
                    Start-Sleep 2
                    Shot 'after_next_after_accept'
                  }
                  else {
                    L ('   no enabled Next yet; buttons now: ' +
                      (($kids2 | Where-Object {
                        $_.Cls -match '(?i)^button$'
                      } | ForEach-Object {
                        '{0}[en={1}]' -f $_.Txt, $_.Enabled
                      }) -join ' | '))
                  }

                  return $true
                }
              }
            }

            $nextBtn = $buttons | Where-Object {
              $_.Txt -match '(?i)^&?Next'
            } | Select-Object -First 1

            if ($nextBtn -and -not $nextBtn.Enabled) {
              if (-not $seen.ContainsKey('disabled|' + $fp)) {
                $seen['disabled|' + $fp] = 1
                L '   Next is disabled on an unrecognized page; no input sent'
                Shot 'unknown_page_next_disabled'
              }
              return $true
            }

            foreach ($rx in $normalOrder) {
              $b = $buttons | Where-Object {
                $_.Enabled -and
                $_.Txt -match $rx -and
                $_.Txt -notmatch $neverRx
              } | Select-Object -First 1

              if (-not $b) { continue }

              $ck = $fp + '|' + $b.Txt
              if ($clicked.ContainsKey($ck) -and
                  ((Get-Date) - $clicked[$ck]).TotalSeconds -lt 8) {
                continue
              }

              L ("   clicking '{0}' via BM_CLICK on '{1}'" -f
                $b.Txt, $win.Title)
              Shot ('click_' + $b.Txt)
              [Ui32]::Focus($winH)
              [Ui32]::Click($b.Hwnd)
              $clicked[$ck] = Get-Date
              Start-Sleep 2
              Shot ('after_' + $b.Txt)
              return $true
            }

            return $false
          }

          function Find-AppTarget {
            $found = New-Object System.Collections.ArrayList
            $wsh = New-Object -ComObject WScript.Shell

            $roots = @(
              "$env:PUBLIC\Desktop",
              "$env:ProgramData\Microsoft\Windows\Start Menu\Programs",
              "$env:APPDATA\Microsoft\Windows\Start Menu\Programs",
              "$env:USERPROFILE\Desktop"
            )
            foreach ($r in $roots) {
              if (-not (Test-Path -LiteralPath $r)) { continue }
              foreach ($lnk in @(
                Get-ChildItem -LiteralPath $r -Filter *.lnk `
                  -Recurse -File -ErrorAction SilentlyContinue |
                  Where-Object { $_.Name -match '(?i)scenarist' }
              )) {
                $sc = $wsh.CreateShortcut($lnk.FullName)
                if ($sc.TargetPath -and
                    (Test-Path -LiteralPath $sc.TargetPath)) {
                  [void]$found.Add([pscustomobject]@{
                    Source = 'shortcut:' + $lnk.Name
                    Path = $sc.TargetPath
                    Args = $sc.Arguments
                  })
                }
              }
            }

            $regRoots = @(
              'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
              'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
            )
            foreach ($app in @(
              Get-ItemProperty $regRoots -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.DisplayName -match '(?i)scenarist' -and
                  $_.InstallLocation
                }
            )) {
              if (Test-Path -LiteralPath $app.InstallLocation) {
                foreach ($exe in @(
                  Get-ChildItem -LiteralPath $app.InstallLocation `
                    -Filter *.exe -File -Recurse `
                    -ErrorAction SilentlyContinue
                )) {
                  [void]$found.Add([pscustomobject]@{
                    Source = 'uninstall:' + $app.DisplayName
                    Path = $exe.FullName
                    Args = ''
                  })
                }
              }
            }

            if ($found.Count -eq 0) {
              foreach ($exe in @(
                Get-ChildItem -LiteralPath `
                  'C:\Program Files', 'C:\Program Files (x86)' `
                  -Recurse -Filter *.exe -File `
                  -ErrorAction SilentlyContinue |
                  Where-Object {
                    $_.FullName -match '(?i)scenarist'
                  }
              )) {
                [void]$found.Add([pscustomobject]@{
                  Source = 'scan'
                  Path = $exe.FullName
                  Args = ''
                })
              }
            }

            [void][Runtime.InteropServices.Marshal]::ReleaseComObject($wsh)

            $seenPaths = @{}
            $uniq = New-Object System.Collections.ArrayList

            foreach ($f in $found) {
              $p = [string]$f.Path
              if ($p -notmatch '(?i)scenarist') { continue }
              if ($p -match '(?i)unins|setup|crash|update|helper|license|dotnet|isnetfx|vjredist') {
                continue
              }
              if (-not (Test-Path -LiteralPath $p)) { continue }
              if ($seenPaths.ContainsKey($p)) { continue }

              $seenPaths[$p] = $true
              [void]$uniq.Add($f)
            }

            return @($uniq | Sort-Object @{ Expression = {
              $n = [IO.Path]::GetFileName([string]$_.Path)
              if ($n -match '(?i)^Scenarist\s*BD\.exe$') { 0 }
              elseif ($n -match '(?i)^Scenarist\.exe$') { 1 }
              elseif ($n -match '(?i)^Scenarist') { 2 }
              else { 3 }
            } })
          }

          function Close-ActivationWindow($top, $kids) {
            if ($script:activationHandled) { return }
            $script:activationHandled = $true

            $closeBtn = $kids | Where-Object {
              $_.Visible -and $_.Enabled -and
              $_.Cls -match '(?i)button' -and
              (Clean-Name $_.Txt) -eq 'close'
            } | Select-Object -First 1

            if (-not $closeBtn) {
              L 'activation: no enabled Close button found; leaving the window open'
              return
            }

            L ("activation: clicking Close (hwnd={0})" -f
              $closeBtn.Hwnd)
            Shot 'activation_before_close'
            [Ui32]::Focus($top.Hwnd)
            Start-Sleep -Milliseconds 250
            [Ui32]::Click($closeBtn.Hwnd)

            $gone = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Milliseconds 500
              if (-not (Test-Alive $top.Hwnd)) {
                $gone = $true
                break
              }
            }

            if (-not $gone -and
                [Ui32]::CanHit($closeBtn.Hwnd)) {
              L 'activation: BM_CLICK did not close it; trying a real mouse click on Close'
              [Ui32]::Focus($top.Hwnd)
              Start-Sleep -Milliseconds 200
              [Ui32]::RealClick($closeBtn.Hwnd)

              for ($i = 0; $i -lt 10; $i++) {
                Start-Sleep -Milliseconds 500
                if (-not (Test-Alive $top.Hwnd)) {
                  $gone = $true
                  break
                }
              }
            }

            L ("activation: window closed={0}" -f $gone)
            Shot 'activation_after_close'

            Start-Sleep -Seconds 3
            $alive = @(
              Get-Process -Name 'ScenaristBD' `
                -ErrorAction SilentlyContinue
            )

            if ($alive.Count -eq 0) {
              L 'activation: ScenaristBD.exe exited after Close (no license installed; main UI is not reachable without a license)'
            }
            else {
              $titles = @($alive |
                ForEach-Object { $_.MainWindowTitle } |
                Where-Object { $_ })
              L ("activation: ScenaristBD.exe still running; main window title(s): {0}" -f
                ($titles -join ' | '))
            }

            Shot 'after_activation_close_state'
          }

          function Observe-App($app) {
            $seenWin = @{}
            $seenProc = ''
            $quietRounds = 0

            for ($i = 1; $i -le 40; $i++) {
              Start-Sleep -Seconds 3

              $procs = @(Get-Process -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.ProcessName -match '(?i)scenarist|hasp|sentinel'
                } |
                ForEach-Object {
                  '{0}({1})' -f $_.ProcessName, $_.Id
                })

              $procSig = $procs -join ','
              if ($procSig -ne $seenProc) {
                L ("app phase: relevant processes = [{0}]" -f $procSig)
                $seenProc = $procSig
              }

              if ($app.HasExited -and
                  -not $script:appExitLogged) {
                $script:appExitLogged = $true
                L ("app phase: launcher process exited, code={0}" -f
                  $app.ExitCode)
              }

              $newWins = 0

              foreach ($top in [Ui32]::Tops()) {
                if (-not $top.Visible -or
                    [string]::IsNullOrWhiteSpace($top.Txt)) {
                  continue
                }
                if ($top.Txt -match 'Program Compatibility') {
                  continue
                }
                if ($top.Txt -match 'ProgramData\\GitHub|hosted-compute|Runner\.Listener') {
                  continue
                }

                $processName = 'unknown'
                try {
                  $processName = (
                    Get-Process -Id ([Ui32]::ProcId($top.Hwnd)) `
                      -ErrorAction Stop
                  ).ProcessName
                }
                catch {}

                $isAppRelated =
                  ($processName -match '(?i)scenarist|hasp|sentinel') -or
                  ($top.Txt -match '(?i)Scenarist|HASP|Sentinel|licen|error|warning|evaluat|dongle|activat|trial')

                if (-not $isAppRelated) { continue }

                $kids = @([Ui32]::Kids($top.Hwnd))
                $texts = ($kids | Where-Object { $_.Txt } |
                  ForEach-Object { $_.Txt }) -join ' | '
                $buttons = ($kids |
                  Where-Object { $_.Cls -match '(?i)button' } |
                  ForEach-Object {
                    '{0}[en={1}]' -f $_.Txt, $_.Enabled
                  }) -join ' | '

                $signature = '{0}|{1}|{2}' -f
                  $top.Hwnd, $top.Txt, $texts

                if (-not $seenWin.ContainsKey($signature)) {
                  $seenWin[$signature] = $true
                  $newWins++
                  L ("app window: title='{0}' class='{1}' proc='{2}'" -f
                    $top.Txt, $top.Cls, $processName)
                  L ("   texts: {0}" -f $texts)
                  L ("   buttons: {0}" -f $buttons)
                  L ("   uia: {0}" -f
                    (Dump-Uia $top.Hwnd 80))
                  Shot ('app_window_' + $top.Txt)
                }

                if ($processName -match '(?i)^scenaristbd$' -and
                    $top.Txt -match '(?i)^Scenarist Activation$' -and
                    -not $script:activationHandled) {
                  Close-ActivationWindow $top $kids
                  $newWins++
                }
              }

              if ($script:activationHandled) {
                $pcaClosedNow = Close-AnyPca
                if ($pcaClosedNow -gt 0) {
                  L ("app phase: closed {0} PCA window(s)" -f
                    $pcaClosedNow)
                }
              }

              Shot ('app_obs_{0:D2}' -f $i)

              if ($app.HasExited -and $newWins -eq 0) {
                $quietRounds++
              }
              else {
                $quietRounds = 0
              }

              if ($quietRounds -ge 5) {
                L 'app phase: launcher exited and no new windows; stopping observation'
                break
              }
            }
          }

          function Save-Evidence {
            $f = "$env:OUT\logs\environment-evidence.txt"
            $lines = New-Object System.Collections.ArrayList
            [void]$lines.Add('Collected: ' + (Get-Date -Format o))

            [void]$lines.Add(
              '=== Device Guard / Memory integrity (Win32_DeviceGuard) ==='
            )
            try {
              $dg = Get-CimInstance `
                -Namespace 'root\Microsoft\Windows\DeviceGuard' `
                -ClassName Win32_DeviceGuard -ErrorAction Stop

              [void]$lines.Add(
                ('VirtualizationBasedSecurityStatus: {0}  (0=off 1=enabled 2=running)' -f
                  $dg.VirtualizationBasedSecurityStatus)
              )
              [void]$lines.Add(
                ('SecurityServicesConfigured: {0}' -f
                  (@($dg.SecurityServicesConfigured) -join ','))
              )
              [void]$lines.Add(
                ('SecurityServicesRunning: {0}  (2 = HVCI / Memory integrity running)' -f
                  (@($dg.SecurityServicesRunning) -join ','))
              )
              [void]$lines.Add(
                ('CodeIntegrityPolicyEnforcementStatus: {0}' -f
                  $dg.CodeIntegrityPolicyEnforcementStatus)
              )
            }
            catch {
              [void]$lines.Add(
                'Win32_DeviceGuard unavailable: ' +
                $_.Exception.Message
              )
            }

            try {
              $hv = Get-ItemProperty `
                'HKLM:\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\HypervisorEnforcedCodeIntegrity' `
                -ErrorAction Stop
              [void]$lines.Add(
                ('HVCI registry Enabled: {0}' -f $hv.Enabled)
              )
            }
            catch {
              [void]$lines.Add('HVCI registry key not present')
            }

            [void]$lines.Add('=== Boot configuration (test signing) ===')
            try {
              $bcd = (& bcdedit.exe /enum '{current}' 2>&1) |
                Out-String

              foreach ($line in ($bcd -split "`r?`n")) {
                if ($line -match '(?i)testsigning|nointegritychecks|hypervisorlaunchtype') {
                  [void]$lines.Add($line.Trim())
                }
              }
            }
            catch {
              [void]$lines.Add(
                'bcdedit unavailable: ' + $_.Exception.Message
              )
            }

            [void]$lines.Add(
              '=== Driver services matching HASP / Sentinel / Aladdin ==='
            )
            try {
              $drivers = @(Get-CimInstance Win32_SystemDriver `
                -ErrorAction Stop |
                Where-Object {
                  $_.Name -match '(?i)^aks|hasp|hardlock|sentinel' -or
                  $_.DisplayName -match '(?i)hasp|hardlock|sentinel|safenet|aladdin' -or
                  $_.PathName -match '(?i)hasp|hardlock|sentinel|aksdf|aksfridge|akshasp'
                })

              if ($drivers.Count -eq 0) {
                [void]$lines.Add('(none registered)')
              }

              foreach ($driver in $drivers) {
                [void]$lines.Add(
                  ('{0} | {1} | State={2} | Start={3} | {4}' -f
                    $driver.Name, $driver.DisplayName,
                    $driver.State, $driver.StartMode,
                    $driver.PathName)
                )
              }
            }
            catch {
              [void]$lines.Add(
                'driver query failed: ' + $_.Exception.Message
              )
            }

            [void]$lines.Add('=== Driver files in System32\drivers ===')
            foreach ($pattern in @(
              'aks*.sys', 'hardlock*.sys', 'hasp*.sys',
              'sntnl*.sys', 'sentinel*.sys'
            )) {
              foreach ($file in @(
                Get-ChildItem "$env:windir\System32\drivers" `
                  -Filter $pattern -File `
                  -ErrorAction SilentlyContinue
              )) {
                [void]$lines.Add(
                  ('{0}  {1} bytes  {2}' -f
                    $file.Name, $file.Length,
                    $file.VersionInfo.FileVersion)
                )
              }
            }

            [void]$lines.Add(
              '=== Installed programs matching Sentinel / HASP / Scenarist ==='
            )
            foreach ($app in @(
              Get-ItemProperty `
                'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
                'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' `
                -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.DisplayName -match
                    '(?i)sentinel|hasp|safenet|aladdin|scenarist'
                }
            )) {
              [void]$lines.Add(
                ('{0} | {1} | {2}' -f
                  $app.DisplayName, $app.DisplayVersion,
                  $app.Publisher)
              )
            }

            [void]$lines.Add('=== PCA-related processes ===')
            foreach ($process in @(
              Get-Process -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.ProcessName -match '(?i)^pca'
                }
            )) {
              [void]$lines.Add(
                ('{0}({1}) {2}' -f
                  $process.ProcessName, $process.Id,
                  $process.Path)
              )
            }

            [void]$lines.Add('=== Events since job start ===')
            $channels = @(
              'Microsoft-Windows-Application-Experience/Program-Compatibility-Assistant',
              'Microsoft-Windows-Application-Experience/Program-Telemetry',
              'Microsoft-Windows-CodeIntegrity/Operational',
              'System',
              'Application'
            )

            foreach ($channel in $channels) {
              [void]$lines.Add('--- ' + $channel + ' ---')
              try {
                $events = @(Get-WinEvent -FilterHashtable @{
                  LogName = $channel
                  StartTime = $script:runStart
                } -MaxEvents 80 -ErrorAction Stop)

                $selected = @($events | Where-Object {
                  $channel -notmatch '^(System|Application)$' -or
                  $_.Message -match
                    '(?i)scenarist|hasp|sentinel|safenet|aladdin|hardlock|aks|compatib|driver'
                } | Select-Object -First 40)

                if ($selected.Count -eq 0) {
                  [void]$lines.Add('(no matching events)')
                }

                foreach ($event in $selected) {
                  $message = ([string]$event.Message) -replace '\s+', ' '
                  if ($message.Length -gt 400) {
                    $message = $message.Substring(0, 400) + '...'
                  }
                  [void]$lines.Add(
                    ('{0} | Id={1} | {2} | {3} | {4}' -f
                      $event.TimeCreated, $event.Id,
                      $event.ProviderName,
                      $event.LevelDisplayName, $message)
                  )
                }
              }
              catch {
                [void]$lines.Add(
                  'channel unavailable: ' + $_.Exception.Message
                )
              }
            }

            $lines | Out-File -LiteralPath $f -Encoding utf8
            L ("evidence saved: {0}" -f $f)
          }

          try {
            Shot 'desktop_before_setup'
            $setup = Start-Process -FilePath $env:SETUP_EXE `
              -WorkingDirectory $env:PKG_DIR -PassThru
            L ("setup.exe started pid={0}  timeout={1} minutes" -f
              $setup.Id, $env:SETUP_TIMEOUT_MIN)

            $deadline = (Get-Date).AddMinutes(
              [int]$env:SETUP_TIMEOUT_MIN
            )
            $idle = 0
            $quiet = 0
            $wizardDone = $false

            while ((Get-Date) -lt $deadline) {
              $wins = @(Get-WizardWindows)

              if ($wins.Count -eq 0) {
                $busy = @(Get-Process -ErrorAction SilentlyContinue |
                  Where-Object {
                    $_.ProcessName -match
                      '^(setup|setup64|ISBEW64|IDriver|IDriver2)$' -or
                    ($_.ProcessName -eq 'msiexec' -and
                     $_.MainWindowHandle -ne 0)
                  })

                if ($setup.HasExited -and
                    $busy.Count -eq 0) {
                  $quiet++
                  if ($quiet -ge 8) {
                    L 'no installer window and no installer process, wizard phase finished'
                    $wizardDone = $true
                    break
                  }
                }
                else {
                  $quiet = 0
                }

                Start-Sleep 1
                continue
              }

              $quiet = 0
              $acted = $false

              foreach ($win in $wins) {
                try {
                  if (Invoke-Page $win) {
                    $acted = $true
                    $idle = 0
                    break
                  }
                }
                catch {
                  L ('page handling error: ' +
                    $_.Exception.Message)
                }
              }

              if ($script:stopReason) {
                L ("automation stopped: {0}" -f
                  $script:stopReason)
                Shot 'automation_blocked'
                break
              }

              if (-not $acted) {
                $idle++
                if ($idle -eq 4 -or $idle % 10 -eq 0) {
                  L ("idle {0}: no recognized action; no blind keys sent" -f
                    $idle)
                  Shot ('idle_' + $idle)
                }
                if ($idle -ge 30) {
                  $script:stopReason =
                    'No recognized action on the current installer page.'
                  Shot 'unknown_page_blocked'
                  break
                }
              }

              Start-Sleep 1
            }

            if ((-not $wizardDone) -and
                ((Get-Date) -ge $deadline)) {
              L '!! timeout: installation has not finished; inspect the last screenshots and logs'
              Shot 'setup_timeout'
            }

            Shot 'after_setup'

            if ($setup.HasExited) {
              L ("setup.exe exit code: {0}" -f $setup.ExitCode)
            }
            else {
              L 'setup.exe is still running at the end of the wizard phase'
            }
            if ($script:finishConfirmed) {
              L 'wizard: Finish confirmed'
            }

            Get-ItemProperty `
              'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
              'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' `
              -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName } |
              Sort-Object DisplayName |
              Select-Object DisplayName, DisplayVersion, InstallLocation |
              Format-Table -AutoSize |
              Out-String -Width 300 |
              Out-File "$env:OUT\logs\installed-programs.txt"

            if (-not $script:stopReason) {
              $targets = @(Find-AppTarget)

              if ($targets.Count -eq 0) {
                L 'app: no Scenarist executable found after installation'
                Shot 'no_main_exe'
              }
              else {
                foreach ($candidate in $targets) {
                  L ("app candidate: {0}  [{1}]" -f
                    $candidate.Path, $candidate.Source)
                }

                $target = $targets[0]
                L ("launching: {0}" -f $target.Path)

                $startArgs = @{
                  FilePath = $target.Path
                  WorkingDirectory =
                    (Split-Path -Parent $target.Path)
                  PassThru = $true
                }
                if ($target.Args) {
                  $startArgs['ArgumentList'] = $target.Args
                }

                $app = Start-Process @startArgs
                Observe-App $app
              }
            }

            # Give any remaining PCA warning one final bounded chance.
            $script:pcaTries = @{}
            $script:pcaGaveUp = @{}

            for ($k = 0; $k -lt 2; $k++) {
              $remaining = @([Ui32]::Tops() |
                Where-Object {
                  $_.Visible -and
                  $_.Txt -eq 'Program Compatibility Assistant'
                })

              if ($remaining.Count -eq 0) { break }

              [void](Close-AnyPca)
              Start-Sleep -Seconds 2
            }

            $stillPca = @([Ui32]::Tops() |
              Where-Object {
                $_.Visible -and
                $_.Txt -eq 'Program Compatibility Assistant'
              }).Count

            L ("final: PCA windows still visible = {0}" -f
              $stillPca)
            Shot 'final_desktop'
          }
          catch {
            L ('stage stopped: ' + $_.Exception.Message)
            try { Shot 'stage_failure' } catch {}
          }
          finally {
            try {
              Save-Evidence
            }
            catch {
              L ('evidence failed: ' +
                $_.Exception.Message)
            }

            New-Item "$shots\STOP" -ItemType File -Force |
              Out-Null
            Wait-Job $job -Timeout 10 | Out-Null
            Stop-Job $job -ErrorAction SilentlyContinue
            Remove-Job $job -Force -ErrorAction SilentlyContinue
            L "total screenshots: $((Get-ChildItem $shots -File).Count)"
          }

          if ($script:stopReason) {
            throw $script:stopReason
          }

      # ------------------------------------------------------------------
      - name: 5. Upload screenshots and logs regardless of result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scenarist-bd-screenshots-${{ github.run_number }}
          path: out
          if-no-files-found: warn
          retention-days: 14
