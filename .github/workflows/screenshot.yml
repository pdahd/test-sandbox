name: Scenarist BD UI screenshots

on:
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      SCENARIST_URL: ${{ secrets.SCENARIST_URL }}
      OUT: ${{ github.workspace }}\out
    defaults:
      run:
        shell: powershell   # 用 Windows PowerShell 5.1，UIAutomation 更稳定

    steps:
      - name: 准备桌面（最小化 runner 窗口，不关闭）
        run: |
          New-Item -ItemType Directory -Force "$env:OUT\shots","$env:OUT\logs" | Out-Null
          Add-Type @"
          using System; using System.Text; using System.Runtime.InteropServices;
          public static class W {
            public delegate bool P(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] public static extern bool EnumWindows(P p, IntPtr l);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int c);
          }
          "@
          $cb = [W+P]{ param($h,$l)
            if ([W]::IsWindowVisible($h)) {
              $sb = New-Object Text.StringBuilder 512; [void][W]::GetWindowText($h,$sb,512)
              $t = $sb.ToString()
              if ($t -match 'GitHub|hosted-compute|Runner|ProgramData') {
                Write-Host "最小化: $t"; [void][W]::ShowWindow($h,6)
              }
            }
            $true }
          [void][W]::EnumWindows($cb,[IntPtr]::Zero)
          Get-Process ServerManager -ErrorAction SilentlyContinue | Stop-Process -Force
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop; "分辨率 1920x1080" }
          catch { "分辨率调整失败，继续: $($_.Exception.Message)" }

      - name: 下载并解压
        run: |
          if (-not $env:SCENARIST_URL) { throw "请先设置 Secret SCENARIST_URL" }
          $f = "$env:RUNNER_TEMP\pkg.bin"
          curl.exe -L --fail --retry 5 -o $f "$env:SCENARIST_URL"
          if ($LASTEXITCODE) { throw "下载失败（链接可能过期）" }
          $b = [IO.File]::ReadAllBytes($f)[0..3] | % { $_.ToString('X2') }
          "大小 $((Get-Item $f).Length) 字节, 文件头 $($b -join ' ')"
          & "C:\Program Files\7-Zip\7z.exe" x $f "-o$env:RUNNER_TEMP\pkg" -y | Out-Null
          if ($LASTEXITCODE) { throw "解压失败，下载内容可能是网页而不是压缩包" }
          $s = Get-ChildItem "$env:RUNNER_TEMP\pkg" -Recurse -Filter setup.exe | Select -First 1
          if (-not $s) { throw "未找到 setup.exe" }
          "SETUP=$($s.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "PKGDIR=$($s.DirectoryName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: 检查并补齐依赖
        run: |
          $log = "$env:OUT\logs\deps.txt"
          function L($m){ $m | Tee-Object -FilePath $log -Append }
          # .NET 2.0/3.5
          $fx = Get-WindowsOptionalFeature -Online -FeatureName NetFx3
          L "NetFx3: $($fx.State)"
          if ($fx.State -ne 'Enabled') {
            dism.exe /Online /Enable-Feature /FeatureName:NetFx3 /All /NoRestart | Out-Null
            L "启用 NetFx3 退出码: $LASTEXITCODE"
          }
          # .NET 4.x
          L ".NET4 Release: $((Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\Full').Release)"
          # JRE 1.5（32 位）
          $jre = Get-ChildItem "$env:PKGDIR\ISSetupPrerequisites" -Recurse -Filter "jre-*.exe" | Select -First 1
          if (-not (Test-Path 'HKLM:\SOFTWARE\WOW6432Node\JavaSoft\Java Runtime Environment\1.5') -and $jre) {
            $p = Start-Process $jre.FullName -ArgumentList '/s','/v"/qn REBOOT=Suppress"' -Wait -PassThru
            L "JRE 1.5 安装退出码: $($p.ExitCode)"
          } else { L "JRE 1.5: 已存在或安装包缺失" }
          # Visual J# 2.0
          $vj = Get-ChildItem "$env:PKGDIR\ISSetupPrerequisites" -Recurse -Filter "vjredist.exe" | Select -First 1
          if (-not (Test-Path 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Visual JSharp Setup\Configuration\JSharp Redist\v2.0') -and $vj) {
            $p = Start-Process $vj.FullName -ArgumentList '/q:a','/c:"install.exe /q"' -Wait -PassThru
            L "J# 2.0 安装退出码: $($p.ExitCode)"
          } else { L "J# 2.0: 已存在或安装包缺失" }
          # VC++ 运行库
          foreach ($a in 'x86','x64') {
            $e = "$env:RUNNER_TEMP\vc_$a.exe"
            curl.exe -sL -o $e "https://aka.ms/vs/17/release/vc_redist.$a.exe"
            $p = Start-Process $e -ArgumentList '/install','/quiet','/norestart' -Wait -PassThru
            L "VC++ $a 退出码: $($p.ExitCode)"
          }

      - name: 运行 setup.exe，自动交互并截图，然后启动主程序
        timeout-minutes: 50
        run: |
          Add-Type -AssemblyName UIAutomationClient,UIAutomationTypes,System.Windows.Forms,System.Drawing
          $shots = "$env:OUT\shots"; $log = "$env:OUT\logs\setup.txt"
          function L($m){ "[$(Get-Date -f HH:mm:ss)] $m" | Tee-Object -FilePath $log -Append }
          function Shot($name){
            try {
              $r = [Windows.Forms.SystemInformation]::VirtualScreen
              $bmp = New-Object Drawing.Bitmap $r.Width,$r.Height
              $g = [Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($r.Left,$r.Top,0,0,$bmp.Size)
              $n = ($name -replace '[^\w-]','_'); if ($n.Length -gt 60) { $n = $n.Substring(0,60) }
              $bmp.Save("$shots\KEY-$(Get-Date -f HHmmss_fff)-$n.png")
              $g.Dispose(); $bmp.Dispose()
            } catch { L "截图失败: $_" }
          }

          # 后台定时截图
          $loop = Start-Job -ArgumentList $shots -ScriptBlock {
            param($d)
            Add-Type -AssemblyName System.Windows.Forms,System.Drawing
            $i = 0
            while (-not (Test-Path "$d\STOP")) {
              try {
                $r = [Windows.Forms.SystemInformation]::VirtualScreen
                $b = New-Object Drawing.Bitmap $r.Width,$r.Height
                $g = [Drawing.Graphics]::FromImage($b)
                $g.CopyFromScreen($r.Left,$r.Top,0,0,$b.Size)
                $b.Save(("$d\frame-{0:D4}.jpg" -f (++$i)), [Drawing.Imaging.ImageFormat]::Jpeg)
                $g.Dispose(); $b.Dispose()
              } catch {}
              Start-Sleep -Milliseconds 1500
            }
          }

          $UIA = [Windows.Automation.AutomationElement]
          $TS  = [Windows.Automation.TreeScope]
          $CT  = [Windows.Automation.ControlType]
          function Find($root,$type){
            $c = New-Object Windows.Automation.PropertyCondition($UIA::ControlTypeProperty,$type)
            @($root.FindAll($TS::Descendants,$c))
          }
          function PageText($w){ ((Find $w $CT::Text | % { $_.Current.Name }) -join ' | ') }

          $procRx = '^(setup|msiexec|ISBEW64|IsUninst|jre.*|vjredist|install|dotnetfx.*|isnetfx|dpinst.*|hasp.*|Sentinel.*|Scenarist.*)$'
          $titleRx = 'Scenarist|InstallShield|Java|J#|\.NET|Sentinel|Setup|Install'
          $acceptRx = '(?i)I accept|accept the terms|I agree|^Yes, I'
          $btnOrder = '(?i)^&?Next','(?i)^&?Install','(?i)^&?Finish','(?i)^&?Yes$','(?i)^OK$','(?i)^&?Continue','(?i)^&?Accept'
          $clicked = @{}; $seen = @{}

          Shot "00-desktop-before-setup"
          $setup = Start-Process $env:SETUP -WorkingDirectory $env:PKGDIR -PassThru
          L "已启动 setup.exe PID=$($setup.Id)"
          $deadline = (Get-Date).AddMinutes(40); $idle = 0

          while ((Get-Date) -lt $deadline) {
            $wins = @($UIA::RootElement.FindAll($TS::Children, [Windows.Automation.Condition]::TrueCondition) | ? {
              $p = Get-Process -Id $_.Current.ProcessId -ErrorAction SilentlyContinue
              $p -and ($p.ProcessName -match $procRx -or ($_.Current.Name -match $titleRx -and $p.ProcessName -notmatch 'explorer|WindowsTerminal|conhost|powershell'))
            })

            if ($wins.Count -eq 0 -and $setup.HasExited -and -not (Get-Process msiexec,ISBEW64 -ErrorAction SilentlyContinue | ? { $_.MainWindowHandle -ne 0 })) {
              if (++$idle -ge 15) { L "安装窗口已全部消失"; break }
            } else { $idle = 0 }

            foreach ($w in $wins) {
              try {
                $txt = PageText $w
                $key = "$($w.Current.NativeWindowHandle)|$txt"
                if (-not $seen[$key]) {
                  $seen[$key] = 1
                  L "新页面 [$($w.Current.Name)]: $txt"
                  L ("  按钮: " + ((Find $w $CT::Button | % { $_.Current.Name }) -join ', '))
                  Shot "page-$($w.Current.Name)"
                }

                # 1) 勾选同意许可
                foreach ($r in (Find $w $CT::RadioButton | ? { $_.Current.Name -match $acceptRx -and $_.Current.IsEnabled })) {
                  $sp = $r.GetCurrentPattern([Windows.Automation.SelectionItemPattern]::Pattern)
                  if (-not $sp.Current.IsSelected) { $sp.Select(); L "选择: $($r.Current.Name)"; Start-Sleep 1 }
                }
                foreach ($c in (Find $w $CT::CheckBox | ? { $_.Current.Name -match $acceptRx -and $_.Current.IsEnabled })) {
                  $tp = $c.GetCurrentPattern([Windows.Automation.TogglePattern]::Pattern)
                  if ($tp.Current.ToggleState -ne 'On') { $tp.Toggle(); L "勾选: $($c.Current.Name)"; Start-Sleep 1 }
                }

                $buttons = Find $w $CT::Button | ? { $_.Current.IsEnabled }

                # 2) 重启提示：只选稍后，绝不重启
                if ($txt -match '(?i)restart|reboot') {
                  foreach ($r in (Find $w $CT::RadioButton | ? { $_.Current.Name -match '(?i)later|No,' })) {
                    $r.GetCurrentPattern([Windows.Automation.SelectionItemPattern]::Pattern).Select(); L "选择稍后重启"
                  }
                  $no = $buttons | ? { $_.Current.Name -match '(?i)^&?No$' } | Select -First 1
                  if ($no) { Shot "before-No"; $no.GetCurrentPattern([Windows.Automation.InvokePattern]::Pattern).Invoke(); L "点击 No（不重启）"; Start-Sleep 2; continue }
                }

                # 3) 按优先级点击推进按钮（从不点 Cancel/Back）
                foreach ($rx in $btnOrder) {
                  $b = $buttons | ? { $_.Current.Name -match $rx -and $_.Current.Name -notmatch '(?i)cancel|back' } | Select -First 1
                  if (-not $b) { continue }
                  $ck = "$key|$($b.Current.Name)"
                  if ($clicked[$ck] -and ((Get-Date) - $clicked[$ck]).TotalSeconds -lt 12) { break }
                  Shot "before-$($b.Current.Name)"
                  $b.GetCurrentPattern([Windows.Automation.InvokePattern]::Pattern).Invoke()
                  $clicked[$ck] = Get-Date
                  L "点击 [$($b.Current.Name)] @ [$($w.Current.Name)]"
                  Start-Sleep 2; Shot "after-$($b.Current.Name)"
                  break
                }
              } catch { L "窗口处理异常: $($_.Exception.Message)" }
            }
            Start-Sleep -Milliseconds 1000
          }
          Shot "setup-end"

          # 启动主程序
          $exe = Get-ChildItem "C:\Program Files","C:\Program Files (x86)" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue |
                 ? { $_.Name -match '(?i)scenarist' -and $_.Name -notmatch '(?i)unins|setup|crash' } |
                 Sort-Object { if ($_.Name -match '(?i)^Scenarist\s*BD') {0} else {1} } | Select -First 1
          if ($exe) {
            L "启动主程序: $($exe.FullName)"
            Start-Process $exe.FullName -WorkingDirectory $exe.DirectoryName
            1..40 | % { Start-Sleep 3; Shot "main-$_" }
            Get-Process | ? { $_.MainWindowTitle } | % { L "窗口: [$($_.ProcessName)] $($_.MainWindowTitle)" }
          } else { L "未找到 Scenarist 主程序，安装可能失败"; Shot "no-main-exe" }

          New-Item "$shots\STOP" -ItemType File | Out-Null
          Wait-Job $loop -Timeout 10 | Out-Null; Remove-Job $loop -Force
          Remove-Item "$shots\STOP"

      - name: 上传截图和日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scenarist-screens-${{ github.run_number }}
          path: out/
          retention-days: 14
