name: Scenarist BD - install & screenshot

on:
  workflow_dispatch:
    inputs:
      setup_timeout_min:
        description: "Maximum wait time for setup wizard auto-interaction (minutes)"
        default: "35"

env:
  PKG_URL: "https://1008.filemail.com/api/file/get?filekey=qZ8PSCAMNDT_UbcUmAm998Sbdsf_rsbG0d_8ihincKT-36w0PEM-2ToKW8eACEmyrA"
  OUT: ${{ github.workspace }}\out

jobs:
  capture:
    runs-on: windows-2025
    timeout-minutes: 110
    defaults:
      run:
        shell: powershell      # Windows PowerShell 5.1; UIAutomation is more stable here

    steps:
      # ------------------------------------------------------------------
      - name: 1. Desktop check, minimize runner console, and try higher resolution
        run: |
          New-Item -ItemType Directory -Force "$env:OUT\shots","$env:OUT\logs" | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type @"
          using System; using System.Text; using System.Runtime.InteropServices;
          public static class U32 {
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc p, IntPtr l);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int cmd);
            [DllImport("user32.dll")] public static extern bool SetProcessDPIAware();
            [StructLayout(LayoutKind.Sequential, CharSet=CharSet.Ansi)]
            public struct DEVMODE {
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst=32)] public string dmDeviceName;
              public short dmSpecVersion, dmDriverVersion, dmSize, dmDriverExtra; public int dmFields;
              public int dmPositionX, dmPositionY, dmDisplayOrientation, dmDisplayFixedOutput;
              public short dmColor, dmDuplex, dmYResolution, dmTTOption, dmCollate;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst=32)] public string dmFormName;
              public short dmLogPixels; public int dmBitsPerPel, dmPelsWidth, dmPelsHeight, dmDisplayFlags, dmDisplayFrequency;
              public int dmICMMethod, dmICMIntent, dmMediaType, dmDitherType, dmReserved1, dmReserved2, dmPanningWidth, dmPanningHeight; }
            [DllImport("user32.dll")] public static extern int EnumDisplaySettings(string n, int mode, ref DEVMODE dm);
            [DllImport("user32.dll")] public static extern int ChangeDisplaySettings(ref DEVMODE dm, int flags);
          }
          "@
          [void][U32]::SetProcessDPIAware()
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "OS: $($os.Caption) | $($os.Version) | $($os.OSArchitecture)"
          Write-Host "Session: $((Get-Process -Id $PID).SessionId)  UserInteractive: $([Environment]::UserInteractive)  Explorer: $([bool](Get-Process explorer -EA SilentlyContinue))"

          # Minimize the hosted-compute-agent console. Do not close it.
          $cb = [U32+EnumProc]{ param($h, $l)
            if ([U32]::IsWindowVisible($h)) {
              $sb = New-Object System.Text.StringBuilder 1024
              [void][U32]::GetWindowText($h, $sb, 1024); $t = $sb.ToString()
              if ($t -and $t -match 'ProgramData\\GitHub|hosted-compute|Runner\.Listener') {
                Write-Host "minimize: $t"; [void][U32]::ShowWindow($h, 6) } }
            $true }
          [void][U32]::EnumWindows($cb, [IntPtr]::Zero)
          Get-Process ServerManager -EA SilentlyContinue | Stop-Process -Force -EA SilentlyContinue

          # Try to raise the resolution. The Hyper-V virtual GPU may reject it.
          $dm = New-Object U32+DEVMODE; $dm.dmSize = [Runtime.InteropServices.Marshal]::SizeOf($dm)
          [void][U32]::EnumDisplaySettings($null, -1, [ref]$dm)
          foreach ($res in @(@(1920,1080), @(1600,1200), @(1280,1024))) {
            $dm.dmPelsWidth = $res[0]; $dm.dmPelsHeight = $res[1]; $dm.dmFields = 0x80000 -bor 0x100000
            $rc = [U32]::ChangeDisplaySettings([ref]$dm, 0)
            if ($rc -eq 0) { Write-Host "resolution -> $($res[0])x$($res[1])"; break } else { Write-Host "resolution $($res[0])x$($res[1]) rejected ($rc)" } }
          $scr = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Write-Host "Screen now: $($scr.Width)x$($scr.Height)"

          # Baseline screenshot. Failure here means there is no interactive desktop.
          $b = New-Object System.Drawing.Bitmap $scr.Width, $scr.Height
          $g = [System.Drawing.Graphics]::FromImage($b); $g.CopyFromScreen(0,0,0,0,$b.Size)
          $b.Save("$env:OUT\shots\K_000000_baseline_desktop.png"); $g.Dispose(); $b.Dispose()

      # ------------------------------------------------------------------
      - name: 2. Download and extract installation package
        run: |
          $f = "$env:RUNNER_TEMP\pkg.bin"
          curl.exe -L --fail --retry 3 --retry-delay 5 -A "Mozilla/5.0" -o $f "$env:PKG_URL"
          if ($LASTEXITCODE -ne 0) { throw "download failed (curl exit $LASTEXITCODE); Filemail link may have expired" }
          $fi = Get-Item $f
          $fs = [IO.File]::OpenRead($f); $hb = New-Object byte[] 8; [void]$fs.Read($hb,0,8); $fs.Close()
          Write-Host "size=$($fi.Length)  magic=$(($hb | % { $_.ToString('X2') }) -join ' ')"
          if ($fi.Length -lt 1MB) { Get-Content $f -TotalCount 20; throw "file is too small; probably an HTML error page, not an archive" }
          & "C:\Program Files\7-Zip\7z.exe" x $f "-o$env:RUNNER_TEMP\pkg" -y | Select-Object -Last 4
          if ($LASTEXITCODE -ne 0) { throw "7-Zip extraction failed (exit $LASTEXITCODE)" }
          Get-ChildItem "$env:RUNNER_TEMP\pkg" -Recurse | % { "{0,12}  {1}" -f $_.Length, $_.FullName } | Tee-Object "$env:OUT\logs\package-tree.txt"
          $setup = Get-ChildItem "$env:RUNNER_TEMP\pkg" -Recurse -Filter setup.exe | Select-Object -First 1
          if (-not $setup) { throw "setup.exe was not found" }
          "SETUP_EXE=$($setup.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "PKG_DIR=$($setup.DirectoryName)"  | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "setup.exe => $($setup.FullName)"

      # ------------------------------------------------------------------
      - name: 3. Query system dependencies and install missing components
        timeout-minutes: 30
        run: |
          $log = "$env:OUT\logs\dependencies.txt"
          function L($m){ $s = "[$(Get-Date -f HH:mm:ss)] $m"; Write-Host $s; Add-Content $log $s }
          function Installed($rx){ Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -EA SilentlyContinue | ? { $_.DisplayName -match $rx } | % DisplayName }
          function Run($exe,$a,$label){
            if (-not $exe -or -not (Test-Path $exe)) { L "$label : installer does not exist, skip"; return }
            try { $p = Start-Process -FilePath $exe -ArgumentList $a -Wait -PassThru; L "$label : exit $($p.ExitCode)  (0=success 3010=reboot required 1638/5100=already installed or unsupported)" }
            catch { L "$label : exception $($_.Exception.Message)" } }

          L "=== Windows Installer service ==="
          Start-Service msiserver -EA SilentlyContinue; L "msiserver: $((Get-Service msiserver).Status)"

          L "=== .NET Framework 2.0 / 3.5 (NetFx3) ==="
          $fx = Get-WindowsOptionalFeature -Online -FeatureName NetFx3
          L "NetFx3 current: $($fx.State)"
          if ($fx.State -ne 'Enabled') {
            try { $r = Enable-WindowsOptionalFeature -Online -FeatureName NetFx3 -All -NoRestart -EA Stop; L "Enable-WindowsOptionalFeature completed, RestartNeeded=$($r.RestartNeeded)" }
            catch { L "Enable failed: $($_.Exception.Message), using DISM"; dism.exe /Online /Enable-Feature /FeatureName:NetFx3 /All /NoRestart | Out-Null; L "dism exit $LASTEXITCODE" }
            L "NetFx3 now: $((Get-WindowsOptionalFeature -Online -FeatureName NetFx3).State)" }
          L ".NET 2.0 registry version: $((Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\NET Framework Setup\NDP\v2.0.50727' -EA SilentlyContinue).Version)"
          L ".NET 4.x Release: $((Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\Full' -EA SilentlyContinue).Release)"
          L "(dotnetfx20.exe / isnetfx.exe inside the package are not run separately: Server 2025 rejects standalone .NET 2.0 installers, and NetFx3 already includes the 2.0 runtime)"

          L "=== Visual J# 2.0 Redistributable ==="
          $vjHas = (Installed 'Visual J#') -or (Get-ChildItem "$env:windir\assembly" -Recurse -Filter vjslib.dll -EA SilentlyContinue)
          if ($vjHas) { L "J# already exists: $(Installed 'Visual J#')" }
          else { $vj = Get-ChildItem "$env:PKG_DIR\ISSetupPrerequisites" -Recurse -Filter vjredist.exe | Select -First 1
                 Run $vj.FullName '/q:a /c:"install.exe /q"' 'J# 2.0'
                 L "J# after installation: $(Installed 'Visual J#')" }

          L "=== Java Runtime 1.5 (32-bit) ==="
          $jreHas = (Test-Path 'HKLM:\SOFTWARE\WOW6432Node\JavaSoft\Java Runtime Environment\1.5') -or (Installed 'J2SE Runtime Environment 5|Java\(TM\) 2 Runtime|Java 5')
          if ($jreHas) { L "JRE 1.5 already exists" }
          else { $jre = Get-ChildItem "$env:PKG_DIR\ISSetupPrerequisites" -Recurse -Filter "jre-*.exe" | Select -First 1
                 Run $jre.FullName '/s /v"/qn REBOOT=Suppress"' 'JRE 1.5.0_07'
                 L "JRE registry: $(Test-Path 'HKLM:\SOFTWARE\WOW6432Node\JavaSoft\Java Runtime Environment\1.5')" }

          L "=== Visual C++ runtimes ==="
          Installed 'Visual C\+\+' | sort -Unique | % { L "  already exists: $_" }
          foreach ($a in 'x86','x64') {
            if (-not (Installed "Visual C\+\+ 2015-20\d\d.*$a")) {
              $e = "$env:RUNNER_TEMP\vc_$a.exe"; curl.exe -sL -o $e "https://aka.ms/vs/17/release/vc_redist.$a.exe"
              Run $e '/install /quiet /norestart' "VC++ 2015-2022 $a" } }

          L "=== Legacy DirectX 9 runtime (d3dx9) ==="
          if (Test-Path "$env:windir\SysWOW64\d3dx9_43.dll") { L "d3dx9_43.dll already exists" }
          else { $dx = "$env:RUNNER_TEMP\dxwebsetup.exe"
                 curl.exe -sL --fail -o $dx "https://download.microsoft.com/download/1/7/1/1718CCC4-6315-4D8E-9543-8E28A4E18C4C/dxwebsetup.exe"
                 if ($LASTEXITCODE -eq 0) { Run $dx '/Q' 'DirectX End-User Runtime' } else { L "dxwebsetup download failed, skip" } }

          L "=== Media Foundation (may not be installed on Server edition) ==="
          try { $mf = Get-WindowsFeature Server-Media-Foundation -EA Stop; L "Server-Media-Foundation: $($mf.InstallState)"
                if ($mf.InstallState -ne 'Installed') { $r = Install-WindowsFeature Server-Media-Foundation -EA Stop; L "Installation result: Success=$($r.Success) Restart=$($r.RestartNeeded)" } }
          catch { L "Media Foundation check failed: $($_.Exception.Message)" }
          L "=== Dependency processing completed ==="

      # ------------------------------------------------------------------
      - name: 4. Run setup.exe, auto-interact with full screenshots, then launch main program
        timeout-minutes: 60
        env:
          SETUP_TIMEOUT_MIN: ${{ inputs.setup_timeout_min || '35' }}
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing, UIAutomationClient, UIAutomationTypes
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          public static class Mx {
            [DllImport("user32.dll")] public static extern bool SetProcessDPIAware();
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll")] public static extern bool AttachThreadInput(uint idAttach, uint idAttachTo, bool fAttach);
            [DllImport("user32.dll")] public static extern uint GetCurrentThreadId();
            [DllImport("user32.dll")] public static extern bool BringWindowToTop(IntPtr h);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int cmd);
            [DllImport("user32.dll")] public static extern bool IsIconic(IntPtr h);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint f, uint x, uint y, uint d, UIntPtr e);
            [DllImport("user32.dll")] public static extern void keybd_event(byte vk, byte scan, uint flags, UIntPtr extra);
            public static void ForceForeground(IntPtr h) {
              try {
                IntPtr fg = GetForegroundWindow();
                uint pidUnused;
                uint fgThread = GetWindowThreadProcessId(fg, out pidUnused);
                uint myThread = GetCurrentThreadId();
                if (fgThread != 0 && fgThread != myThread) {
                  AttachThreadInput(myThread, fgThread, true);
                  BringWindowToTop(h);
                  SetForegroundWindow(h);
                  AttachThreadInput(myThread, fgThread, false);
                } else {
                  BringWindowToTop(h);
                  SetForegroundWindow(h);
                }
                if (IsIconic(h)) { ShowWindow(h, 9); }
              } catch { }
            }
            public static void ClickAt(int x, int y) {
              SetCursorPos(x, y);
              System.Threading.Thread.Sleep(120);
              mouse_event(2, 0, 0, 0, UIntPtr.Zero);
              mouse_event(4, 0, 0, 0, UIntPtr.Zero);
            }
            public static void PressEnter() {
              keybd_event(0x0D, 0, 0, UIntPtr.Zero);
              keybd_event(0x0D, 0, 2, UIntPtr.Zero);
            }
          }
          "@
          Add-Type -TypeDefinition @"
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          using System.Text;
          [ComImport]
          [Guid("618736E0-3C3D-11CF-810C-00AA00389B71")]
          [InterfaceType(ComInterfaceType.InterfaceIsIUnknown)]
          public interface IAccessible {
            [PreserveSig] int QueryInterface(ref Guid riid, out IntPtr ppvObject);
            [PreserveSig] uint AddRef();
            [PreserveSig] uint Release();
            [PreserveSig] int GetTypeInfoCount(out uint pctinfo);
            [PreserveSig] int GetTypeInfo(uint iTInfo, uint lcid, out IntPtr ppTInfo);
            [PreserveSig] int GetIDsOfNames(ref Guid riid, IntPtr rgszNames, uint cNames, uint lcid, IntPtr rgDispId);
            [PreserveSig] int Invoke(int dispIdMember, ref Guid riid, uint lcid, ushort wFlags, IntPtr pDispParams, IntPtr pVarResult, IntPtr pExcepInfo, IntPtr puArgErr);
            [PreserveSig] int get_accParent(out object ppvParent);
            [PreserveSig] int get_accChildCount(out int pcChild);
            [PreserveSig] int get_accChild(object varChild, out object ppvChild);
            [PreserveSig] int get_accName(object varChild, [Out, MarshalAs(UnmanagedType.BStr)] out string pbstrName);
            [PreserveSig] int get_accValue(object varChild, [Out, MarshalAs(UnmanagedType.BStr)] out string pbstrValue);
            [PreserveSig] int get_accDescription(object varChild, [Out, MarshalAs(UnmanagedType.BStr)] out string pbstrDescription);
            [PreserveSig] int get_accRole(object varChild, out object pVarRole);
            [PreserveSig] int get_accState(object varChild, out object pVarState);
            [PreserveSig] int get_accHelp(object varChild, [Out, MarshalAs(UnmanagedType.BStr)] out string pbstrHelp);
            [PreserveSig] int get_accHelpTopic(object varChild, [Out, MarshalAs(UnmanagedType.BStr)] out string pbstrHelpFile, out int pidTopic);
            [PreserveSig] int get_accKeyboardShortcut(object varChild, [Out, MarshalAs(UnmanagedType.BStr)] out string pbstrKeyboardShortcut);
            [PreserveSig] int get_accFocus(out object pVarChild);
            [PreserveSig] int get_accSelection(out object pVarChildren);
            [PreserveSig] int get_accDefaultAction(object varChild, [Out, MarshalAs(UnmanagedType.BStr)] out string pbstrDefaultAction);
            [PreserveSig] int accSelect(object flags, object varChild);
            [PreserveSig] int accLocation(out int pxLeft, out int pyTop, out int pcxWidth, out int pcyHeight, object varChild);
            [PreserveSig] int accNavigate(int navDir, object varStart, out object pVarEnd);
            [PreserveSig] int accHitTest(int xLeft, int yTop, out object pVarChild);
            [PreserveSig] int accDoDefaultAction(object varChild);
            [PreserveSig] int put_accName(object varChild, [In, MarshalAs(UnmanagedType.BStr)] string bstrName);
            [PreserveSig] int put_accValue(object varChild, [In, MarshalAs(UnmanagedType.BStr)] string bstrValue);
          }
          public class AccNode {
            public IAccessible Acc;
            public int ChildId;
            public string Name;
            public string Value;
            public int Role;
            public int State;
            public int Left;
            public int Top;
            public int Width;
            public int Height;
          }
          public static class Msaa {
            private const uint OBJID_CLIENT = 0xFFFFFFFC;
            private const int NAVDIR_NEXT = 5;
            private const int NAVDIR_FIRSTCHILD = 7;
            public const int ROLE_STATICTEXT = 41;
            public const int ROLE_TEXT = 42;
            public const int ROLE_PUSHBUTTON = 43;
            public const int ROLE_CHECKBUTTON = 44;
            public const int ROLE_RADIOBUTTON = 45;
            public const int ROLE_PROGRESSBAR = 48;
            private static readonly Guid IID_IAccessible = new Guid("618736E0-3C3D-11CF-810C-00AA00389B71");
            [DllImport("oleacc.dll")]
            private static extern int AccessibleObjectFromWindow(IntPtr hwnd, uint dwId, ref Guid riid, [Out, MarshalAs(UnmanagedType.IUnknown)] out object ppvObject);
            private static int ToInt(object o) {
              if (o == null) return 0;
              if (o is int) return (int)o;
              try { return Convert.ToInt32(o); } catch { return 0; }
            }
            private static IAccessible GetRoot(IntPtr hwnd) {
              Guid riid = IID_IAccessible;
              object obj = null;
              int hr = AccessibleObjectFromWindow(hwnd, OBJID_CLIENT, ref riid, out obj);
              if (hr != 0 || obj == null) { hr = AccessibleObjectFromWindow(hwnd, 0, ref riid, out obj); }
              return obj as IAccessible;
            }
            public static List<AccNode> GetTree(IntPtr hwnd) {
              List<AccNode> list = new List<AccNode>();
              IAccessible root = GetRoot(hwnd);
              if (root != null) { Walk(root, 0, list, new List<IAccessible>()); }
              return list;
            }
            private static void Walk(IAccessible acc, int depth, List<AccNode> list, List<IAccessible> visited) {
              if (acc == null || depth > 7 || list.Count > 500) return;
              if (visited.Contains(acc)) return;
              visited.Add(acc);
              Record(acc, 0, list);
              int n = 0;
              try { acc.get_accChildCount(out n); } catch { n = 0; }
              for (int i = 1; i <= n && list.Count < 500; i++) { Record(acc, i, list); }
              if (n == 0) {
                object cur = null;
                int hr = -1;
                int guard = 0;
                try { hr = acc.accNavigate(NAVDIR_FIRSTCHILD, 0, out cur); } catch { hr = -1; }
                while (hr == 0 && cur != null && guard < 300) {
                  guard++;
                  IAccessible ia = cur as IAccessible;
                  if (ia != null) { Walk(ia, depth + 1, list, visited); }
                  else if (cur is int) { Record(acc, (int)cur, list); }
                  object next = null;
                  try { hr = acc.accNavigate(NAVDIR_NEXT, cur, out next); } catch { hr = -1; }
                  cur = next;
                }
              }
            }
            private static AccNode Record(IAccessible acc, int childId, List<AccNode> list) {
              string name = "";
              string value = "";
              object role = null;
              object state = null;
              int l = 0, t = 0, w = 0, h = 0;
              try { acc.get_accName(childId, out name); } catch { }
              try { acc.get_accValue(childId, out value); } catch { }
              try { acc.get_accRole(childId, out role); } catch { }
              try { acc.get_accState(childId, out state); } catch { }
              try { acc.accLocation(out l, out t, out w, out h, childId); } catch { }
              AccNode nd = new AccNode();
              nd.Acc = acc;
              nd.ChildId = childId;
              nd.Name = name == null ? "" : name;
              nd.Value = value == null ? "" : value;
              nd.Role = ToInt(role);
              nd.State = ToInt(state);
              nd.Left = l; nd.Top = t; nd.Width = w; nd.Height = h;
              list.Add(nd);
              return nd;
            }
            public static bool DoDefault(AccNode nd) {
              if (nd == null || nd.Acc == null) return false;
              try { return nd.Acc.accDoDefaultAction(nd.ChildId) == 0; } catch { return false; }
            }
            public static bool SelectNode(AccNode nd) {
              if (nd == null || nd.Acc == null) return false;
              bool ok = false;
              try { ok = nd.Acc.accDoDefaultAction(nd.ChildId) == 0; } catch { }
              try { nd.Acc.accSelect(3, nd.ChildId); } catch { }
              return ok;
            }
            public static string GetText(IntPtr hwnd) {
              StringBuilder sb = new StringBuilder();
              List<AccNode> nodes = GetTree(hwnd);
              foreach (AccNode nd in nodes) {
                if (nd.Name != null && nd.Name.Length > 0) { sb.Append(nd.Name); sb.Append(' '); }
                if (nd.Value != null && nd.Value.Length > 0) { sb.Append(nd.Value); sb.Append(' '); }
              }
              return sb.ToString();
            }
            public static string DumpTree(IntPtr hwnd) {
              StringBuilder sb = new StringBuilder();
              List<AccNode> nodes = GetTree(hwnd);
              foreach (AccNode nd in nodes) {
                sb.Append("role=").Append(nd.Role)
                  .Append(" state=").Append(nd.State)
                  .Append(" name='").Append(nd.Name).Append("'")
                  .Append(" value='").Append(nd.Value).Append("'")
                  .Append(" loc=").Append(nd.Left).Append(',').Append(nd.Top)
                  .Append(' ').Append(nd.Width).Append('x').Append(nd.Height);
                sb.AppendLine();
              }
              return sb.ToString();
            }
          }
          "@
          [void][Mx]::SetProcessDPIAware()
          $shots = "$env:OUT\shots"; $log = "$env:OUT\logs\setup-ui.txt"
          function L($m){ $s = "[$(Get-Date -f HH:mm:ss.fff)] $m"; Write-Host $s; Add-Content $log $s }
          function Shot($tag){
            try {
              $r = [System.Windows.Forms.SystemInformation]::VirtualScreen
              $b = New-Object System.Drawing.Bitmap $r.Width, $r.Height
              $g = [System.Drawing.Graphics]::FromImage($b)
              $g.CopyFromScreen($r.Left, $r.Top, 0, 0, $b.Size)
              $t = ($tag -replace '[^\w\-]', '_'); if ($t.Length -gt 50) { $t = $t.Substring(0,50) }
              $b.Save("$shots\K_$(Get-Date -f HHmmss_fff)_$t.png", [System.Drawing.Imaging.ImageFormat]::Png)
              $g.Dispose(); $b.Dispose()
            } catch { L "screenshot failed: $($_.Exception.Message)" }
          }

          # background timeline: one frame every 1.5 s
          $job = Start-Job -ArgumentList $shots -ScriptBlock {
            param($d); Add-Type -AssemblyName System.Windows.Forms, System.Drawing; $i = 0
            while (-not (Test-Path "$d\STOP")) {
              try {
                $r = [System.Windows.Forms.SystemInformation]::VirtualScreen
                $b = New-Object System.Drawing.Bitmap $r.Width, $r.Height
                $g = [System.Drawing.Graphics]::FromImage($b)
                $g.CopyFromScreen($r.Left, $r.Top, 0, 0, $b.Size)
                $b.Save(("$d\F_{0:D4}_{1}.jpg" -f (++$i), (Get-Date -f HHmmss)), [System.Drawing.Imaging.ImageFormat]::Jpeg)
                $g.Dispose(); $b.Dispose()
              } catch {}
              Start-Sleep -Milliseconds 1500
            }
          }

          $AE = [System.Windows.Automation.AutomationElement]
          $TS = [System.Windows.Automation.TreeScope]
          $CT = [System.Windows.Automation.ControlType]

          function Kids($el, $type){
            $c = New-Object System.Windows.Automation.PropertyCondition($AE::ControlTypeProperty, $type)
            @($el.FindAll($TS::Descendants, $c))
          }
          function Names($list){ (@($list) | % { $_.Current.Name }) -join ' | ' }
          function Clean-Name([string]$n){
            if (-not $n) { return '' }
            $s = $n.Replace('&','').Replace('<','').Replace('>','').Trim().ToLowerInvariant()
            while ($s.Contains('  ')) { $s = $s.Replace('  ',' ') }
            return $s
          }
          function Pick($el){
            try { $sp = $el.GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern); if ($sp.Current.IsSelected) { return $false }; $sp.Select(); return $true } catch {}
            try { $tp = $el.GetCurrentPattern([System.Windows.Automation.TogglePattern]::Pattern); if ($tp.Current.ToggleState -eq 'On') { return $false }; $tp.Toggle(); return $true } catch {}
            $false
          }
          function Click-Uia($el, $hwnd){
            try { $el.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke(); return 'uia-invoke' } catch {}
            try { $el.GetCurrentPattern([System.Windows.Automation.LegacyIAccessiblePattern]::Pattern).DoDefaultAction(); return 'legacy' } catch {}
            try {
              $rc = $el.Current.BoundingRectangle
              [Mx]::ForceForeground($hwnd)
              [Mx]::ClickAt([int]($rc.X + $rc.Width/2), [int]($rc.Y + $rc.Height/2))
              return 'mouse'
            } catch { return 'failed' }
          }

          $procRx  = '^(setup|setup64|msiexec|ISBEW64|IDriver|IDriver2|_isdel|ikernel|jre\w*|vjredist|install|dotnetfx20|isnetfx|dxwebsetup|dxsetup|haspdinst|sentinel\w*|scenarist\w*)$'
          $titleRx = '(?i)Scenarist|InstallShield|Java|J#|\.NET Framework|Sentinel|HASP|Setup|Install|Program Compatibility|Security Warning|Windows Installer|Visual C\+\+'
          function SetupWindows(){
            $out = @()
            foreach ($w in @($AE::RootElement.FindAll($TS::Children, [System.Windows.Automation.Condition]::TrueCondition))) {
              try {
                if ($w.Current.IsOffscreen) { continue }
                $p = Get-Process -Id $w.Current.ProcessId -EA SilentlyContinue
                if (-not $p) { continue }
                if ($p.Id -eq $PID -or $p.ProcessName -match '^(powershell|pwsh|conhost|WindowsTerminal|explorer|Runner\.\w+)$') { continue }
                if ($p.ProcessName -match $procRx -or $w.Current.Name -match $titleRx) {
                  $out += ,@{ El=$w; Proc=$p.ProcessName; Title=$w.Current.Name; H=[IntPtr]$w.Current.NativeWindowHandle; Rect=$w.Current.BoundingRectangle }
                }
              } catch {}
            }
            $out
          }

          function Dump-UiaTree($el, $depth){
            if ($depth -gt 5) { return }
            try {
              $ind = '  ' * $depth
              L ("{0}ctype={1} name='{2}' aid='{3}' cls='{4}' rect={5}" -f $ind, $el.Current.ControlType.ProgrammaticName, $el.Current.Name, $el.Current.AutomationId, $el.Current.ClassName, $el.Current.BoundingRectangle)
            } catch { return }
            if ($depth -lt 5) {
              $kids = @()
              try { $kids = @($el.FindAll($TS::Children, [System.Windows.Automation.Condition]::TrueCondition)) } catch {}
              $n = 0
              foreach ($c in $kids) {
                if ($n -ge 60) { L (( '  ' * ($depth+1)) + '...(truncated)'); break }
                Dump-UiaTree $c ($depth+1); $n++
              }
            }
          }

          $script:seen = @{}
          $script:clicked = @{}
          $script:fb = @{}
          $script:warned = @{}
          $script:installClicked = $false
          $script:acceptRx = '(?i)accept|agree|\u540c\u610f'
          $script:neverRx  = '(?i)cancel|back|exit|abort|restart now|reboot now|remove|repair|modify|don.t'
          $script:normalOrder = @('install','next','finish','yes','ok','continue','run','close','done','i agree','i accept','agree','accept')
          $script:rebootOrder = @('no','later','finish','ok','close')
          $script:waitRx = '(?i)installing|please wait|copying files|removing files|progress'

          function Is-Disabled($nd){ return (($nd.State -band 0x8009) -ne 0) }

          function Find-UiaButton($buttons, $order, $neverRx){
            foreach ($want in $order) {
              $b = $buttons | ? { (Clean-Name $_.Current.Name) -eq $want -and $_.Current.Name -notmatch $neverRx } | select -First 1
              if ($b) { return $b }
            }
            foreach ($want in $order) {
              $b = $buttons | ? { ((Clean-Name $_.Current.Name).Contains($want)) -and $_.Current.Name -notmatch $neverRx } | select -First 1
              if ($b) { return $b }
            }
            return $null
          }

          function Find-MsaaButton($nodes, $order, $neverRx){
            foreach ($want in $order) {
              $nd = $nodes | ? { ($_.Role -eq [Msaa]::ROLE_PUSHBUTTON -or $_.Role -eq [Msaa]::ROLE_RADIOBUTTON -or $_.Role -eq [Msaa]::ROLE_CHECKBUTTON) -and -not (Is-Disabled $_) -and (Clean-Name $_.Name) -eq $want -and $_.Name -notmatch $neverRx } | select -First 1
              if ($nd) { return $nd }
            }
            # contains pass: push buttons only (avoid toggling checkboxes/radios by accident)
            foreach ($want in $order) {
              $nd = $nodes | ? { $_.Role -eq [Msaa]::ROLE_PUSHBUTTON -and -not (Is-Disabled $_) -and ((Clean-Name $_.Name).Contains($want)) -and $_.Name -notmatch $neverRx } | select -First 1
              if ($nd) { return $nd }
            }
            return $null
          }

          function Get-FbState($fp){
            if (-not $script:fb.ContainsKey($fp)) {
              $script:fb[$fp] = @{ kb=0; kbT=[datetime]::MinValue; co=0; coT=[datetime]::MinValue; coWarned=$false }
            }
            return $script:fb[$fp]
          }

          function Click-Throttled($ck){
            if ($script:clicked.ContainsKey($ck)) {
              if (((Get-Date) - $script:clicked[$ck]).TotalSeconds -lt 10) { return $false }
            }
            $script:clicked[$ck] = Get-Date
            return $true
          }

          function Handle($w){
            $el=$w.El; $h=$w.H; $title=$w.Title; $rect=$w.Rect
            $texts = Names (Kids $el $CT::Text)
            $uiaButtons = @(Kids $el $CT::Button | ? { $_.Current.IsEnabled -and -not $_.Current.IsOffscreen })
            $msaaNodes = @(); $msaaText = ''
            try { $msaaNodes = @([Msaa]::GetTree($h)); $msaaText = [Msaa]::GetText($h) } catch { $msaaNodes=@(); $msaaText='' }
            $allText = "$title | $texts | $msaaText"
            $fpText = $allText; if ($fpText.Length -gt 400) { $fpText = $fpText.Substring(0,400) }
            $fp = "$h|$title|$($fpText.GetHashCode())"
            if (-not $script:seen.ContainsKey($fp)) {
              $script:seen[$fp] = 1
              L "== window [$($w.Proc)] '$title' rect=$([int]$rect.X),$([int]$rect.Y) $([int]$rect.Width)x$([int]$rect.Height)"
              L "   uia-text: $texts"
              L "   uia-buttons: $(Names $uiaButtons)"
              L "   msaa-text: $msaaText"
              try { L "   msaa-tree:`n$([Msaa]::DumpTree($h))" } catch {}
              try { Dump-UiaTree $el 0 } catch {}
              Shot ("page_" + $title)
            }
            $isReboot = $allText -match '(?i)restart|reboot'
            $isError = ($title -match '(?i)\berror\b|failed') -or ($allText -match '(?i)fatal error|installation (has )?failed|not supported|could not install')
            $isSerial = $allText -match '(?i)serial number|license key|activation key|registration code|product key|cd.?key'
            $hasProgress = $false
            foreach ($nd in $msaaNodes) { if ($nd.Role -eq [Msaa]::ROLE_PROGRESSBAR) { $hasProgress = $true; break } }
            $isWaiting = $allText -match $script:waitRx
            if ($isError) { throw "installer error dialog detected: '$title'" }
            if ($isSerial) { L "!! serial/license-entry page detected ('$title'); stopping interaction for manual review"; Shot 'serial_page'; return $false }
            $order = if ($isReboot) { $script:rebootOrder } else { $script:normalOrder }

            # 1) accept radio/checkbox - UIA
            foreach ($r in @(Kids $el $CT::RadioButton) + @(Kids $el $CT::CheckBox)) {
              if ($r.Current.IsEnabled -and -not $r.Current.IsOffscreen -and $r.Current.Name -match $script:acceptRx) {
                if (Pick $r) { L "uia: selected '$($r.Current.Name)'"; Shot 'before_accept'; Start-Sleep 1; return $true }
              }
            }
            # 2) accept radio/checkbox - MSAA
            foreach ($nd in $msaaNodes) {
              if (($nd.Role -eq [Msaa]::ROLE_RADIOBUTTON -or $nd.Role -eq [Msaa]::ROLE_CHECKBUTTON) -and -not (Is-Disabled $nd) -and $nd.Name -match $script:acceptRx) {
                if ([Msaa]::SelectNode($nd)) { L "msaa: selected '$($nd.Name)'"; Shot 'after_accept'; Start-Sleep 1; return $true }
              }
            }
            # 3) click primary button - UIA
            $b = Find-UiaButton $uiaButtons $order $script:neverRx
            if ($b) {
              $ck = "$fp|" + (Clean-Name $b.Current.Name)
              if (Click-Throttled $ck) {
                [Mx]::ForceForeground($h); Start-Sleep -Milliseconds 300
                Shot ("click_" + $b.Current.Name)
                $how = Click-Uia $b $h
                L "uia: clicked [$($b.Current.Name)] via $how @ '$title'"
                if ((Clean-Name $b.Current.Name) -eq 'install') { $script:installClicked = $true; L "install button clicked; disabling keyboard/coordinate fallbacks" }
                Start-Sleep 2; return $true
              }
            }
            # 4) click primary button - MSAA
            $target = Find-MsaaButton $msaaNodes $order $script:neverRx
            if ($target) {
              $ck = "$fp|" + (Clean-Name $target.Name)
              if (Click-Throttled $ck) {
                Shot ("click_" + $target.Name)
                $ok = [Msaa]::DoDefault($target)
                L "msaa: clicked '$($target.Name)' (ok=$ok) @ '$title'"
                if ((Clean-Name $target.Name) -eq 'install') { $script:installClicked = $true; L "install button clicked; disabling keyboard/coordinate fallbacks" }
                Start-Sleep 2; return $true
              }
            }
            # 5) if a Next button is disabled, fill an empty non-serial edit
            $nextDisabled = $false
            $nextUia = @(Kids $el $CT::Button | ? { (Clean-Name $_.Current.Name) -eq 'next' })
            if ($nextUia.Count -gt 0 -and -not ($nextUia | ? { $_.Current.IsEnabled })) { $nextDisabled = $true }
            if (-not $nextDisabled) {
              $nextM = @($msaaNodes | ? { $_.Role -eq [Msaa]::ROLE_PUSHBUTTON -and (Clean-Name $_.Name) -eq 'next' })
              if ($nextM.Count -gt 0 -and -not ($nextM | ? { -not (Is-Disabled $_) })) { $nextDisabled = $true }
            }
            if ($nextDisabled) {
              foreach ($e in @(Kids $el $CT::Edit)) {
                try {
                  $vp = $e.GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern)
                  if (-not $vp.Current.IsReadOnly -and [string]::IsNullOrWhiteSpace($vp.Current.Value)) {
                    [Mx]::ForceForeground($h)
                    $rc = $e.Current.BoundingRectangle
                    [Mx]::ClickAt([int]($rc.X + $rc.Width/2), [int]($rc.Y + $rc.Height/2)); Start-Sleep -Milliseconds 400
                    [System.Windows.Forms.SendKeys]::SendWait('GitHubActions')
                    L "uia: filled edit '$($e.Current.Name)'"; Start-Sleep -Milliseconds 500; return $true
                  }
                } catch {}
              }
              foreach ($nd in $msaaNodes) {
                if ($nd.Role -eq [Msaa]::ROLE_TEXT -and -not (Is-Disabled $nd) -and [string]::IsNullOrWhiteSpace($nd.Value) -and $nd.Width -gt 0 -and $nd.Height -gt 0) {
                  [Mx]::ForceForeground($h)
                  [Mx]::ClickAt([int]($nd.Left + $nd.Width/2), [int]($nd.Top + $nd.Height/2)); Start-Sleep -Milliseconds 400
                  [System.Windows.Forms.SendKeys]::SendWait('GitHubActions')
                  L "msaa: filled edit '$($nd.Name)'"; Start-Sleep -Milliseconds 500; return $true
                }
              }
              if (-not $script:warned.ContainsKey($fp)) { $script:warned[$fp] = 1; L "!! Next is disabled and no fillable field was found (a serial may be required); waiting" }
            }
            # 6) keyboard fallback (Enter) - only before install starts; never on progress/wait/reboot/error/serial
            if ($w.Proc -eq 'msiexec' -and -not $script:installClicked -and -not $isReboot -and -not $isError -and -not $isSerial -and -not $hasProgress -and -not $isWaiting) {
              $st = Get-FbState $fp
              if ($st['kb'] -lt 4 -and ((Get-Date) - $st['kbT']).TotalSeconds -ge 12) {
                [Mx]::ForceForeground($h); Start-Sleep -Milliseconds 400
                [Mx]::PressEnter()
                $st['kb'] = $st['kb'] + 1; $st['kbT'] = Get-Date
                L "fallback: ENTER sent to '$title' (attempt $($st['kb']))"; Shot 'fallback_enter'
                return $true
              }
            }
            # 7) coordinate fallback (calibrated "Next >" position) - only before install starts
            if ($w.Proc -eq 'msiexec' -and -not $script:installClicked -and -not $isReboot -and -not $isError -and -not $isSerial -and -not $hasProgress -and -not $isWaiting) {
              $st = Get-FbState $fp
              if ($st['co'] -lt 4 -and ((Get-Date) - $st['coT']).TotalSeconds -ge 15) {
                $rw = [int]$rect.Width; $rh = [int]$rect.Height
                if ($rw -ge 400 -and $rw -le 650 -and $rh -ge 280 -and $rh -le 480) {
                  $cx = [int]($rect.X + 0.69 * $rw); $cy = [int]($rect.Y + 0.96 * $rh)
                  [Mx]::ForceForeground($h); Start-Sleep -Milliseconds 400
                  [Mx]::ClickAt($cx, $cy)
                  $st['co'] = $st['co'] + 1; $st['coT'] = Get-Date
                  L "fallback: coordinate click ($cx,$cy) on '$title' (attempt $($st['co']))"; Shot 'fallback_coord'
                  return $true
                } else {
                  if (-not $st['coWarned']) { $st['coWarned'] = $true; L "fallback: coordinate click skipped; dialog size ${rw}x${rh} outside template range" }
                }
              }
            }
            return $false
          }

          try {
            Shot 'desktop_before_setup'
            $setup = Start-Process -FilePath $env:SETUP_EXE -WorkingDirectory $env:PKG_DIR -PassThru
            L "setup.exe started pid=$($setup.Id)  timeout=$env:SETUP_TIMEOUT_MIN minutes"
            $deadline = (Get-Date).AddMinutes([int]$env:SETUP_TIMEOUT_MIN)
            $quiet = 0; $lastBeat = Get-Date; $completed = $false
            while ((Get-Date) -lt $deadline) {
              $wins = @(SetupWindows)
              if ($wins.Count -eq 0) {
                $busy = @(Get-Process -EA SilentlyContinue | ? { $_.ProcessName -match '^(setup|setup64|ISBEW64|IDriver|IDriver2|ikernel|install)$' -or ($_.ProcessName -eq 'msiexec' -and $_.MainWindowHandle -ne 0) })
                $setup.Refresh()
                if ($setup.HasExited -and $busy.Count -eq 0) { if ((++$quiet) -ge 10) { $completed = $true; break } }
              } else { $quiet = 0 }
              $acted = $false
              foreach ($w in $wins) { try { if (Handle $w) { $acted = $true; break } } catch { L "window handling exception: $($_.Exception.Message)" } }
              if (-not $acted) { Start-Sleep 1 } else { Start-Sleep -Milliseconds 400 }
              if (((Get-Date) - $lastBeat).TotalSeconds -ge 30) { $lastBeat = Get-Date; L "heartbeat: windows=$($wins.Count) acted=$acted setupExited=$($setup.HasExited) installClicked=$($script:installClicked)" }
            }
            if (-not $completed) { throw "installer did not finish within $env:SETUP_TIMEOUT_MIN minutes; inspect screenshots/logs" }
            if ($setup.ExitCode -ne 0) { throw "setup.exe exited with code $($setup.ExitCode)" }
            Shot 'after_setup'
            Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -EA SilentlyContinue |
              ? DisplayName | sort DisplayName | select DisplayName, DisplayVersion, InstallLocation | Format-Table -AutoSize | Out-String -Width 300 | Out-File "$env:OUT\logs\installed-programs.txt"
            $cands = @(Get-ChildItem 'C:\Program Files','C:\Program Files (x86)' -Recurse -Filter *.exe -EA SilentlyContinue |
              ? { $_.FullName -match '(?i)scenarist' -and $_.Name -notmatch '(?i)unins|setup|crash|update|helper' })
            $cands | % { L "candidate main program: $($_.FullName)" }
            $main = $cands | sort { if ($_.Name -match '(?i)^Scenarist\s*BD') {0} elseif ($_.Name -match '(?i)^Scenarist') {1} else {2} } | select -First 1
            if ($main) {
              L "launching main program: $($main.FullName)  version $($main.VersionInfo.FileVersion)"
              Start-Process $main.FullName -WorkingDirectory $main.DirectoryName
              for ($i = 1; $i -le 40; $i++) {
                Start-Sleep 3; Shot ("main_{0:D2}" -f $i)
                if ($i % 10 -eq 0) { Get-Process | ? { $_.MainWindowTitle } | % { L "   window [$($_.ProcessName)] $($_.MainWindowTitle)" } }
              }
              L "note: Scenarist BD requires a valid Sentinel/HASP license; without one the app may show only a license/activation dialog"
            } else {
              L "Scenarist main exe not found; installation probably did not complete"; Shot 'no_main_exe'
            }
          } catch {
            L "stage stopped: $($_.Exception.Message)"
            try { Shot 'stage_failure' } catch {}
            throw
          } finally {
            New-Item "$shots\STOP" -ItemType File -Force | Out-Null
            Wait-Job $job -Timeout 10 | Out-Null
            Remove-Job $job -Force -EA SilentlyContinue
            Remove-Item "$shots\STOP" -EA SilentlyContinue
            L "total screenshots: $((Get-ChildItem $shots -File).Count)"
          }

      # ------------------------------------------------------------------
      - name: 5. Upload screenshots and logs regardless of result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scenarist-bd-screenshots-${{ github.run_number }}
          path: out
          if-no-files-found: warn
          retention-days: 14
