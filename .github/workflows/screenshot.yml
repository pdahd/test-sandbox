name: Check & Install Prerequisites

on:
  workflow_dispatch:

jobs:
  env_check:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh

    steps:
      - name: 1. 检查当前系统预装环境 (探路)
        run: |
          Write-Host "=== 1. 操作系统信息 ==="
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, OSArchitecture, Version | Format-List

          Write-Host "=== 2. 检查 .NET Framework 2.0 / 3.5 状态 ==="
          $net35 = Get-WindowsCapability -Online | Where-Object Name -like "*NetFX3*"
          Write-Host ".NET 3.5 Capability Status: $($net35.State)"
          $net2Reg = Test-Path "HKLM:\SOFTWARE\Microsoft\NET Framework Setup\NDP\v2.0.50727"
          Write-Host ".NET 2.0 Registry Present: $net2Reg"

          Write-Host "=== 3. 检查 Java (32/64位) 预装情况 ==="
          where.exe java 2>$null
          java -version 2>&1

          Write-Host "=== 4. 检查 Visual J# 2.0 状态 ==="
          $vjReg = Test-Path "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Visual JSharp Setup\Redist\v2.0.50727"
          Write-Host "Visual J# Registry Present: $vjReg"

      - name: 2. 下载并解压安装包提取依赖
        run: |
          New-Item -ItemType Directory -Force dl, app | Out-Null
          curl.exe -L --retry 3 -OJ --output-dir dl "https://1008.filemail.com/api/file/get?filekey=qZ8PSCAMNDT_UbcUmAm998Sbdsf_rsbG0d_8ihincKT-36w0PEM-2ToKW8eACEmyrA"
          $f = Get-ChildItem dl -File | Sort-Object Length -Descending | Select-Object -First 1
          Write-Host "下载成功: $($f.Name) ($([math]::Round($f.Length/1MB, 2)) MB)"
          7z x "$($f.FullName)" -o"app" -y

      - name: 3. 补齐与静默安装 .NET 3.5 / 2.0 功能
        run: |
          Write-Host "正在通过 Windows Optional Feature 开启 .NET 3.5/2.0..."
          try {
              Enable-WindowsOptionalFeature -Online -FeatureName "NetFx3" -All -NoRestart -ErrorAction Stop
              Write-Host "[√] .NET 3.5/2.0 开启成功！"
          } catch {
              Write-Host "[!] Enable-WindowsOptionalFeature 失败，尝试 Install-WindowsFeature..."
              Install-WindowsFeature NetFx3
          }

      - name: 4. 测试静默安装 Visual J# 2.0 (vjredist.exe)
        run: |
          $vjExe = Get-ChildItem app -Recurse -Filter "vjredist.exe" | Select-Object -First 1
          if ($vjExe) {
              Write-Host "找到 vjredist.exe: $($vjExe.FullName)"
              Write-Host "正在静默安装 Visual J# 2.0..."
              $p = Start-Process -FilePath $vjExe.FullName -ArgumentList "/q" -PassThru -Wait
              Write-Host "vjredist.exe 安装完成，退出码: $($p.ExitCode)"
          } else {
              Write-Host "[!] 报错: 未找到 vjredist.exe"
          }

      - name: 5. 测试静默安装 JRE 1.5 (jre-1_5_0_07-windows-i586-p.exe)
        run: |
          $jreExe = Get-ChildItem app -Recurse -Filter "jre-*.exe" | Select-Object -First 1
          if ($jreExe) {
              Write-Host "找到 JRE 安装包: $($jreExe.FullName)"
              Write-Host "正在静默安装 JRE 1.5 (32位)..."
              $p = Start-Process -FilePath $jreExe.FullName -ArgumentList "/s /v`"/qn`"" -PassThru -Wait
              Write-Host "JRE 安装完成，退出码: $($p.ExitCode)"
          } else {
              Write-Host "[!] 报错: 未找到 JRE 安装包"
          }

      - name: 6. 最终验证环境补齐结果
        run: |
          Write-Host "=== 验证结果汇总 ==="
          $vjReg = Test-Path "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Visual JSharp Setup\Redist\v2.0.50727"
          Write-Host "Visual J# 安装状态: $vjReg"

          $net2Reg = Test-Path "HKLM:\SOFTWARE\Microsoft\NET Framework Setup\NDP\v2.0.50727"
          Write-Host ".NET 2.0/3.5 注册表状态: $net2Reg"

          $java32Reg = Test-Path "HKLM:\SOFTWARE\WOW6432Node\JavaSoft\Java Runtime Environment"
          Write-Host "32位 JRE 注册表状态: $java32Reg"
