name: Scenarist BD - install & screenshot

on:
  workflow_dispatch:
    inputs:
      setup_timeout_min:
        description: "Maximum wait time for setup wizard auto-interaction (minutes)"
        default: "35"

env:
  PKG_URL: "https://1008.filemail.com/api/file/get?filekey=qZ8PSCAMNDT_UbcUmAm998Sbdsf_rsbG0d_8ihincKT-36w0PEM-2ToKW8eACEmyrA"
  OUT: ${{ github.workspace }}\out

jobs:
  capture:
    runs-on: windows-2025
    timeout-minutes: 110
    defaults:
      run:
        shell: powershell      # Windows PowerShell 5.1; UIAutomation is more stable here

    steps:
      # ------------------------------------------------------------------
      - name: 1. Desktop check, minimize runner console, and try higher resolution
        run: |
          New-Item -ItemType Directory -Force "$env:OUT\shots","$env:OUT\logs" | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type @"
          using System; using System.Text; using System.Runtime.InteropServices;
          public static class U32 {
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc p, IntPtr l);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int cmd);
            [DllImport("user32.dll")] public static extern bool SetProcessDPIAware();
            [StructLayout(LayoutKind.Sequential, CharSet=CharSet.Ansi)]
            public struct DEVMODE {
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst=32)] public string dmDeviceName;
              public short dmSpecVersion, dmDriverVersion, dmSize, dmDriverExtra; public int dmFields;
              public int dmPositionX, dmPositionY, dmDisplayOrientation, dmDisplayFixedOutput;
              public short dmColor, dmDuplex, dmYResolution, dmTTOption, dmCollate;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst=32)] public string dmFormName;
              public short dmLogPixels; public int dmBitsPerPel, dmPelsWidth, dmPelsHeight, dmDisplayFlags, dmDisplayFrequency;
              public int dmICMMethod, dmICMIntent, dmMediaType, dmDitherType, dmReserved1, dmReserved2, dmPanningWidth, dmPanningHeight; }
            [DllImport("user32.dll")] public static extern int EnumDisplaySettings(string n, int mode, ref DEVMODE dm);
            [DllImport("user32.dll")] public static extern int ChangeDisplaySettings(ref DEVMODE dm, int flags);
          }
          "@
          [void][U32]::SetProcessDPIAware()
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "OS: $($os.Caption) | $($os.Version) | $($os.OSArchitecture)"
          Write-Host "Session: $((Get-Process -Id $PID).SessionId)  UserInteractive: $([Environment]::UserInteractive)  Explorer: $([bool](Get-Process explorer -EA SilentlyContinue))"

          # Minimize the hosted-compute-agent console. Do not close it.
          $cb = [U32+EnumProc]{ param($h, $l)
            if ([U32]::IsWindowVisible($h)) {
              $sb = New-Object System.Text.StringBuilder 1024
              [void][U32]::GetWindowText($h, $sb, 1024); $t = $sb.ToString()
              if ($t -and $t -match 'ProgramData\\GitHub|hosted-compute|Runner\.Listener') {
                Write-Host "minimize: $t"; [void][U32]::ShowWindow($h, 6) } }
            $true }
          [void][U32]::EnumWindows($cb, [IntPtr]::Zero)
          Get-Process ServerManager -EA SilentlyContinue | Stop-Process -Force -EA SilentlyContinue

          # Try to raise the resolution. The Hyper-V virtual GPU may reject it.
          $dm = New-Object U32+DEVMODE; $dm.dmSize = [Runtime.InteropServices.Marshal]::SizeOf($dm)
          [void][U32]::EnumDisplaySettings($null, -1, [ref]$dm)
          foreach ($res in @(@(1920,1080), @(1600,1200), @(1280,1024))) {
            $dm.dmPelsWidth = $res[0]; $dm.dmPelsHeight = $res[1]; $dm.dmFields = 0x80000 -bor 0x100000
            $rc = [U32]::ChangeDisplaySettings([ref]$dm, 0)
            if ($rc -eq 0) { Write-Host "resolution -> $($res[0])x$($res[1])"; break } else { Write-Host "resolution $($res[0])x$($res[1]) rejected ($rc)" } }
          $scr = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          Write-Host "Screen now: $($scr.Width)x$($scr.Height)"

          # Baseline screenshot. Failure here means there is no interactive desktop.
          $b = New-Object System.Drawing.Bitmap $scr.Width, $scr.Height
          $g = [System.Drawing.Graphics]::FromImage($b); $g.CopyFromScreen(0,0,0,0,$b.Size)
          $b.Save("$env:OUT\shots\K_000000_baseline_desktop.png"); $g.Dispose(); $b.Dispose()

      # ------------------------------------------------------------------
      - name: 2. Download and extract installation package
        run: |
          $f = "$env:RUNNER_TEMP\pkg.bin"
          curl.exe -L --fail --retry 3 --retry-delay 5 -A "Mozilla/5.0" -o $f "$env:PKG_URL"
          if ($LASTEXITCODE -ne 0) { throw "download failed (curl exit $LASTEXITCODE); Filemail link may have expired" }
          $fi = Get-Item $f
          $fs = [IO.File]::OpenRead($f); $hb = New-Object byte[] 8; [void]$fs.Read($hb,0,8); $fs.Close()
          Write-Host "size=$($fi.Length)  magic=$(($hb | % { $_.ToString('X2') }) -join ' ')"
          if ($fi.Length -lt 1MB) { Get-Content $f -TotalCount 20; throw "file is too small; probably an HTML error page, not an archive" }
          & "C:\Program Files\7-Zip\7z.exe" x $f "-o$env:RUNNER_TEMP\pkg" -y | Select-Object -Last 4
          if ($LASTEXITCODE -ne 0) { throw "7-Zip extraction failed (exit $LASTEXITCODE)" }
          Get-ChildItem "$env:RUNNER_TEMP\pkg" -Recurse | % { "{0,12}  {1}" -f $_.Length, $_.FullName } | Tee-Object "$env:OUT\logs\package-tree.txt"
          $setup = Get-ChildItem "$env:RUNNER_TEMP\pkg" -Recurse -Filter setup.exe | Select-Object -First 1
          if (-not $setup) { throw "setup.exe was not found" }
          "SETUP_EXE=$($setup.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "PKG_DIR=$($setup.DirectoryName)"  | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "setup.exe => $($setup.FullName)"

      # ------------------------------------------------------------------
      - name: 3. Query system dependencies and install missing components
        timeout-minutes: 30
        run: |
          $log = "$env:OUT\logs\dependencies.txt"
          function L($m){ $s = "[$(Get-Date -f HH:mm:ss)] $m"; Write-Host $s; Add-Content $log $s }
          function Installed($rx){ Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -EA SilentlyContinue | ? { $_.DisplayName -match $rx } | % DisplayName }
          function Run($exe,$a,$label){
            if (-not $exe -or -not (Test-Path $exe)) { L "$label : installer does not exist, skip"; return }
            try { $p = Start-Process -FilePath $exe -ArgumentList $a -Wait -PassThru; L "$label : exit $($p.ExitCode)  (0=success 3010=reboot required 1638/5100=already installed or unsupported)" }
            catch { L "$label : exception $($_.Exception.Message)" } }

          L "=== Windows Installer service ==="
          Start-Service msiserver -EA SilentlyContinue; L "msiserver: $((Get-Service msiserver).Status)"

          L "=== .NET Framework 2.0 / 3.5 (NetFx3) ==="
          $fx = Get-WindowsOptionalFeature -Online -FeatureName NetFx3
          L "NetFx3 current: $($fx.State)"
          if ($fx.State -ne 'Enabled') {
            try { $r = Enable-WindowsOptionalFeature -Online -FeatureName NetFx3 -All -NoRestart -EA Stop; L "Enable-WindowsOptionalFeature completed, RestartNeeded=$($r.RestartNeeded)" }
            catch { L "Enable failed: $($_.Exception.Message), using DISM"; dism.exe /Online /Enable-Feature /FeatureName:NetFx3 /All /NoRestart | Out-Null; L "dism exit $LASTEXITCODE" }
            L "NetFx3 now: $((Get-WindowsOptionalFeature -Online -FeatureName NetFx3).State)" }
          L ".NET 2.0 registry version: $((Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\NET Framework Setup\NDP\v2.0.50727' -EA SilentlyContinue).Version)"
          L ".NET 4.x Release: $((Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\Full' -EA SilentlyContinue).Release)"
          L "(dotnetfx20.exe / isnetfx.exe inside the package are not run separately: Server 2025 rejects standalone .NET 2.0 installers, and NetFx3 already includes the 2.0 runtime)"

          L "=== Visual J# 2.0 Redistributable ==="
          $vjHas = (Installed 'Visual J#') -or (Get-ChildItem "$env:windir\assembly" -Recurse -Filter vjslib.dll -EA SilentlyContinue)
          if ($vjHas) { L "J# already exists: $(Installed 'Visual J#')" }
          else { $vj = Get-ChildItem "$env:PKG_DIR\ISSetupPrerequisites" -Recurse -Filter vjredist.exe | Select -First 1
                 Run $vj.FullName '/q:a /c:"install.exe /q"' 'J# 2.0'
                 L "J# after installation: $(Installed 'Visual J#')" }

          L "=== Java Runtime 1.5 (32-bit) ==="
          $jreHas = (Test-Path 'HKLM:\SOFTWARE\WOW6432Node\JavaSoft\Java Runtime Environment\1.5') -or (Installed 'J2SE Runtime Environment 5|Java\(TM\) 2 Runtime|Java 5')
          if ($jreHas) { L "JRE 1.5 already exists" }
          else { $jre = Get-ChildItem "$env:PKG_DIR\ISSetupPrerequisites" -Recurse -Filter "jre-*.exe" | Select -First 1
                 Run $jre.FullName '/s /v"/qn REBOOT=Suppress"' 'JRE 1.5.0_07'
                 L "JRE registry: $(Test-Path 'HKLM:\SOFTWARE\WOW6432Node\JavaSoft\Java Runtime Environment\1.5')" }

          L "=== Visual C++ runtimes ==="
          Installed 'Visual C\+\+' | sort -Unique | % { L "  already exists: $_" }
          foreach ($a in 'x86','x64') {
            if (-not (Installed "Visual C\+\+ 2015-20\d\d.*$a")) {
              $e = "$env:RUNNER_TEMP\vc_$a.exe"; curl.exe -sL -o $e "https://aka.ms/vs/17/release/vc_redist.$a.exe"
              Run $e '/install /quiet /norestart' "VC++ 2015-2022 $a" } }

          L "=== Legacy DirectX 9 runtime (d3dx9) ==="
          if (Test-Path "$env:windir\SysWOW64\d3dx9_43.dll") { L "d3dx9_43.dll already exists" }
          else { $dx = "$env:RUNNER_TEMP\dxwebsetup.exe"
                 curl.exe -sL --fail -o $dx "https://download.microsoft.com/download/1/7/1/1718CCC4-6315-4D8E-9543-8E28A4E18C4C/dxwebsetup.exe"
                 if ($LASTEXITCODE -eq 0) { Run $dx '/Q' 'DirectX End-User Runtime' } else { L "dxwebsetup download failed, skip" } }

          L "=== Media Foundation (may not be installed on Server edition) ==="
          try { $mf = Get-WindowsFeature Server-Media-Foundation -EA Stop; L "Server-Media-Foundation: $($mf.InstallState)"
                if ($mf.InstallState -ne 'Installed') { $r = Install-WindowsFeature Server-Media-Foundation -EA Stop; L "Installation result: Success=$($r.Success) Restart=$($r.RestartNeeded)" } }
          catch { L "Media Foundation check failed: $($_.Exception.Message)" }
          L "=== Dependency processing completed ==="

      # ------------------------------------------------------------------
      - name: 4. Run setup.exe, auto-interact with full screenshots, then launch main program
        timeout-minutes: 60
        env:
          SETUP_TIMEOUT_MIN: ${{ inputs.setup_timeout_min || '35' }}
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type -TypeDefinition @'
          using System;
          using System.Text;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;

          public class UiCtl {
            public IntPtr Hwnd;
            public string Cls;
            public string Txt;
            public bool Enabled;
            public bool Visible;
            public int Left;
            public int Top;
            public int Right;
            public int Bottom;
          }

          public static class Ui32 {
            public delegate bool EnumProc(IntPtr hWnd, IntPtr lParam);
            public const uint BM_CLICK = 0x00F5;
            public const uint BM_GETCHECK = 0x00F0;
            public const int GWL_STYLE = -16;
            private const uint WM_SETTEXT = 0x000C;
            private const uint WM_GETTEXT = 0x000D;
            private const uint SMTO_ABORTIFHUNG = 0x0002;

            [StructLayout(LayoutKind.Sequential)]
            public struct RECT {
              public int Left;
              public int Top;
              public int Right;
              public int Bottom;
            }

            [DllImport("user32.dll")]
            public static extern bool EnumWindows(EnumProc cb, IntPtr l);

            [DllImport("user32.dll")]
            public static extern bool EnumChildWindows(IntPtr h, EnumProc cb, IntPtr l);

            [DllImport("user32.dll", CharSet=CharSet.Unicode)]
            public static extern int GetWindowText(IntPtr h, StringBuilder s, int n);

            [DllImport("user32.dll", CharSet=CharSet.Unicode)]
            public static extern int GetClassName(IntPtr h, StringBuilder s, int n);

            [DllImport("user32.dll")]
            public static extern bool IsWindowVisible(IntPtr h);

            [DllImport("user32.dll")]
            public static extern bool IsWindowEnabled(IntPtr h);

            [DllImport("user32.dll")]
            public static extern bool ShowWindow(IntPtr h, int c);

            [DllImport("user32.dll")]
            public static extern bool SetForegroundWindow(IntPtr h);

            [DllImport("user32.dll")]
            public static extern bool BringWindowToTop(IntPtr h);

            [DllImport("user32.dll")]
            public static extern IntPtr GetForegroundWindow();

            [DllImport("user32.dll")]
            public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);

            [DllImport("kernel32.dll")]
            public static extern uint GetCurrentThreadId();

            [DllImport("user32.dll")]
            public static extern bool AttachThreadInput(uint a, uint b, bool f);

            [DllImport("user32.dll")]
            public static extern IntPtr SendMessage(IntPtr h, uint m, IntPtr w, IntPtr l);

            [DllImport("user32.dll", EntryPoint="SendMessageTimeoutW", CharSet=CharSet.Unicode, SetLastError=true)]
            private static extern IntPtr SendMessageTimeoutText(
              IntPtr h, uint m, IntPtr w,
              [MarshalAs(UnmanagedType.LPWStr)] string text,
              uint flags, uint timeout, out IntPtr result);

            [DllImport("user32.dll", EntryPoint="SendMessageTimeoutW", CharSet=CharSet.Unicode, SetLastError=true)]
            private static extern IntPtr SendMessageTimeoutBuffer(
              IntPtr h, uint m, IntPtr w,
              [Out, MarshalAs(UnmanagedType.LPWStr)] StringBuilder text,
              uint flags, uint timeout, out IntPtr result);

            [DllImport("user32.dll", EntryPoint="GetWindowLongPtrW")]
            public static extern IntPtr GetWindowLongPtr(IntPtr h, int i);

            [DllImport("user32.dll")]
            public static extern bool GetWindowRect(IntPtr h, out RECT r);

            [DllImport("user32.dll")]
            public static extern bool SetCursorPos(int x, int y);

            [DllImport("user32.dll")]
            public static extern void mouse_event(uint f, uint x, uint y, uint d, UIntPtr e);

            [DllImport("user32.dll")]
            public static extern bool SetProcessDPIAware();

            private static string TxtOf(IntPtr h) {
              var b = new StringBuilder(1024);
              GetWindowText(h, b, 1024);
              return b.ToString();
            }

            private static string ClsOf(IntPtr h) {
              var b = new StringBuilder(256);
              GetClassName(h, b, 256);
              return b.ToString();
            }

            public static UiCtl New(IntPtr h) {
              var c = new UiCtl();
              c.Hwnd = h;
              c.Cls = ClsOf(h);
              c.Txt = TxtOf(h);
              c.Enabled = IsWindowEnabled(h);
              c.Visible = IsWindowVisible(h);
              RECT r;
              GetWindowRect(h, out r);
              c.Left = r.Left;
              c.Top = r.Top;
              c.Right = r.Right;
              c.Bottom = r.Bottom;
              return c;
            }

            public static List<UiCtl> Tops() {
              var list = new List<UiCtl>();
              EnumWindows(delegate(IntPtr h, IntPtr l) {
                if (IsWindowVisible(h)) list.Add(New(h));
                return true;
              }, IntPtr.Zero);
              return list;
            }

            public static List<UiCtl> Kids(IntPtr parent) {
              var list = new List<UiCtl>();
              EnumChildWindows(parent, delegate(IntPtr h, IntPtr l) {
                list.Add(New(h));
                return true;
              }, IntPtr.Zero);
              return list;
            }

            public static int ProcId(IntPtr h) {
              uint p;
              GetWindowThreadProcessId(h, out p);
              return (int)p;
            }

            public static void Focus(IntPtr h) {
              uint ignored;
              IntPtr fg = GetForegroundWindow();
              uint fgTid = 0;
              if (fg != IntPtr.Zero) fgTid = GetWindowThreadProcessId(fg, out ignored);
              uint me = GetCurrentThreadId();
              bool attached = false;
              try {
                if (fgTid != 0 && fgTid != me) {
                  attached = AttachThreadInput(fgTid, me, true);
                }
                ShowWindow(h, 9);
                BringWindowToTop(h);
                SetForegroundWindow(h);
              } finally {
                if (attached) AttachThreadInput(fgTid, me, false);
              }
            }

            public static int Check(IntPtr h) {
              return (int)SendMessage(h, BM_GETCHECK, IntPtr.Zero, IntPtr.Zero);
            }

            public static void Click(IntPtr h) {
              SendMessage(h, BM_CLICK, IntPtr.Zero, IntPtr.Zero);
            }

            public static bool IsRadio(IntPtr h) {
              long style = GetWindowLongPtr(h, GWL_STYLE).ToInt64();
              int type = (int)(style & 0xF);
              return type == 4 || type == 9;
            }

            public static bool SetControlText(IntPtr h, string text) {
              IntPtr result;
              IntPtr sent = SendMessageTimeoutText(
                h, WM_SETTEXT, IntPtr.Zero, text,
                SMTO_ABORTIFHUNG, 2000, out result);
              return sent != IntPtr.Zero;
            }

            public static string ReadControlText(IntPtr h) {
              var b = new StringBuilder(2048);
              IntPtr result;
              IntPtr sent = SendMessageTimeoutBuffer(
                h, WM_GETTEXT, new IntPtr(b.Capacity), b,
                SMTO_ABORTIFHUNG, 2000, out result);
              if (sent == IntPtr.Zero) return "";
              return b.ToString();
            }

            public static void RealClick(IntPtr h) {
              RECT r;
              if (!GetWindowRect(h, out r)) return;
              SetCursorPos((r.Left + r.Right) / 2, (r.Top + r.Bottom) / 2);
              System.Threading.Thread.Sleep(120);
              mouse_event(2, 0, 0, 0, UIntPtr.Zero);
              mouse_event(4, 0, 0, 0, UIntPtr.Zero);
            }

            public static void ClickAt(int x, int y) {
              SetCursorPos(x, y);
              System.Threading.Thread.Sleep(120);
              mouse_event(2, 0, 0, 0, UIntPtr.Zero);
              mouse_event(4, 0, 0, 0, UIntPtr.Zero);
            }
          }
          '@
          [void][Ui32]::SetProcessDPIAware()

          $shots = "$env:OUT\shots"
          $log = "$env:OUT\logs\setup-ui.txt"
          function L($m){ $s = "[$(Get-Date -f HH:mm:ss.fff)] $m"; Write-Host $s; Add-Content $log $s }
          function Shot($tag){
            try {
              $r = [System.Windows.Forms.SystemInformation]::VirtualScreen
              $b = New-Object System.Drawing.Bitmap $r.Width, $r.Height
              $g = [System.Drawing.Graphics]::FromImage($b)
              $g.CopyFromScreen($r.Left, $r.Top, 0, 0, $b.Size)
              $t = ($tag -replace '[^\w\-]', '_')
              if ($t.Length -gt 50) { $t = $t.Substring(0,50) }
              $b.Save("$shots\K_$(Get-Date -f HHmmss_fff)_$t.png", [System.Drawing.Imaging.ImageFormat]::Png)
              $g.Dispose()
              $b.Dispose()
            } catch {
              L "screenshot failed: $($_.Exception.Message)"
            }
          }

          # Background timeline screenshots: one image every 1.5 seconds.
          $job = Start-Job -ArgumentList $shots -ScriptBlock {
            param($d)
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $i = 0
            while (-not (Test-Path "$d\STOP")) {
              try {
                $r = [System.Windows.Forms.SystemInformation]::VirtualScreen
                $b = New-Object System.Drawing.Bitmap $r.Width, $r.Height
                $g = [System.Drawing.Graphics]::FromImage($b)
                $g.CopyFromScreen($r.Left, $r.Top, 0, 0, $b.Size)
                $b.Save(("$d\F_{0:D4}_{1}.jpg" -f (++$i), (Get-Date -f HHmmss)), [System.Drawing.Imaging.ImageFormat]::Jpeg)
                $g.Dispose()
                $b.Dispose()
              } catch {}
              Start-Sleep -Milliseconds 1500
            }
          }

          $wshell = New-Object -ComObject WScript.Shell

          $installerProcs = '^(setup|setup64|msiexec|ISBEW64|IDriver|IDriver2|_isdel|ikernel|jre.*|javaw|java|vjredist|install|dotnetfx20|isnetfx|dxwebsetup|dxsetup|haspdinst|sentinel.*|scenarist.*)$'
          $titleRx = '(?i)Scenarist|InstallShield|Java|J#|\.NET Framework|Sentinel|HASP|Installer|Install|Program Compatibility|Security Warning|Visual C\+\+'
          $neverRx = '(?i)cancel|back|exit|abort|restart now|reboot now|remove|repair|modify|print'
          $normalOrder = @('(?i)^&?Install\b', '(?i)^&?Next', '(?i)^&?Finish', '(?i)^&?Yes\b', '(?i)^&?OK\b', '(?i)^&?Continue', '(?i)^&?Run\b', '(?i)^&?Close\b')
          $rebootOrder = @('(?i)^&?No\b', '(?i)^&?Later\b', '(?i)^&?Finish', '(?i)^&?OK\b', '(?i)^&?Close\b')
          $waitRx = '(?i)installing|copying files|please wait|removing|validating|progress'
          $serialRx = '(?i)serial number|license key|activation key|registration code|product key|cd.?key|unlock code|authorization code'
          $licenseRx = '(?i)license agreement|end user license|terms of use|terms and conditions'

          $seen = @{}
          $clicked = @{}
          $fieldAttempts = @{}
          $fieldAttemptTime = @{}
          $warned = @{}
          $script:didInstall = $false
          $script:pageBlocksKeys = $false

          function Clean-Text([string]$s) {
            if (-not $s) { return "" }
            $t = $s.Replace("&","").Replace("<","").Replace(">","").Replace(".","").Replace(",","").Trim().ToLowerInvariant()
            while ($t.Contains("  ")) { $t = $t.Replace("  "," ") }
            return $t
          }

          function Get-TopWindows {
            $res = New-Object System.Collections.ArrayList
            foreach ($t in [Ui32]::Tops()) {
              if (-not $t.Visible -or [string]::IsNullOrWhiteSpace($t.Txt)) { continue }
              if ($t.Txt -match 'ProgramData\\GitHub|hosted-compute|Runner\.Listener') { continue }
              $procName = ""
              try { $procName = (Get-Process -Id ([Ui32]::ProcId($t.Hwnd)) -ErrorAction Stop).ProcessName } catch { continue }
              if ($procName -match '^(powershell|pwsh|conhost|WindowsTerminal|explorer|Taskmgr|WmiPrvSE)$') { continue }
              if (($procName -match $installerProcs) -or ($t.Txt -match $titleRx)) {
                [void]$res.Add([pscustomobject]@{ H=$t.Hwnd; Title=$t.Txt; Cls=$t.Cls; Proc=$procName })
              }
            }
            return @($res | Sort-Object @{ Expression = {
              if ($_.Title -eq 'Scenarist BD') { 0 }
              elseif ($_.Cls -eq '#32770') { 1 }
              elseif ($_.Title -match '(?i)InstallShield') { 3 }
              else { 2 }
            } })
          }

          function Get-ChildControls([IntPtr]$parent) {
            return @([Ui32]::Kids($parent))
          }

          function Get-ControlValue($control) {
            if (-not $control) { return "" }
            try {
              $value = [Ui32]::ReadControlText($control.Hwnd)
              if ($null -ne $value) { return [string]$value }
            } catch {}
            return [string]$control.Txt
          }

          function Find-EditBelowLabel($label, $edits, [long]$excludeHandle) {
            if (-not $label -or $edits.Count -eq 0) { return $null }

            $candidates = @($edits | Where-Object {
              ($excludeHandle -eq 0 -or $_.Hwnd.ToInt64() -ne $excludeHandle) -and
              $_.Top -ge ($label.Top - 2) -and
              $_.Top -le ($label.Bottom + 55) -and
              [Math]::Abs($_.Left - $label.Left) -le 100
            })

            if ($candidates.Count -eq 0) {
              $candidates = @($edits | Where-Object {
                ($excludeHandle -eq 0 -or $_.Hwnd.ToInt64() -ne $excludeHandle) -and
                $_.Top -ge ($label.Top - 2) -and
                $_.Top -le ($label.Bottom + 70)
              })
            }

            if ($candidates.Count -eq 0) { return $null }

            return ($candidates |
              Sort-Object `
                @{ Expression = { [Math]::Abs($_.Top - $label.Bottom) } },
                @{ Expression = { [Math]::Abs($_.Left - $label.Left) } } |
              Select-Object -First 1)
          }

          function Set-CustomerValue([IntPtr]$windowHandle, $edit, $label, [string]$value, [string]$fieldName) {
            if (-not $edit -and -not $label) {
              L "customer page: could not locate the $fieldName field or its label"
              return $false
            }

            $key = if ($edit) {
              "edit|" + $edit.Hwnd.ToInt64() + "|" + $fieldName
            } else {
              "label|" + $label.Hwnd.ToInt64() + "|" + $fieldName
            }

            $current = ""
            if ($edit) { $current = Get-ControlValue $edit }
            if ($current.Trim() -eq $value) {
              L "customer page: $fieldName already contains the requested value"
              return $false
            }

            if ($fieldAttempts.ContainsKey($key) -and $fieldAttempts[$key] -ge 2) { return $false }
            if ($fieldAttemptTime.ContainsKey($key) -and ((Get-Date) - $fieldAttemptTime[$key]).TotalSeconds -lt 3) { return $false }

            if (-not $fieldAttempts.ContainsKey($key)) { $fieldAttempts[$key] = 0 }
            $fieldAttempts[$key] = $fieldAttempts[$key] + 1
            $fieldAttemptTime[$key] = Get-Date

            [Ui32]::Focus($windowHandle)
            Start-Sleep -Milliseconds 150

            if ($edit) {
              $wmSet = $false
              try { $wmSet = [Ui32]::SetControlText($edit.Hwnd, $value) } catch {}
              Start-Sleep -Milliseconds 200
              $afterSet = Get-ControlValue $edit
              L ("customer page: WM_SETTEXT field={0} sent={1} readback='{2}'" -f $fieldName, $wmSet, $afterSet)

              # Follow with real keyboard entry so the installer receives normal edit notifications.
              [Ui32]::Focus($windowHandle)
              [Ui32]::RealClick($edit.Hwnd)
            } else {
              $root = [Ui32]::New($windowHandle)
              $x = [int]($label.Left + 150)
              $y = [int]($label.Bottom + 10)
              if ($x -lt ($root.Left + 10) -or $x -gt ($root.Right - 10) -or
                  $y -lt ($root.Top + 30) -or $y -gt ($root.Bottom - 25)) {
                L "customer page: label-based coordinate for $fieldName is outside the dialog; not typing"
                return $false
              }
              L ("customer page: using label-relative input position for {0} at {1},{2}" -f $fieldName, $x, $y)
              [Ui32]::ClickAt($x, $y)
            }

            Start-Sleep -Milliseconds 200
            $wshell.SendKeys('^a')
            $wshell.SendKeys($value)
            Start-Sleep -Milliseconds 300

            $readback = ""
            if ($edit) { $readback = Get-ControlValue $edit }
            if ($readback.Trim() -eq $value) {
              L "customer page: entered and verified $fieldName"
            } else {
              L ("customer page: sent {0} to {1}; readback='{2}'" -f $value, $fieldName, $readback)
            }
            Shot ("customer_" + $fieldName)
            return $true
          }

          function Invoke-Page($win) {
            $script:pageBlocksKeys = $false
            $winH = $win.H
            [Ui32]::Focus($winH)
            Start-Sleep -Milliseconds 150

            $kids = @(Get-ChildControls $winH)
            if ($kids.Count -eq 0) { return $false }

            $buttons = @($kids | Where-Object { $_.Cls -match '(?i)^button$' })
            $textList = @($kids | Where-Object { $_.Txt } | ForEach-Object { $_.Txt })
            $pageText = ($textList -join ' | ')

            $signatureParts = @()
            foreach ($c in $kids) {
              $text = $c.Txt
              if ($c.Cls -match '(?i)edit|textbox|textentry') {
                $editText = Get-ControlValue $c
                if (-not [string]::IsNullOrEmpty($editText)) { $text = $editText }
              }
              $signatureParts += ("{0}:{1}:{2}:{3}" -f $c.Cls, $text, $c.Enabled, $c.Visible)
            }
            $sig = $signatureParts -join ';'
            $fp = ('{0}|{1}' -f $winH, $sig)

            if (-not $seen.ContainsKey($fp)) {
              $seen[$fp] = 1
              L ("== window title='{0}' class='{1}' proc='{2}' children={3}" -f $win.Title, $win.Cls, $win.Proc, $kids.Count)
              L ("   texts: {0}" -f $pageText)
              L ("   buttons: {0}" -f (($buttons | ForEach-Object { '{0}[en={1}]' -f $_.Txt, $_.Enabled }) -join ' | '))
              foreach ($c in $kids) {
                L ("   child class={0} text='{1}' visible={2} enabled={3} rect={4},{5}-{6},{7}" -f
                  $c.Cls, $c.Txt, $c.Visible, $c.Enabled, $c.Left, $c.Top, $c.Right, $c.Bottom)
              }
              Shot ('page_' + $win.Title)
            }

            $isError = ($win.Title -match '(?i)\berror\b|failed') -or
                       ($pageText -match '(?i)fatal error|installation (has )?failed|not supported|could not install')
            if ($isError) { throw "installer error dialog detected: '$($win.Title)'" }

            # Handle Customer Information before serial-key detection because this page also mentions a serial number.
            $isCustomer = ($pageText -match '(?i)customer information') -or
                          (($pageText -match '(?i)user\s*name') -and ($pageText -match '(?i)company\s*\(required\)'))
            if ($isCustomer) {
              $script:pageBlocksKeys = $true

              $userLabel = $kids |
                Where-Object { $_.Txt -match '(?i)user\s*name' } |
                Sort-Object Top, Left |
                Select-Object -First 1
              $companyLabel = $kids |
                Where-Object { $_.Txt -match '(?i)company\s*\(required\)' } |
                Sort-Object Top, Left |
                Select-Object -First 1

              $edits = @($kids |
                Where-Object {
                  $_.Visible -and $_.Enabled -and
                  $_.Cls -match '(?i)edit|textbox|textentry' -and
                  ($_.Right - $_.Left) -ge 100 -and
                  ($_.Bottom - $_.Top) -ge 10
                } |
                Sort-Object Top, Left)

              L ("customer page: labels user='{0}' company='{1}', editable controls={2}" -f
                $(if ($userLabel) { $userLabel.Txt } else { '' }),
                $(if ($companyLabel) { $companyLabel.Txt } else { '' }),
                $edits.Count)

              $userEdit = Find-EditBelowLabel $userLabel $edits 0
              $userHandle = if ($userEdit) { $userEdit.Hwnd.ToInt64() } else { 0 }
              $companyEdit = Find-EditBelowLabel $companyLabel $edits $userHandle

              # If labels could not be associated, use the first two visible edit-like controls top-to-bottom.
              if (-not $userEdit -and $edits.Count -gt 0) { $userEdit = $edits[0] }
              if (-not $companyEdit) {
                $remaining = @($edits | Where-Object {
                  -not $userEdit -or $_.Hwnd.ToInt64() -ne $userEdit.Hwnd.ToInt64()
                })
                if ($remaining.Count -gt 0) { $companyEdit = $remaining[0] }
              }

              $changed = $false
              if ($userEdit -or $userLabel) {
                if (Set-CustomerValue $winH $userEdit $userLabel 'Admin' 'UserName') { $changed = $true }
              } else {
                L "customer page: User Name field was not found"
              }

              if ($companyEdit -or $companyLabel) {
                if (Set-CustomerValue $winH $companyEdit $companyLabel 'Home' 'Company') { $changed = $true }
              } else {
                L "customer page: Company field was not found"
              }

              Start-Sleep -Milliseconds 300
              $afterKids = @(Get-ChildControls $winH)
              $next = $afterKids |
                Where-Object {
                  $_.Cls -match '(?i)^button$' -and
                  $_.Visible -and $_.Enabled -and
                  (Clean-Text $_.Txt) -eq 'next'
                } |
                Select-Object -First 1

              if ($next) {
                $ck = "$fp|customer-next"
                if (-not $clicked.ContainsKey($ck) -or ((Get-Date) - $clicked[$ck]).TotalSeconds -ge 8) {
                  L "customer page: both requested fields were entered; Next is enabled"
                  Shot 'customer_before_next'
                  [Ui32]::Focus($winH)
                  [Ui32]::Click($next.Hwnd)
                  $clicked[$ck] = Get-Date
                  Start-Sleep 2
                  Shot 'customer_after_next'
                  return $true
                }
              } else {
                $warningKey = "$fp|customer-next-disabled"
                if (-not $warned.ContainsKey($warningKey)) {
                  $warned[$warningKey] = $true
                  L "customer page: Next is still disabled after filling; inspect edit controls and screenshots"
                  L ("customer page: current buttons: {0}" -f
                    (($afterKids | Where-Object { $_.Cls -match '(?i)^button$' } |
                      ForEach-Object { '{0}[en={1}]' -f $_.Txt, $_.Enabled }) -join ' | '))
                  Shot 'customer_next_disabled'
                }
              }
              return $changed
            }

            $isSerial = $pageText -match $serialRx
            if ($isSerial) {
              $script:pageBlocksKeys = $true
              L "serial or license-key page detected; leaving it for manual review"
              Shot 'serial_page'
              return $false
            }

            $isReboot = $pageText -match '(?i)restart|reboot'
            $isLicense = $pageText -match '(?i)license agreement|end user license|terms in the license'
            $hasProgress = $false
            foreach ($c in $kids) {
              if ($c.Cls -match '(?i)msctls_progress|progress') { $hasProgress = $true; break }
            }
            $isWaiting = ($pageText -match $waitRx) -or $hasProgress

            if ($isReboot -or $isLicense -or $isWaiting) { $script:pageBlocksKeys = $true }

            if ($isWaiting -and -not $isReboot) { return $true }

            # Reboot prompt: choose an explicit safe option only.
            if ($isReboot) {
              $safeChoice = $buttons |
                Where-Object {
                  $_.Visible -and $_.Enabled -and
                  (Clean-Text $_.Txt) -match '^(no|later|restart later|reboot later)$'
                } |
                Select-Object -First 1
              if ($safeChoice) {
                L ("reboot page: clicking safe option '{0}'" -f $safeChoice.Txt)
                Shot 'before_defer_reboot'
                [Ui32]::Focus($winH)
                [Ui32]::Click($safeChoice.Hwnd)
                Start-Sleep 2
                Shot 'after_defer_reboot'
                return $true
              }
              L "reboot page detected but no explicit No/Later button was found; not sending input"
              return $false
            }

            # License agreement: select the positive radio, never the denial option.
            if ($isLicense) {
              $accept = $buttons |
                Where-Object {
                  $_.Visible -and $_.Enabled -and
                  (Test-Radio $_) -and
                  (Clean-Text $_.Txt) -match '(?i)^i\s+accept\b' -and
                  (Clean-Text $_.Txt) -notmatch '(?i)do not|not accept|disagree'
                } |
                Select-Object -First 1

              if (-not $accept) {
                $accept = $buttons |
                  Where-Object {
                    $_.Visible -and $_.Enabled -and
                    (Test-Radio $_) -and
                    (Clean-Text $_.Txt) -notmatch '(?i)do not|not accept|disagree'
                  } |
                  Sort-Object Top, Left |
                  Select-Object -First 1
              }

              if ($accept -and [Ui32]::Check($accept.Hwnd) -ne 1) {
                L ("license page: selecting '{0}'" -f $accept.Txt)
                Shot 'before_accept_license'
                [Ui32]::Focus($winH)
                [Ui32]::Click($accept.Hwnd)
                Start-Sleep -Milliseconds 700
                if ([Ui32]::Check($accept.Hwnd) -ne 1) {
                  L "license BM_CLICK did not check the radio; using a real mouse click"
                  [Ui32]::RealClick($accept.Hwnd)
                  Start-Sleep -Milliseconds 700
                }
                L ("license selection state: {0}" -f [Ui32]::Check($accept.Hwnd))
                Shot 'after_accept_license'

                $afterAccept = @(Get-ChildControls $winH)
                $nextAfterAccept = $afterAccept |
                  Where-Object {
                    $_.Cls -match '(?i)^button$' -and
                    $_.Visible -and $_.Enabled -and
                    (Clean-Text $_.Txt) -eq 'next'
                  } |
                  Select-Object -First 1
                if ($nextAfterAccept) {
                  L "license page: Next is enabled after accepting; clicking it"
                  Shot 'before_next_after_accept'
                  [Ui32]::Click($nextAfterAccept.Hwnd)
                  Start-Sleep 2
                  Shot 'after_next_after_accept'
                }
                return $true
              }
            }

            # Click enabled wizard buttons by priority.
            $order = if ($isReboot) { $rebootOrder } else { $normalOrder }
            foreach ($want in $order) {
              $b = $buttons |
                Where-Object {
                  $_.Visible -and $_.Enabled -and
                  (Clean-Text $_.Txt) -eq $want -and
                  $_.Txt -notmatch $neverRx
                } |
                Select-Object -First 1

              if (-not $b) {
                $b = $buttons |
                  Where-Object {
                    $_.Visible -and $_.Enabled -and
                    (Clean-Text $_.Txt).Contains($want) -and
                    $_.Txt -notmatch $neverRx
                  } |
                  Select-Object -First 1
              }

              if (-not $b) { continue }
              $ck = "$fp|$($b.Txt)"
              if ($clicked.ContainsKey($ck) -and ((Get-Date) - $clicked[$ck]).TotalSeconds -lt 8) { continue }

              L ("clicking '{0}' via BM_CLICK on '{1}'" -f $b.Txt, $win.Title)
              Shot ('before_' + $b.Txt)
              [Ui32]::Focus($winH)
              [Ui32]::Click($b.Hwnd)
              $clicked[$ck] = Get-Date
              if ((Clean-Text $b.Txt) -eq 'install') {
                $script:didInstall = $true
                L "Install clicked; keyboard fallback is disabled from this point onward"
              }
              Start-Sleep 2
              Shot ('after_' + $b.Txt)
              return $true
            }

            return $false
          }

          # Main flow
          try {
            Shot 'desktop_before_setup'
            $setup = Start-Process -FilePath $env:SETUP_EXE -WorkingDirectory $env:PKG_DIR -PassThru
            L ("setup.exe started pid={0}  timeout={1} minutes" -f $setup.Id, $env:SETUP_TIMEOUT_MIN)

            $deadline = (Get-Date).AddMinutes([int]$env:SETUP_TIMEOUT_MIN)
            $quiet = 0
            $idle = 0
            $beat = Get-Date
            $finished = $false

            while ((Get-Date) -lt $deadline) {
              $wins = @(Get-WizardWindows)

              if ($wins.Count -eq 0) {
                $busy = @(Get-Process -ErrorAction SilentlyContinue | Where-Object {
                  $_.ProcessName -match '^(setup|setup64|ISBEW64|IDriver|IDriver2)$' -or
                  ($_.ProcessName -eq 'msiexec' -and $_.MainWindowHandle -ne 0)
                })
                $setup.Refresh()

                if ($setup.HasExited -and $busy.Count -eq 0) {
                  $quiet++
                  if ($quiet -ge 8) {
                    L "no installer window and no installer process; ending interaction"
                    $finished = $true
                    break
                  }
                } else {
                  $quiet = 0
                }

                Start-Sleep 1
                continue
              }

              $quiet = 0
              $acted = $false
              $blockedByPage = $false

              foreach ($w in $wins) {
                try {
                  $result = Invoke-Page $w
                  if ($script:pageBlocksKeys) { $blockedByPage = $true }
                  if ($result) {
                    $acted = $true
                    break
                  }
                } catch {
                  L ("page handling error: {0}" -f $_.Exception.Message)
                  throw
                }
              }

              if ($acted) {
                $idle = 0
                Start-Sleep -Milliseconds 500
              } elseif ($blockedByPage) {
                # Do not send Enter on license, customer, progress, reboot, or serial pages.
                $idle = 0
                Start-Sleep 1
              } else {
                $idle++
                if (-not $script:didInstall -and $idle -ge 4) {
                  $target = $wins[0]
                  [Ui32]::Focus($target.H)
                  Start-Sleep -Milliseconds 250
                  L ("idle {0}: sending Enter to '{1}'" -f $idle, $target.Title)
                  Shot ('idle_' + $idle)
                  try { $wshell.SendKeys('{ENTER}') } catch {}
                  Start-Sleep -Milliseconds 700
                  if ($idle -ge 8) {
                    try { $wshell.SendKeys('%n') } catch {}
                    Start-Sleep -Milliseconds 700
                  }
                  if ($idle -ge 16) { $idle = 0 }
                }
                Start-Sleep 1
              }

              if (((Get-Date) - $beat).TotalSeconds -ge 30) {
                $beat = Get-Date
                L ("heartbeat: windows={0} acted={1} setupExited={2} installClicked={3}" -f
                  $wins.Count, $acted, $setup.HasExited, $script:didInstall)
              }
            }

            if (-not $finished) { throw "installer did not finish within $env:SETUP_TIMEOUT_MIN minutes; inspect screenshots and setup-ui.txt" }
            if ($setup.ExitCode -ne 0) { throw "setup.exe exited with code $($setup.ExitCode)" }

            Shot 'after_setup'

            # Installation result and main program launch
            Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -EA SilentlyContinue |
              ? DisplayName | sort DisplayName | select DisplayName, DisplayVersion, InstallLocation | Format-Table -AutoSize | Out-String -Width 300 | Out-File "$env:OUT\logs\installed-programs.txt"

            $cands = @(Get-ChildItem 'C:\Program Files','C:\Program Files (x86)' -Recurse -Filter *.exe -EA SilentlyContinue |
              ? { $_.FullName -match '(?i)scenarist' -and $_.Name -notmatch '(?i)unins|setup|crash|update|helper' })
            $cands | % { L "candidate main program: $($_.FullName)" }

            $main = $cands |
              Sort-Object { if ($_.Name -match '(?i)^Scenarist\s*BD') { 0 } elseif ($_.Name -match '(?i)^Scenarist') { 1 } else { 2 } } |
              Select-Object -First 1

            if ($main) {
              L ("launching main program: {0} version {1}" -f $main.FullName, $main.VersionInfo.FileVersion)
              Start-Process $main.FullName -WorkingDirectory $main.DirectoryName
              for ($i = 1; $i -le 40; $i++) {
                Start-Sleep 3
                Shot ("main_{0:D2}" -f $i)
                if ($i % 10 -eq 0) {
                  Get-Process | Where-Object { $_.MainWindowTitle } |
                    ForEach-Object { L ("   window [{0}] {1}" -f $_.ProcessName, $_.MainWindowTitle) }
                }
              }
            } else {
              L "Scenarist main program exe was not found; installation probably did not complete"
              Shot 'no_main_exe'
            }
          } catch {
            L ("stage stopped: {0}" -f $_.Exception.Message)
            try { Shot 'stage_failure' } catch {}
            throw
          } finally {
            New-Item "$shots\STOP" -ItemType File -Force | Out-Null
            Wait-Job $job -Timeout 10 | Out-Null
            Remove-Job $job -Force -ErrorAction SilentlyContinue
            Remove-Item "$shots\STOP" -ErrorAction SilentlyContinue
            L "total screenshots: $((Get-ChildItem $shots -File).Count)"
          }

      # ------------------------------------------------------------------
      - name: 5. Upload screenshots and logs regardless of result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scenarist-bd-screenshots-${{ github.run_number }}
          path: out
          if-no-files-found: warn
          retention-days: 14
