name: Tablet Test Workflow

# 触发条件：支持 Push 自动触发，也支持在网页 Actions 页面手动点击运行
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  mobile-browser-test:
    name: Run Hello World Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Print Welcome Message
        run: |
          echo "=========================================="
          echo " Hello! GitHub Actions is working cleanly!"
          echo " Executed from Android Tablet Browser"
          echo " System Time: $(date)"
          echo "=========================================="

      - name: Check Environment Info
        run: |
          uname -a
          df -h
